# CI for a Coworld game repo (Metta-AI/cogame-battlecode).
#
# Goes to:  .github/workflows/ci.yml  in the coworld repo.
# Substitute: battlecode  (lowercase game slug, e.g. bullwhip)
#             cogame-battlecode (local image name WITHOUT a tag, must match the image in
#                      compose.yaml minus ":latest", e.g. coworld-bullwhip)
#             2 (seat count -- a CROSS-CHECK, not a fallback:
#                      docker_smoke.sh takes the seat count solely from
#                      certification.game_config.num_agents and hard-fails if
#                      this value disagrees with it)
#
# The coworld-builder sandbox has no docker, no nim, no emsdk and no browser:
# this workflow is the ONLY place those toolchains run. Phase 20's exit
# criterion is this workflow green on main.
#
# It also needs tools/ci/viewer_smoke.mjs (copied verbatim from coworld-builder
# templates/tools/ci/; no substitutions) -- the wasm-viewer job opens the built
# bundle in headless chromium and fails if the replay never renders.
name: CI

on:
  push:
    # `bc20-year-module` ... `bc25-year-module`, `bc16-year-module` and
    # `bc19-year-module` are the branches the second through NINTH year
    # modules land on. main's trigger semantics are untouched; this only
    # adds branches.
    branches: [ main, bc16-year-module, bc17-year-module, bc19-year-module,
                bc20-year-module, bc21-year-module, bc22-year-module,
                bc23-year-module, bc24-year-module, bc25-year-module ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLUG: battlecode
  IMAGE: cogame-battlecode
  # Pins mirror the Dockerfile build stage; bump both together.
  NIMBY_VERSION: "0.1.26"
  NIM_VERSION: "2.2.4"
  # The Battlecode engine this port is a port OF. Sources are used at CI time
  # by the constants generator, the map converter and the parity oracle; the
  # jar is used ONLY by the parity oracle. Neither is in any runtime image.
  ENGINE_TAG: "engine.1.2.5"
  ENGINE_JAR_URL: "https://releases.battlecode.org/maven/org/battlecode/battlecode26-java/1.2.5/battlecode26-java-1.2.5.jar"
  SCALA_JAR_URL: "https://repo1.maven.org/maven2/org/scala-lang/scala-library/2.11.7/scala-library-2.11.7.jar"
  # The Battlecode 2020 sources the `bc20` year module is a port OF. Used at CI
  # time by the constants generator, the map converter, the sprite cutter and
  # the bc20 parity oracle. There is no JDK in any image stage.
  BC20_COMMIT: "7618f6be7d12da39f2e6e25801e578f1fecfbd86"
  # The Battlecode 2021 sources the `bc21` year module is a port OF (release
  # 2021.3.0.5, the last of the season). Used at CI time by the constants
  # generator, the map converter, the sprite cutter and the bc21 parity
  # oracle. There is no JDK in any image stage.
  BC21_COMMIT: "ed39c1a49574db57e5463d720736220506280294"
  # The Battlecode 2024 sources the `bc24` year module is a port OF. Used at CI
  # time by the constants generator, the map converter, the sprite cutter and
  # the bc24 parity oracle; the PUBLISHED JAR (sha256 pinned in
  # tools/oracle/bc24/jar.lock) is used only by that oracle. There is no JDK in
  # any image stage.
  BC24_COMMIT: "166c79bbf4156c866caf434062cb1f403c01695f"
  BC24_JAR_URL: "https://releases.battlecode.org/maven/org/battlecode/battlecode24/3.0.5/battlecode24-3.0.5.jar"
  # The Battlecode 2025 sources the `bc25` year module is a port OF. Used at CI
  # time by the constants generator, the map converter, the sprite cutter and
  # the bc25 parity oracle; the PUBLISHED FAT JAR (sha256 pinned in
  # tools/oracle/bc25/jar.lock) is used only by that oracle, and it is
  # SELF-CONTAINED -- 6413 entries, all 182 battlecode classes, every bundled
  # dependency and all 75 .map25 resources -- so there is no Gradle, no jsi
  # shim, no Maven download list and no deps.lock in that job. There is no JDK
  # in any image stage.
  BC25_COMMIT: "28975a487c1a30ed2b5bed644fe6ecd2c3dd1482"
  # The Battlecode 2023 sources the `bc23` year module is a port OF. Used at
  # CI time by the constants generator, the map converter, the sprite cutter
  # and the bc23 parity oracle; the PUBLISHED FAT JAR (sha256 AND size pinned
  # in tools/oracle/bc23/jar.lock) is used only by that oracle, and it is
  # SELF-CONTAINED -- 11566 entries, every battlecode class, every bundled
  # dependency INCLUDING net.sf.jsi and gnu.trove, and all 103 .map23
  # resources -- so there is no Gradle, no jsi shim, no Maven download list
  # and no deps.lock in that job. There is no JDK in any image stage.
  #
  # THE ORACLE RUNS ON TEMURIN 8 AND THAT IS NOT NEGOTIABLE: the jar bundles
  # ASM 5.0.4, and under JDK 21 the instrumenter throws inside
  # ClassReader.<init> on every player class load, no robot is ever built,
  # and the job exits 0 (docs/PARITY.md section bc23).
  BC23_COMMIT: "af42086ecd09709dc603b2aaa9e9b98312c9ef79"
  BC23_JAR_URL: "https://releases.battlecode.org/maven/org/battlecode/battlecode23/3.0.15/battlecode23-3.0.15.jar"
  # The Battlecode 2022 sources the `bc22` year module is a port OF. Used at
  # CI time by the constants generator, the map converter, the sprite cutter
  # and the bc22 parity oracle; the PUBLISHED FAT JAR (sha256 AND size pinned
  # in tools/oracle/bc22/jar.lock) is used only by that oracle, and it is
  # SELF-CONTAINED -- 11549 entries, every battlecode class, every bundled
  # dependency INCLUDING net.sf.jsi and gnu.trove (trove4j 3.0.3), plus
  # MethodCosts.txt and all 75 .map22 resources -- so there is no Gradle, no
  # jsi shim, no Maven download list and no deps.lock in that job. There is no
  # JDK in any image stage.
  #
  # THE ORACLE RUNS ON TEMURIN 8 AND THAT IS NOT NEGOTIABLE: engine/build.gradle
  # sets sourceCompatibility 1.8 and declares org.ow2.asm:asm:5.0.4, and under
  # JDK 21 the instrumenter throws IllegalArgumentException inside
  # ClassReader.<init> (from TeamClassLoaderFactory.normalReader via
  # MethodCostUtil.getMethodData) on EVERY player class load; every robot dies
  # as it spawns, NO ROBOT IS EVER BUILT, the game ends at round 1 with
  # ANNIHILATION after six trace lines, and the job would exit 0. That is the
  # exact "green oracle proving nothing" trap (docs/PARITY.md section bc22).
  BC22_COMMIT: "6ed05b679c0822e9bbe332812ff5655812dd023e"
  BC22_JAR_URL: "https://releases.battlecode.org/maven/org/battlecode/battlecode22/2.2.1/battlecode22-2.2.1.jar"

  # --- bc16, the EIGHTH year module and the first pre-2020 one -------------
  # THE OFFICIAL 2016 SPECIFICATION IS LOST (dead S3 bucket, dead
  # battlecode.org, no Wayback copy), so the ENGINE SOURCE IS THE SPEC and
  # every rule in the port carries a file:line into this checkout. Both 2016
  # upstreams are GPL-3.0 rather than AGPL-3.0 -- the first time this
  # repository has taken in GPL-3.0 material -- and `NOTICE` records the
  # GPL-3.0 section 13 reasoning that makes AGPL-3.0 a valid licence for the
  # combined work.
  #
  # The oracle jar is pinned by URL, SIZE and SHA256 in
  # tools/oracle/bc16/jar.lock and is SELF-CONTAINED: it bundles its own ASM,
  # XStream, Jackson and commons-lang3 and carries 54 `.xml` map resources, so
  # the parity job needs no Ant, no Ivy, no Gradle, no shim, no Maven list and
  # no `--map-dir`. IT MUST RUN ON TEMURIN 8.
  BC16_COMMIT: "11a0b09f26a70da19f33a61ebec4ceaf6e161aa3"
  BC16_CLIENT_COMMIT: "317e1f3ff902ae568619c051813335ecdd72322c"
  BC16_JAR_URL: "https://s3.amazonaws.com/battlecode-releases-2016/releases/battlecode-2016.0.2.2.jar"

  # --- bc19, the NINTH year module and THE FIRST WHOSE ENGINE IS JAVASCRIPT
  # There is no jar and there is no JVM anywhere in this year: the 2019
  # engine is `coldbrew/`, a handful of CommonJS files, and the parity
  # oracle drives its `Game` and `ActionRecord` DIRECTLY under
  # `actions/setup-node`. NO NODE, NO NPM, NO JS RUNTIME AND NO JDK EXISTS
  # IN ANY IMAGE STAGE -- the year's JavaScript lives only in
  # `parity-oracle-bc19` and in `tools/gen_maps_bc19.mjs`, which runs at
  # build time.
  #
  # THE NODE VERSION IS A RULES PIN, NOT A PREFERENCE. `coldbrew/game.js:153`
  # passes `regions.sort` a ONE-ARGUMENT, SIGN-CONSTANT COMPARATOR, so the
  # map generator's output is V8-IMPLEMENTATION-DEFINED. The 22 committed
  # boards were generated under exactly this version and
  # `parity-oracle-bc19` byte-diffs them; if a future Node bump makes that
  # diff fail, THE COMMITTED MAPS ARE THE RULES AND THE OLD NODE IS THE PIN
  # (docs/PARITY.md section bc19).
  #
  # The oracle installs EXACTLY ONE npm package. The engine's own
  # `package.json` pulls 404, including `vm2` (deprecated, known
  # sandbox-escape CVEs) and `update-notifier` (a network call on every
  # `cli/run.js` invocation); the trace driver needs `game.js`,
  # `action_record.js`, `specs.json` and `mersenne-twister` and nothing else.
  BC19_COMMIT: "80cf1cc535ec5a30559274aa1b49807ad4859925"
  BC19_NODE_VERSION: "22.22.0"
  BC19_MT_VERSION: "1.1.0"
  BC19_MT_INTEGRITY: "sha1-+RZhjuQ9cXnvz2Qb7EUx65Zwl4o="

  # --- bc17, the TENTH year module and THE ONLY CONTINUOUS-SPACE ONE ------
  # 2017 is the float32 year: coordinates, radii, strides, bullet speeds,
  # attack powers, health and the whole tree economy are Java `float`, every
  # gameplay class is `strictfp`, and the transcendental surface is exactly
  # {sin, cos, atan2} -- ported from fdlibm into src/battlecode/fdlibm.nim
  # and pinned against the JVM's own StrictMath by
  # data/bc17/fdlibm_vectors.json (docs/RULES-BC17.md F1-F5).
  #
  # THE MAPS AND THE CONSTANTS COME OUT OF THE PINNED ORACLE JAR ITSELF, not
  # out of a source checkout: the jar is a FAT jar that carries all seventy
  # `battlecode/world/resources/*.map17` flatbuffers, so
  # tools/convert_maps_bc17.py reads them with `zipfile` and NO JVM at all.
  # The jar is pinned by URL, SIZE and SHA256 in tools/oracle/bc17/jar.lock.
  # There is no JDK, no JRE, no Java and no Node in any image stage.
  BC17_COMMIT: "165d8a8ef24f03e13a101bb8bc9f5b32dcb33c6c"
  BC17_CLIENT_COMMIT: "feb3e03820ba442ab233f05d2432b0dc2833aa98"
  BC17_JAR_URL: "http://battlecode-maven.s3-website-us-east-1.amazonaws.com/org/battlecode/battlecode/2017.1.6.2/battlecode-2017.1.6.2.jar"
  BC17_JAR_SHA256: "9254e89268fd6efb72cafc037e3eded006aefd1d19aa44195c945b43ceb7bff9"
  BC17_JAR_BYTES: "14576275"
  # The 2017 SCAFFOLD, AGPL-3.0, whose `src/examplefuncsplayer/RobotPlayer.java`
  # is committed VERBATIM at tools/oracle/bc17/examplefuncsplayer17/ and is
  # both the league's deliberately weak filler and one side of the
  # differential oracle. `parity-oracle-bc17` diffs the committed copy
  # against this commit's own file, so the ONLY difference between what the
  # scaffold shipped and what the oracle compiles is the committed
  # determinism.patch (NOTICE records the attribution).
  BC17_SCAFFOLD_COMMIT: "76e7b51e06088fdcce2f6a6b97aff21782ae20d0"

jobs:
  # ---------------------------------------------------------------------
  # Native Nim tests. Same nimby recipe as the Dockerfile build stage, so a
  # green test job means the image's compiler and package tree agree.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    # 110, not 75: the fourth year module adds twenty-one shards, and every
    # shard runs TWICE (debug and -d:release). The heaviest of them play full
    # 2000-round games with every range check on -- bc24's competence gate
    # plays eight of them in the debug pass alone. Its knob sweep is the one
    # shard whose SIGNED DELTAS are gated in release only, for the reason its
    # own header gives; the debug pass still runs the sweep.
    # 130, not 110: the SEVENTH year module adds sixteen shards, and every
    # shard runs TWICE (debug and -d:release). The measured CI wall clock on
    # this repo is ~65-75 min a round with six year modules (LEARNINGS
    # 2026-09-08), and the heaviest bc22 shards play whole 2000-round games
    # with every range check on -- its knob sweep plays seventy-two of them in
    # the debug pass alone.
    # 240, not 180: the TENTH year module adds twenty-two shards, and every
    # shard runs TWICE (debug and -d:release). bc17's are the heaviest in
    # the repo per game -- 3000 rounds of CONTINUOUS SPACE, with every
    # bullet resolved against every disc within reach -- and three of them
    # play whole matches: its survival gate plays six 3000-round games and
    # then RECOMPILES ITSELF with -d:bc17BrokenChassis and plays six more,
    # its knob sweep plays thirty-three, and its perf gate plays the two
    # tree-heaviest boards in the repository. Measured in phase 20 at
    # 13 s / 18 s / 15 s in release; the debug pass is several times that.
    # 180, not 150: the NINTH year module adds twenty-seven shards, and every
    # shard runs TWICE (debug and -d:release). bc19's shards are the
    # LIGHTEST in the repo -- 1000 rounds against bc16's 3000 and a measured
    # 0.03-0.10 s for a whole mirror game -- but there are a lot of them and
    # its knob sweep plays seventy-eight games in the debug pass alone.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) asset="nimby-Linux-X64" ;;
            arm64) asset="nimby-Linux-ARM64" ;;
            *) echo "::error::unsupported runner arch: $arch"; exit 1 ;;
          esac
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/${asset}"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: |
          set -euo pipefail
          if [ -f nimby.lock ]; then
            nimby --global sync nimby.lock
          else
            echo "no nimby.lock in the repo; skipping dependency sync"
          fi

      - name: Regenerate nim.cfg from the synced package tree
        # The committed nim.cfg pins the AUTHOR's machine package paths. Rebuild
        # it from this runner's ~/.nimby/pkgs, exactly as the Dockerfile does.
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg
          echo "::group::nim.cfg"
          cat nim.cfg
          echo "::endgroup::"

      # The constants generator and the map converter are checked against the
      # PINNED ENGINE SOURCES, not against a second reading of the spec:
      # tests/test_constants.nim and tests/test_maps.nim re-run them and
      # byte-diff when BC_ENGINE_DIR is set. Sources only -- no JVM runs here.
      - name: Fetch the pinned Battlecode engine sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine
          curl -fsSL \
            "https://github.com/battlecode/battlecode26/archive/refs/tags/${ENGINE_TAG}.tar.gz" \
            | tar xz -C /tmp/engine
          echo "BC_ENGINE_DIR=/tmp/engine/battlecode26-${ENGINE_TAG}" >> "$GITHUB_ENV"
          python3 -m pip install --quiet flatbuffers

      # The bc20 year module is generated from a SECOND pinned checkout, and
      # every generated artefact is re-generated here and byte-diffed: the
      # constants table, all eighteen converted maps and the sprite atlas cut
      # from the 2020 client. A hand-edited generated file fails the build.
      - name: Fetch the pinned Battlecode 2020 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine20
          curl -fsSL \
            "https://github.com/battlecode/battlecode20/archive/${BC20_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine20
          echo "BC20_DIR=/tmp/engine20/battlecode20-${BC20_COMMIT}" >> "$GITHUB_ENV"
          python3 -m pip install --quiet pillow

      - name: The bc20 generated files match the pinned 2020 sources
        run: |
          set -euo pipefail
          python3 tools/gen_year_constants.py --year bc20 --engine "$BC20_DIR" --check
          python3 tools/convert_maps_bc20.py --engine "$BC20_DIR" \
            --out data/maps/bc20 --check
          python3 tools/build_sprite_atlas_bc20.py --engine "$BC20_DIR" \
            --out data --check

      # The bc21 year module is generated from a THIRD pinned checkout, and
      # every generated artefact is re-generated here and byte-diffed: the
      # constants table, all eighteen converted maps and the sprite atlas cut
      # from the 2021 client. A hand-edited generated file fails the build.
      - name: Fetch the pinned Battlecode 2021 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine21
          curl -fsSL \
            "https://github.com/battlecode/battlecode21/archive/${BC21_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine21
          echo "BC21_DIR=/tmp/engine21/battlecode21-${BC21_COMMIT}" >> "$GITHUB_ENV"

      - name: The bc21 generated files match the pinned 2021 sources
        run: |
          set -euo pipefail
          python3 tools/gen_year_constants.py --year bc21 --engine "$BC21_DIR" --check
          python3 tools/convert_maps_bc21.py --engine "$BC21_DIR" \
            --out data/maps/bc21 --check
          python3 tools/build_sprite_atlas_bc21.py --engine "$BC21_DIR" \
            --out data --check

      # The bc24 year module is generated from a FOURTH pinned checkout, and
      # every generated artefact is re-generated here and byte-diffed: the
      # constants table, all twenty-two converted maps and the sprite atlas
      # cut from the 2024 client. A hand-edited generated file fails the
      # build.
      - name: Fetch the pinned Battlecode 2024 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine24
          curl -fsSL \
            "https://github.com/battlecode/battlecode24/archive/${BC24_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine24
          echo "BC24_DIR=/tmp/engine24/battlecode24-${BC24_COMMIT}" >> "$GITHUB_ENV"

      - name: The bc24 generated files match the pinned 2024 sources
        run: |
          set -euo pipefail
          python3 tools/gen_year_constants.py --year bc24 --engine "$BC24_DIR" --check
          python3 tools/convert_maps_bc24.py --engine "$BC24_DIR" \
            --out data/maps/bc24 --check
          python3 tools/build_sprite_atlas_bc24.py --engine "$BC24_DIR" \
            --out data --check
          # And EVERY ONE of the 78 official `.map24` flatbuffers reads with
          # the converter's own vtable walk, not only the 22 that are
          # committed: a reader that only works on the maps we ship is a
          # reader nobody can extend the pool with.
          parsed="$(python3 tools/convert_maps_bc24.py --engine "$BC24_DIR" \
            --parse-all 2>&1 >/dev/null | grep -oE '^[0-9]+' | head -1)"
          echo "official .map24 files parsed: ${parsed}"
          test "${parsed}" = "78" || {
            echo "::error::expected all 78 .map24 files to parse, got ${parsed}"
            exit 1; }

      # The bc25 year module is generated from a FIFTH pinned checkout, and
      # every generated artefact is re-generated here and byte-diffed: the
      # constants table, all twenty-two converted maps and the sprite atlas
      # cut from the 2025 client. A hand-edited generated file fails the
      # build.
      - name: Fetch the pinned Battlecode 2025 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine25
          curl -fsSL \
            "https://github.com/battlecode/battlecode25/archive/${BC25_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine25
          echo "BC25_DIR=/tmp/engine25/battlecode25-${BC25_COMMIT}" >> "$GITHUB_ENV"

      - name: The bc25 generated files match the pinned 2025 sources
        run: |
          set -euo pipefail
          python3 tools/gen_year_constants.py --year bc25 --engine "$BC25_DIR" --check
          python3 tools/convert_maps_bc25.py --engine "$BC25_DIR" \
            --out data/maps/bc25 --check
          python3 tools/build_sprite_atlas_bc25.py --engine "$BC25_DIR" \
            --out data --check
          # And EVERY ONE of the 75 official `.map25` flatbuffers reads with
          # the converter's own vtable walk, not only the 22 that are
          # committed: a reader that only works on the maps we ship is a
          # reader nobody can extend the pool with.
          parsed="$(python3 tools/convert_maps_bc25.py --engine "$BC25_DIR" \
            --parse-all 2>&1 >/dev/null | grep -oE '^[0-9]+' | head -1)"
          echo "official .map25 files parsed: ${parsed}"
          test "${parsed}" = "75" || {
            echo "::error::expected all 75 .map25 files to parse, got ${parsed}"
            exit 1; }

      # The bc23 year module is generated from a SIXTH pinned checkout, and
      # every generated artefact is re-generated here and byte-diffed: the
      # constants table, all twenty-two converted maps and the sprite atlas
      # cut from the 2023 client. A hand-edited generated file fails the
      # build.
      - name: Fetch the pinned Battlecode 2023 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine23
          curl -fsSL \
            "https://github.com/battlecode/battlecode23/archive/${BC23_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine23
          echo "BC23_DIR=/tmp/engine23/battlecode23-${BC23_COMMIT}" >> "$GITHUB_ENV"

      - name: The bc23 generated files match the pinned 2023 sources
        run: |
          set -euo pipefail
          python3 tools/gen_year_constants.py --year bc23 --engine "$BC23_DIR" --check
          python3 tools/convert_maps_bc23.py --engine "$BC23_DIR" \
            --out data/maps/bc23 --check
          python3 tools/build_sprite_atlas_bc23.py --engine "$BC23_DIR" \
            --out data --check
          # And EVERY ONE of the 103 official `.map23` flatbuffers reads with
          # the converter's own vtable walk, not only the 22 that are
          # committed: a reader that only works on the maps we ship is a
          # reader nobody can extend the pool with. Three of the 103 (`Frog`,
          # `Orbit`, `Rewind`) carry an OVER-LONG per-tile vector, which
          # `GameMapIO.deserialize` truncates and the converter truncates too.
          parsed="$(python3 tools/convert_maps_bc23.py --engine "$BC23_DIR" \
            --parse-all 2>&1 >/dev/null | grep -oE '^[0-9]+' | head -1)"
          echo "official .map23 files parsed: ${parsed}"
          test "${parsed}" = "103" || {
            echo "::error::expected all 103 .map23 files to parse, got ${parsed}"
            exit 1; }

      # The bc22 year module is generated from a SEVENTH pinned checkout, and
      # every generated artefact is re-generated here and byte-diffed: the
      # constants table, all twenty-two converted maps and the sprite atlas
      # cut from the 2022 client. A hand-edited generated file fails the
      # build.
      - name: Fetch the pinned Battlecode 2022 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine22
          curl -fsSL \
            "https://github.com/battlecode/battlecode22/archive/${BC22_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine22
          echo "BC22_DIR=/tmp/engine22/battlecode22-${BC22_COMMIT}" >> "$GITHUB_ENV"

      - name: The bc22 generated files match the pinned 2022 sources
        run: |
          set -euo pipefail
          python3 tools/gen_year_constants.py --year bc22 --engine "$BC22_DIR" --check
          python3 tools/convert_maps_bc22.py --engine "$BC22_DIR" \
            --out data/maps/bc22 --check
          python3 tools/build_sprite_atlas_bc22.py --engine "$BC22_DIR" \
            --out data --check
          # And EVERY ONE of the 75 official `.map22` flatbuffers reads with
          # the converter's own vtable walk, not only the 22 that are
          # committed: a reader that only works on the maps we ship is a
          # reader nobody can extend the pool with.
          parsed="$(python3 tools/convert_maps_bc22.py --engine "$BC22_DIR" \
            --parse-all 2>&1 >/dev/null | grep -oE '^[0-9]+' | head -1)"
          echo "official .map22 files parsed: ${parsed}"
          test "${parsed}" = "75" || {
            echo "::error::expected all 75 .map22 files to parse, got ${parsed}"
            exit 1; }

      # The bc16 year module is generated from an EIGHTH pinned checkout,
      # and every generated artefact is re-generated here and byte-diffed: the
      # constants table, all twenty-two converted maps (INCLUDING their
      # build-time symmetry and their pre-split per-den zombie schedules --
      # D3/D4) and the sprite atlas cut from the 2016 client. A hand-edited
      # generated file fails the build.
      - name: Fetch the pinned Battlecode 2016 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine16 /tmp/client16
          curl -fsSL \
            "https://github.com/battlecode/battlecode-server-2016/archive/${BC16_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine16
          echo "BC16_DIR=/tmp/engine16/battlecode-server-2016-${BC16_COMMIT}" \
            >> "$GITHUB_ENV"
          curl -fsSL \
            "https://github.com/battlecode/battlecode-client-2016/archive/${BC16_CLIENT_COMMIT}.tar.gz" \
            | tar xz -C /tmp/client16
          echo "BC16_CLIENT_DIR=/tmp/client16/battlecode-client-2016-${BC16_CLIENT_COMMIT}" \
            >> "$GITHUB_ENV"

      - name: The bc16 generated files match the pinned 2016 sources
        run: |
          set -euo pipefail
          # 2016's GameConstants is an INTERFACE, so its fields carry no
          # `public static final` and the bc16 arm of the generator has its
          # own regex -- recorded in the tool's docstring.
          python3 tools/gen_year_constants.py --year bc16 --engine "$BC16_DIR" --check
          python3 tools/convert_maps_bc16.py --engine "$BC16_DIR" \
            --out data/maps/bc16 --check
          python3 tools/build_sprite_atlas_bc16.py \
            --client "$BC16_CLIENT_DIR" --out data --check
          # And EVERY ONE of the 98 official `.xml` maps reads with the
          # converter's own XML walk, not only the 22 that are committed: a
          # reader that only works on the maps we ship is a reader nobody can
          # extend the pool with. The two ARMAGEDDON maps are REFUSED with the
          # stated reason (V4: both are two archons against ZERO over 12 000
          # rounds -- a single-player survival mode, not a two-seat match).
          # `2>&1` is load-bearing: the converter prints its per-map table on
          # stdout and its SUMMARY LINE on stderr, so a bare `| tee` captures
          # the table and loses the line this step greps for.
          python3 tools/convert_maps_bc16.py --engine "$BC16_DIR" \
            --parse-all 2>&1 | tee /tmp/bc16parse.txt
          grep -q '98 official .xml files parsed, 2 refused' /tmp/bc16parse.txt || {
            echo "::error::expected all 98 official .xml maps to parse with"
            echo "::error::exactly the two armageddon maps refused"
            exit 1; }

      - name: Run tests
        # Every tests/*.nim runs twice: debug (range/overflow checks, stack
        # traces) and -d:release (release-only compile errors and codegen bugs
        # that debug runs never see). Repo variables narrow that:
        #   NIM_TESTS               space-separated test files (default tests/*.nim)
        #   NIM_TESTS_DEBUG_ONLY    files to run ONLY in debug
        #   NIM_TESTS_RELEASE_ONLY  files to run ONLY in release
        env:
          NIM_TESTS: ${{ vars.NIM_TESTS }}
          NIM_TESTS_DEBUG_ONLY: ${{ vars.NIM_TESTS_DEBUG_ONLY }}
          NIM_TESTS_RELEASE_ONLY: ${{ vars.NIM_TESTS_RELEASE_ONLY }}
        run: |
          set -uo pipefail
          tests="${NIM_TESTS:-}"
          if [ -z "${tests}" ]; then
            tests="$(ls tests/*.nim 2>/dev/null | tr '\n' ' ')"
          fi
          if [ -z "$(echo "${tests}" | tr -d ' ')" ]; then
            echo "::error::no test files found (tests/*.nim empty and NIM_TESTS unset)"
            exit 1
          fi
          fail=0
          for t in ${tests}; do
            if [ ! -f "${t}" ]; then
              echo "::error::test file not found: ${t}"
              fail=1
              continue
            fi
            modes="debug release"
            case " ${NIM_TESTS_DEBUG_ONLY} " in *" ${t} "*) modes="debug" ;; esac
            case " ${NIM_TESTS_RELEASE_ONLY} " in *" ${t} "*) modes="release" ;; esac
            for m in ${modes}; do
              if [ "${m}" = "release" ]; then
                flags="--hints:off -d:release"
              else
                flags="--hints:off"
              fi
              echo "::group::nim r ${flags} --path:src ${t}"
              # shellcheck disable=SC2086
              if ! nim r ${flags} --path:src "${t}"; then
                echo "::error::FAILED (${m}) ${t}"
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit "${fail}"

      # A GameVersion is claimed across BRANCHES, and nothing else in the build
      # enforces that: two branches can each be current with main and still
      # pick the same next number, and the collision lands silently -- the
      # replay still LOADS and then re-simulates wrong. tools/ci/
      # check_gameversion.sh has always been in the tree; until now nothing
      # ran it. Same number + same rule headline (the overwhelmingly common
      # case, every PR that does not touch the rules) is fine and exits 0.
      # The bc19 year module is generated from a NINTH pinned checkout. Two
      # of its four generated artefacts can be checked here -- the constants
      # table and the sprite atlas -- and TWO CANNOT, because they need
      # NODE: `data/maps/bc19/*.json` and `data/bc19/tables.json` are
      # regenerated and byte-diffed in `parity-oracle-bc19` instead. Said
      # explicitly so nobody looks in the wrong job.
      - name: Fetch the pinned Battlecode 2019 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine19
          curl -fsSL \
            "https://github.com/battlecode/battlecode19/archive/${BC19_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine19
          echo "BC19_DIR=/tmp/engine19/battlecode19-${BC19_COMMIT}" \
            >> "$GITHUB_ENV"

      - name: The bc19 generated files match the pinned 2019 sources
        run: |
          set -euo pipefail
          # bc19's arm of the generator reads JSON (`coldbrew/specs.json`),
          # not Java -- it is the simplest arm the tool has.
          python3 tools/gen_year_constants.py --year bc19 \
            --engine "$BC19_DIR" --check
          # The six 40x40 client icons at the visualiser's own two team
          # colours. THE LICENCE WAS VERIFIED BEFORE PINNING: the repository
          # root LICENSE is GPL-3.0 and it is the ONLY licence file anywhere
          # in the tree, so app/public/assets/img/** is covered by it and
          # nothing else (NOTICE records the reasoning).
          python3 tools/build_sprite_atlas_bc19.py \
            --engine "$BC19_DIR" --out data --check

      # The bc17 year module is generated from the PINNED ORACLE JAR and a
      # pinned client checkout, and every generated artefact is re-generated
      # here and byte-diffed: the constants table (JVM reflection is NOT
      # needed for the check -- the generator's own reader walks the jar's
      # class files), all twenty-two converted maps, and the sprite atlas
      # cut from the 2017 client. A hand-edited generated file fails the
      # build.
      #
      # `data/bc17/fdlibm_vectors.json` is NOT checked here and cannot be:
      # it is written by `tools/JavaBc17Tables.java` under a JDK 8 running
      # the jar's own `StrictMath`, and there is no JDK in this job.
      # `tests/test_bc17_fdlibm.nim` recomputes every one of its 448
      # boundary rows and all eleven 2 000 000-sample digests in Nim and
      # compares them bit for bit, which is the check that matters.
      - name: Fetch the pinned Battlecode 2017 jar and client
        run: |
          set -euo pipefail
          mkdir -p /tmp/bc17 /tmp/client17
          curl -fsSL "${BC17_JAR_URL}" -o /tmp/bc17/battlecode-2017.jar
          got_sha="$(sha256sum /tmp/bc17/battlecode-2017.jar | cut -d' ' -f1)"
          got_bytes="$(stat -c%s /tmp/bc17/battlecode-2017.jar)"
          echo "bc17 jar: ${got_bytes} bytes, sha256 ${got_sha}"
          test "${got_sha}" = "${BC17_JAR_SHA256}" || {
            echo "::error::the 2017 jar's sha256 is ${got_sha}, not the"
            echo "::error::pinned ${BC17_JAR_SHA256} (tools/oracle/bc17/jar.lock)"
            exit 1; }
          test "${got_bytes}" = "${BC17_JAR_BYTES}" || {
            echo "::error::the 2017 jar is ${got_bytes} bytes, not the pinned"
            echo "::error::${BC17_JAR_BYTES} (tools/oracle/bc17/jar.lock)"
            exit 1; }
          # The pin in the lock file and the pin in this workflow's env must
          # be the same two values, or one of them is decoration.
          python3 - <<'PY'
          import json, os
          lock = json.load(open("tools/oracle/bc17/jar.lock"))
          assert lock["sha256"] == os.environ["BC17_JAR_SHA256"], lock["sha256"]
          assert str(lock["bytes"]) == os.environ["BC17_JAR_BYTES"], lock["bytes"]
          assert lock["engine_commit"] == os.environ["BC17_COMMIT"]
          assert lock["client_commit"] == os.environ["BC17_CLIENT_COMMIT"]
          print("tools/oracle/bc17/jar.lock agrees with ci.yml's env")
          PY
          curl -fsSL \
            "https://github.com/battlecode/battlecode-client-17/archive/${BC17_CLIENT_COMMIT}.tar.gz" \
            | tar xz -C /tmp/client17
          echo "BC17_JAR=/tmp/bc17/battlecode-2017.jar" >> "$GITHUB_ENV"
          echo "BC17_CLIENT_DIR=/tmp/client17/battlecode-client-17-${BC17_CLIENT_COMMIT}" \
            >> "$GITHUB_ENV"

      - name: The bc17 generated files match the pinned 2017 jar
        run: |
          set -euo pipefail
          python3 tools/convert_maps_bc17.py --jar "$BC17_JAR" \
            --out data/maps/bc17 --check
          python3 tools/build_sprite_atlas_bc17.py \
            --client "$BC17_CLIENT_DIR" --out data --check
          # And EVERY ONE of the 70 official `.map17` flatbuffers reads with
          # the converter's own vtable walk, not only the 22 that are
          # committed: a reader that only works on the maps we ship is a
          # reader nobody can extend the pool with.
          parsed="$(python3 tools/convert_maps_bc17.py --jar "$BC17_JAR" \
            --parse-all 2>&1 >/dev/null | grep -oE '^[0-9]+' | head -1)"
          echo "official .map17 files parsed: ${parsed}"
          test "${parsed}" = "70" || {
            echo "::error::expected all 70 .map17 files to parse, got ${parsed}"
            exit 1; }

      - name: The GameVersion does not collide with main's
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          tools/ci/check_gameversion.sh FETCH_HEAD HEAD

      # The manifest is validated by the CLI THAT WILL PUBLISH IT, not only
      # by tests/test_manifest.nim's own reading of the schema. `coworld
      # build` runs `_load_template_manifest` -> `validate_upload_manifest`
      # over this exact file, and a template CI passed can still fail there
      # (playbooks/make-coworld.md's own known-issue row: game.owner
      # required, no top-level version, no runner-managed tokens,
      # replay_viewer under game). Failing here costs a CI minute; failing in
      # coworld-release.yml costs a release.
      #
      # Pin: keep in step with coworld-release.yml's COWORLD_PKG.
      - name: The coworld CLI accepts the manifest template
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "coworld==0.1.43"
          python3 - <<'PY'
          import json
          from pathlib import Path

          from coworld.bundle import _load_template_manifest

          template = json.loads(Path("coworld_manifest_template.json").read_text())
          # compose.yaml's two services, whose names tests/test_manifest.nim
          # pins; `coworld build` derives the same map from `docker compose
          # config`.
          placeholders = {
              "{{GAME_IMAGE}}": "cogame-battlecode-game:latest",
              "{{PLAYER_IMAGE}}": "cogame-battlecode-player:latest",
          }
          manifest = _load_template_manifest(template, "0.0.0", placeholders)
          print("coworld accepted the template:", manifest.game.name,
                "with", len(manifest.variants), "variant(s)")
          PY


  # ---------------------------------------------------------------------
  # THE PARITY ORACLE. The Java engine as a CI-ONLY differential test: it
  # runs examplefuncsplayer against itself on five maps and we diff the
  # resulting trace, row for row, against the same trace emitted by the Nim
  # port driving the ported scaffold chassis. docs/PARITY.md explains what
  # each tier proves. There is no JDK in any image stage -- only here.
  # ---------------------------------------------------------------------
  parity-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the engine sources, the engine jar and examplefuncsplayer
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine /tmp/oracle/classes /tmp/oracle/out
          curl -fsSL \
            "https://github.com/battlecode/battlecode26/archive/refs/tags/${ENGINE_TAG}.tar.gz" \
            | tar xz -C /tmp/engine
          echo "BC_ENGINE_DIR=/tmp/engine/battlecode26-${ENGINE_TAG}" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/oracle/engine.jar "${ENGINE_JAR_URL}"
          curl -fsSL -o /tmp/oracle/scala.jar "${SCALA_JAR_URL}"
          python3 -m pip install --quiet flatbuffers
          javac -cp /tmp/oracle/engine.jar -d /tmp/oracle/classes \
            "/tmp/engine/battlecode26-${ENGINE_TAG}/example-bots/src/main/examplefuncsplayer/RobotPlayer.java"
          cp -r "/tmp/engine/battlecode26-${ENGINE_TAG}/maps" /tmp/oracle/maps

      - name: Run the Java engine on the five parity pairs
        working-directory: /tmp/oracle
        run: |
          set -euo pipefail
          for MAP in DefaultSmall arrows closeup toomuchcheese cheesefarm; do
            java -Xmx2g -XX:+UseSerialGC \
              --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED \
              -Dbc.server.websocket=false \
              -Dbc.server.mode=headless \
              -Dbc.server.map-path=/tmp/oracle/maps \
              -Dbc.server.robot-player-to-system-out=false \
              -Dbc.game.team-a=examplefuncsplayer \
              -Dbc.game.team-b=examplefuncsplayer \
              -Dbc.game.team-a.url=/tmp/oracle/classes \
              -Dbc.game.team-b.url=/tmp/oracle/classes \
              -Dbc.game.team-a.package=examplefuncsplayer \
              -Dbc.game.team-b.package=examplefuncsplayer \
              -Dbc.game.maps="$MAP" \
              -Dbc.server.save-file="/tmp/oracle/out/$MAP.bc26" \
              -cp "/tmp/oracle/engine.jar:/tmp/oracle/classes:/tmp/oracle/scala.jar" \
              battlecode.server.Main -c=- > "/tmp/oracle/$MAP.log" 2>&1
            echo "$MAP: $(grep -m1 'wins' "/tmp/oracle/$MAP.log" || echo 'no winner line')"
          done

      - name: Build the Nim trace emitter
        run: nim c --hints:off -d:release --path:src -o:/tmp/parity_trace tools/parity_trace.nim

      - name: Tier A (BLOCKING) — rounds 1-50 bit-exact on all five pairs
        run: |
          set -euo pipefail
          fail=0
          for MAP in DefaultSmall arrows closeup toomuchcheese cheesefarm; do
            python3 tools/parity_trace.py --replay "/tmp/oracle/out/$MAP.bc26" \
              --schema "$BC_ENGINE_DIR/schema/python" --rounds 50 \
              --out "/tmp/oracle/$MAP.java50"
            /tmp/parity_trace --map:"$MAP" --rounds:50 --out:"/tmp/oracle/$MAP.nim50"
            if diff -u "/tmp/oracle/$MAP.java50" "/tmp/oracle/$MAP.nim50" \
                 > "/tmp/oracle/$MAP.diff50"; then
              echo "TIER A $MAP: bit-exact through round 50"
            else
              echo "::error::TIER A $MAP diverged in the first 50 rounds"
              head -40 "/tmp/oracle/$MAP.diff50"
              fail=1
            fi
          done
          exit "$fail"

      - name: Tier B (BLOCKING) — round 200 agrees exactly on all five pairs
        run: |
          set -euo pipefail
          fail=0
          for MAP in DefaultSmall arrows closeup toomuchcheese cheesefarm; do
            python3 tools/parity_trace.py --replay "/tmp/oracle/out/$MAP.bc26" \
              --schema "$BC_ENGINE_DIR/schema/python" --rounds 200 \
              --out "/tmp/oracle/$MAP.java200"
            /tmp/parity_trace --map:"$MAP" --rounds:200 --out:"/tmp/oracle/$MAP.nim200"
            if diff -u "/tmp/oracle/$MAP.java200" "/tmp/oracle/$MAP.nim200" \
                 > "/tmp/oracle/$MAP.diff200"; then
              echo "TIER B $MAP: bit-exact through round 200"
            else
              echo "::error::TIER B $MAP diverged by round 200"
              head -40 "/tmp/oracle/$MAP.diff200"
              fail=1
            fi
          done
          exit "$fail"

      - name: Tier C (trended) — the first divergent round of a whole game
        # Reported, never blocking: a full 2000-round game exercises the cat
        # state machine for far longer than any gate should depend on. The
        # committed baseline lives in docs/PARITY.md; a number that moves
        # DOWN is a visible regression even though it does not fail the job.
        run: |
          set -uo pipefail
          {
            echo "## Parity Tier C — first divergent round (2000-round game)"
            echo ""
            echo "| map | first divergent round |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for MAP in DefaultSmall arrows closeup toomuchcheese cheesefarm; do
            python3 tools/parity_trace.py --replay "/tmp/oracle/out/$MAP.bc26" \
              --schema "$BC_ENGINE_DIR/schema/python" --rounds 2000 \
              --out "/tmp/oracle/$MAP.java2000"
            /tmp/parity_trace --map:"$MAP" --rounds:2000 --out:"/tmp/oracle/$MAP.nim2000"
            # `diff` exits 1 when the files differ and `grep` exits 1 when
            # they do not, so BOTH outcomes are a non-zero pipeline under
            # `bash -e`. Neither is a failure here: this tier only reports.
            first="$(diff "/tmp/oracle/$MAP.java2000" "/tmp/oracle/$MAP.nim2000" \
              | grep -m1 '^[<>]' | awk '{print $3}' || true)"
            if [ -z "$first" ]; then first="none (identical)"; fi
            echo "TIER C $MAP: $first"
            echo "| \`$MAP\` | $first |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the parity traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-traces
          path: /tmp/oracle/*.diff*
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------
  # THE bc20 PARITY ORACLE. JDK 8 + the pinned 2020 engine SOURCES as a
  # CI-only differential test of every piece of arithmetic the Nim port could
  # get subtly wrong and never notice: the water table (Math.exp/Math.sin
  # intrinsics), both pollution coefficients over the whole integer domain,
  # Math.round(float), the IDGenerator streams that decide the highest_id
  # tiebreak, java.util.Random, the OVERFLOWING cow seed, Transaction's
  # comparator, and the RobotType table.
  #
  # WHY THIS IS NOT THE WHOLE ENGINE: `engine/build.gradle` depends on
  # `net.sf.jsi:jsi:1.1.0-SNAPSHOT`, published only to jcenter (shut down
  # 2022) and to the Sonatype OSS SNAPSHOTS repo (expired). Both 404 today and
  # `world/ObjectInfo.java` imports `net.sf.jsi` directly, so `:engine:jar`
  # cannot be produced from the unmodified upstream build. The last step below
  # ATTEMPTS the resolution anyway and reports the failure, so the day the
  # artifact comes back the round-loop tier is one step away. docs/PARITY.md
  # section bc20 records exactly what each tier proves.
  #
  # There is no JDK in any image stage -- only here.
  # ---------------------------------------------------------------------
  parity-oracle-bc20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # JDK 8: `engine/build.gradle` says `sourceCompatibility = 1.8` and the
      # 2020 sources are Java 8. The generated water table was produced under
      # a JDK and is byte-diffed against a JDK here, so the version is pinned.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Fetch the pinned Battlecode 2020 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine20 /tmp/oracle/classes
          curl -fsSL \
            "https://github.com/battlecode/battlecode20/archive/${BC20_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine20
          echo "BC20_DIR=/tmp/engine20/battlecode20-${BC20_COMMIT}" >> "$GITHUB_ENV"

      - name: Compile the dependency-free engine sources and the oracle
        run: |
          set -euo pipefail
          S="$BC20_DIR/engine/src/main"
          javac -d /tmp/oracle/classes \
            "$S/battlecode/common/GameConstants.java" \
            "$S/battlecode/common/RobotType.java" \
            "$S/battlecode/common/Transaction.java" \
            "$S/battlecode/common/Direction.java" \
            "$S/battlecode/common/Team.java" \
            "$S/battlecode/world/IDGenerator.java" \
            tools/oracle/Bc20Oracle.java

      - name: Tier A (BLOCKING) -- the Java vectors and the Nim vectors agree
        run: |
          set -euo pipefail
          java -cp /tmp/oracle/classes Bc20Oracle > /tmp/oracle/java.vectors
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle/parity_trace_bc20 tools/parity_trace_bc20.nim
          /tmp/oracle/parity_trace_bc20 > /tmp/oracle/nim.vectors
          echo "vector lines: $(wc -l < /tmp/oracle/java.vectors)"
          if diff -u /tmp/oracle/java.vectors /tmp/oracle/nim.vectors \
               > /tmp/oracle/vectors.diff; then
            echo "TIER A: the Nim port is bit-exact with the 2020 engine sources"
          else
            echo "::error::TIER A: the Nim port diverged from the 2020 engine"
            head -60 /tmp/oracle/vectors.diff
            exit 1
          fi

      - name: The water-table step (BLOCKING) -- regenerate and byte-diff
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle/wl
          javac -d /tmp/oracle/wl tools/JavaWaterLevels.java
          java -cp /tmp/oracle/wl JavaWaterLevels > /tmp/oracle/water_levels.json
          if diff -u data/bc20/water_levels.json /tmp/oracle/water_levels.json; then
            echo "the committed water table is what this JDK generates"
          else
            echo "::error::data/bc20/water_levels.json is not what the JDK emits"
            exit 1
          fi

      - name: The engine-from-source attempt (reported, not blocking)
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "## bc20 parity -- the engine-from-source tier"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cd "$BC20_DIR"
          # `settings.gradle` includes a submodule that is not in the archive.
          sed -i '/internal-test-bots/d' settings.gradle || true
          if timeout 900 ./gradlew --no-daemon :engine:jar > /tmp/oracle/gradle.log 2>&1; then
            echo "the 2020 engine BUILT -- the round-loop tier can be promoted" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "the 2020 engine did NOT build. The blocking reason, from"
              echo "the Gradle log:"
              echo ""
              echo '```'
              grep -E "Could not (resolve|find)" /tmp/oracle/gradle.log \
                | sort -u | head -8
              echo '```'
              echo ""
              echo "\`net.sf.jsi:jsi:1.1.0-SNAPSHOT\` was published only to"
              echo "jcenter (shut down 2022) and to the Sonatype OSS SNAPSHOTS"
              echo "repository (expired). Tiers A and the water table above are"
              echo "BLOCKING and cover every piece of arithmetic the port could"
              echo "get wrong; the round-loop tier waits on that artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the parity vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-vectors-bc20
          path: |
            /tmp/oracle/*.vectors
            /tmp/oracle/vectors.diff
            /tmp/oracle/gradle.log
          if-no-files-found: ignore
          retention-days: 14


  # ---------------------------------------------------------------------
  # THE bc21 PARITY ORACLE. A REAL ROUND-LOOP ORACLE: JDK 8 + the pinned 2021
  # engine SOURCES, compiled with a bare `javac` and driven head to head
  # against the Nim port on five map pairs.
  #
  # WHY IT BUILDS WHEN bc20's DID NOT. The 2020 engine could not be built
  # because `net.sf.jsi:jsi:1.1.0-SNAPSHOT` was published only to jcenter
  # (dead) and Sonatype OSS SNAPSHOTS (expired). The 2021 engine has the SAME
  # single dead dependency and nothing else -- every other coordinate in
  # `engine/build.gradle` resolves from Maven Central today -- and
  # `net.sf.jsi` is write-only dead weight: `world/ObjectInfo.java` calls only
  # `robotIndex.init/add/delete` and never queries it. So the job bypasses
  # Gradle entirely (which also sidesteps the dead `jcenter()` repository and
  # the `$JAVA_HOME/lib/tools.jar` javadoc dependency), stands a four-file
  # no-op shim in for the dead artifact, and compiles the 94 gameplay sources
  # with plain javac.
  #
  # JDK 8 IS MANDATORY. The instrumenter rewrites java.util classes with ASM
  # 5.0.4, which refuses class-file versions above 52; under JDK 21 every
  # player class load throws IllegalArgumentException from ClassReader and the
  # match silently ends in a coin flip on round 1500 with two robots on the
  # board. That is exactly what a green oracle looks like when it is proving
  # nothing, so the driver asserts a non-trivial robot count at round 50
  # before anything is diffed.
  #
  # There is no JDK in any image stage -- only here. docs/PARITY.md section
  # bc21 records exactly what each tier proves and what it does not.
  # ---------------------------------------------------------------------
  parity-oracle-bc21:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # JDK 8, and not a preference: see the block comment above.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Fetch the pinned Battlecode 2021 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine21 /tmp/oracle/classes /tmp/oracle/bot /tmp/oracle/jars
          curl -fsSL \
            "https://github.com/battlecode/battlecode21/archive/${BC21_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine21
          echo "BC21_DIR=/tmp/engine21/battlecode21-${BC21_COMMIT}" >> "$GITHUB_ENV"

      - name: Download the eleven Maven Central jars and verify every sha256
        run: |
          set -euo pipefail
          cd /tmp/oracle/jars
          while read -r sha path; do
            case "$sha" in ''|'#'*) continue ;; esac
            case "$sha" in objectinfo-sha256) continue ;; esac
            name="$(basename "$path")"
            curl -fsSL -o "$name" "https://repo1.maven.org/maven2/${path}"
            echo "${sha}  ${name}" | sha256sum -c -
          done < "$GITHUB_WORKSPACE/tools/oracle/bc21/deps.lock"
          ls -la

      - name: The jsi shim can still affect nothing
        # `world/ObjectInfo.java` calls only `robotIndex.init/add/delete` and
        # NEVER queries the index, so the four no-op files that stand in for
        # the dead `net.sf.jsi` artifact cannot reach the game. If upstream
        # ever starts READING it, this hash changes and the job says so rather
        # than lying.
        run: |
          set -euo pipefail
          want="$(awk '/^objectinfo-sha256/ {print $2}' tools/oracle/bc21/deps.lock)"
          got="$(sha256sum "$BC21_DIR/engine/src/main/battlecode/world/ObjectInfo.java" | awk '{print $1}')"
          echo "ObjectInfo.java sha256: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::world/ObjectInfo.java changed ($got != $want). The"
            echo "::error::no-op net.sf.jsi shim is only safe while the engine"
            echo "::error::never READS the spatial index. Re-check"
            echo "::error::\`grep robotIndex world/ObjectInfo.java\` before"
            echo "::error::updating tools/oracle/bc21/deps.lock."
            exit 1
          fi

      - name: Compile the shim, the 94 engine sources and the oracle driver
        run: |
          set -euo pipefail
          CP="$(ls /tmp/oracle/jars/*.jar | tr '\n' ':')"
          javac -nowarn -d /tmp/oracle/classes \
            tools/oracle/bc21/jsi-shim/net/sf/jsi/SpatialIndex.java \
            tools/oracle/bc21/jsi-shim/net/sf/jsi/Rectangle.java \
            tools/oracle/bc21/jsi-shim/net/sf/jsi/Point.java \
            tools/oracle/bc21/jsi-shim/net/sf/jsi/rtree/RTree.java
          # `battlecode/doc/**` is EXCLUDED: it is javadoc taglets against
          # com.sun.tools.doclets (the only thing that ever needed tools.jar)
          # and contains no gameplay.
          mapfile -t SRC < <(find "$BC21_DIR/engine/src/main/battlecode" \
            -name '*.java' -not -path '*/battlecode/doc/*')
          echo "engine sources: ${#SRC[@]}"
          test "${#SRC[@]}" -eq 94 || {
            echo "::error::expected 94 engine sources, found ${#SRC[@]}"; exit 1; }
          # NOT `--release 8`: that flag arrived in JDK 9 and this job runs
          # JDK 8 on purpose (the instrumenter's ASM 5.0.4 refuses class-file
          # versions above 52). The compiler IS 8, so the target is 8.
          javac -nowarn -cp "${CP}/tmp/oracle/classes" \
            -d /tmp/oracle/classes "${SRC[@]}"
          # Every non-.java file under battlecode/ (MethodCosts.txt,
          # AllowedPackages.txt, DisallowedClasses.txt and the 76 .map21).
          (cd "$BC21_DIR/engine/src/main" && \
            find battlecode -type f ! -name '*.java' \
              -exec cp --parents {} /tmp/oracle/classes/ \;)
          javac -nowarn -cp "${CP}/tmp/oracle/classes" \
            -d /tmp/oracle/classes tools/oracle/bc21/Bc21Trace.java
          javac -nowarn -cp "${CP}/tmp/oracle/classes" \
            -d /tmp/oracle/bot \
            tools/oracle/bc21/examplefuncsplayer21/RobotPlayer.java

      - name: The oracle bot is upstream's, plus exactly one committed hunk
        run: |
          set -euo pipefail
          sed 's/^package examplefuncsplayer21;/package examplefuncsplayer;/' \
            tools/oracle/bc21/examplefuncsplayer21/RobotPlayer.java \
            > /tmp/oracle/bot-repackaged.java
          if diff -u \
            "$BC21_DIR/example-bots/src/main/examplefuncsplayer/RobotPlayer.java" \
            /tmp/oracle/bot-repackaged.java > /tmp/oracle/bot.diff; then
            echo "::error::the oracle bot is byte-identical to upstream, so the"
            echo "::error::determinism hunk is missing and the trace is not"
            echo "::error::reproducible"
            exit 1
          fi
          echo "the oracle bot differs from upstream in $(grep -c '^[+-]' /tmp/oracle/bot.diff) line(s)"
          grep -q 'Math.random' tools/oracle/bc21/examplefuncsplayer21/RobotPlayer.java && {
            echo "::error::Math.random() survives in the oracle bot: the trace"
            echo "::error::is wall-clock seeded and not reproducible"; exit 1; }
          true

      - name: Build the Nim trace emitter
        run: |
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle/parity_trace_bc21 tools/parity_trace_bc21.nim

      - name: Run both engines on the five pairs
        run: |
          set -euo pipefail
          CP="$(ls /tmp/oracle/jars/*.jar | tr '\n' ':')"
          for MAP in maptestsmall Arena Bog Smile Star; do
            java -Xmx2g -XX:+UseSerialGC \
              -Dbc.engine.silence-a=true -Dbc.engine.silence-b=true \
              -cp "${CP}/tmp/oracle/classes:/tmp/oracle/bot" \
              battlecode.world.Bc21Trace "$MAP" 1500 examplefuncsplayer21 \
              /tmp/oracle/bot \
              > "/tmp/oracle/${MAP}.java" 2> "/tmp/oracle/${MAP}.log"
            grep -E 'robots at round 50|BC21_FIRST_CUTOFF' "/tmp/oracle/${MAP}.log"
            awk '/^BC21_FIRST_CUTOFF/ {print $2}' "/tmp/oracle/${MAP}.log" \
              > "/tmp/oracle/${MAP}.cutoff"
            /tmp/oracle/parity_trace_bc21 --map:"$MAP" --rounds:1500 \
              --out:"/tmp/oracle/${MAP}.nim"
            echo "$MAP: $(wc -l < "/tmp/oracle/${MAP}.java") java lines, $(wc -l < "/tmp/oracle/${MAP}.nim") nim lines"
          done

      - name: Tier A (BLOCKING) and Tier C (BLOCKING against the ledger)
        run: |
          set -euo pipefail
          python3 tools/ci/parity_tiers_bc21.py \
            --dir /tmp/oracle \
            --maps maptestsmall Arena Bog Smile Star \
            --ledger tools/ci/parity_ledger_bc21.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Tier B (BLOCKING) — regenerate both economy tables and byte-diff
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle/tables
          javac -nowarn -d /tmp/oracle/tables tools/JavaBc21Tables.java
          java -cp /tmp/oracle/tables JavaBc21Tables ec_passive \
            > /tmp/oracle/ec_passive.json
          java -cp /tmp/oracle/tables JavaBc21Tables embezzle \
            > /tmp/oracle/embezzle.json
          if ! diff -u data/bc21/ec_passive.json /tmp/oracle/ec_passive.json; then
            echo "::error::data/bc21/ec_passive.json is not what this JDK emits"
            exit 1
          fi
          if ! diff -u data/bc21/embezzle.json /tmp/oracle/embezzle.json; then
            echo "::error::data/bc21/embezzle.json is not what this JDK emits"
            exit 1
          fi
          echo "both committed bc21 economy tables are what the JDK generates"
          # And Math.exp really does agree with StrictMath.exp over the whole
          # committed range, which is why the fdlibm port can stand in for it.
          java -cp /tmp/oracle/tables JavaBc21Tables strictcheck

      - name: Tier B (BLOCKING) — the (4096, 1e8] embezzle tail, Java vs Nim
        run: |
          set -euo pipefail
          java -cp /tmp/oracle/tables JavaBc21Tables tail > /tmp/oracle/tail.java
          /tmp/oracle/parity_trace_bc21 --tail > /tmp/oracle/tail.nim
          echo "tail samples: $(wc -l < /tmp/oracle/tail.java)"
          if ! diff -u /tmp/oracle/tail.java /tmp/oracle/tail.nim \
               > /tmp/oracle/tail.diff; then
            echo "::error::the fdlibm port and the JDK disagree about"
            echo "::error::getPassiveInfluence above the committed table."
            echo "::error::Every disagreeing x goes into docs/PARITY.md."
            head -40 /tmp/oracle/tail.diff
            exit 1
          fi
          echo "Java and the fdlibm port agree on all 4096 log-spaced samples"

      - name: Upload the parity traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-traces-bc21
          path: |
            /tmp/oracle/*.cutoff
            /tmp/oracle/*.log
            /tmp/oracle/tail.diff
            /tmp/oracle/bot.diff
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------
  # THE bc24 PARITY ORACLE. The published battlecode24-3.0.5 jar is a
  # SELF-CONTAINED fat jar -- 11 612 entries, all 254 battlecode classes,
  # every bundled dependency (net.sf.jsi among them, so the dead-artifact
  # problem that shaped the bc20 and bc21 jobs does not arise), MethodCosts.txt
  # and all 79 .map24 map resources -- so there is no Gradle, no jsi shim, no
  # 94-file javac, no Maven Central download list and no deps.lock here.
  #
  # JDK 8 IS MANDATORY. The instrumenter rewrites java.util classes with ASM
  # 5.0.4, which refuses class-file versions above 52; under a newer JDK every
  # player class load throws and the match ends EMPTY -- which is exactly what
  # a "green" oracle looks like when it is proving nothing. The driver fails
  # loudly if no duck ever spawns, and `javac` is invoked with plain
  # `-source 8 -target 8`: `--release` arrived in JDK 9 and dies with "invalid
  # flag" on a Temurin 8 compiler in seconds (the 2026-09-04 bc21 learning,
  # which cost that run a CI round).
  # ---------------------------------------------------------------------
  parity-oracle-bc24:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # JDK 8, and not a preference: see the block comment above.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Fetch the pinned Battlecode 2024 sources and the published jar
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine24 /tmp/oracle24
          curl -fsSL \
            "https://github.com/battlecode/battlecode24/archive/${BC24_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine24
          echo "BC24_DIR=/tmp/engine24/battlecode24-${BC24_COMMIT}" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/oracle24/battlecode24.jar "${BC24_JAR_URL}"
          ls -la /tmp/oracle24/battlecode24.jar

      - name: Build the oracle (jar sha256 verified, JDK 8, -source/-target 8)
        run: |
          set -euo pipefail
          tools/oracle/bc24/build_oracle.sh \
            /tmp/oracle24/battlecode24.jar "$BC24_DIR" /tmp/oracle24/build

      - name: The jar really is 3.0.5, and its constants are the port's
        run: |
          set -euo pipefail
          JAR=/tmp/oracle24/battlecode24.jar
          mkdir -p /tmp/oracle24/tables
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -cp "$JAR" \
            -d /tmp/oracle24/tables tools/JavaBc24Tables.java
          spec="$(java -cp "$JAR:/tmp/oracle24/tables" JavaBc24Tables specversion)"
          echo "GameConstants.SPEC_VERSION in the jar: ${spec}"
          test "${spec}" = "3.0.5" || {
            echo "::error::the published jar is not 3.0.5 (${spec})"; exit 1; }
          # Tier B, half one: the 3.0.5-jar-versus-master-sources gap
          # (docs/RULES-BC24.md section Divergences item 9) closed by
          # comparison rather than by assertion.
          java -cp "$JAR:/tmp/oracle24/tables" JavaBc24Tables constants

      - name: Tier B (BLOCKING) — the WHOLE finite skill domain, byte-diffed
        run: |
          set -euo pipefail
          JAR=/tmp/oracle24/battlecode24.jar
          java -cp "$JAR:/tmp/oracle24/tables" JavaBc24Tables skills \
            > /tmp/oracle24/skills.json
          if ! diff -u data/bc24/skills.json /tmp/oracle24/skills.json; then
            echo "::error::data/bc24/skills.json is not what the released jar's"
            echo "::error::own classes emit. bc24 has NO transcendental"
            echo "::error::anywhere, so this tier is the entire domain rather"
            echo "::error::than a sample: damage and heal for all 7 levels x"
            echo "::error::{upgrade on, off}, and cooldown and crumb cost for"
            echo "::error::all 7 build levels x {explosive, stun, water, dig,"
            echo "::error::fill}."
            exit 1
          fi
          echo "the committed bc24 skill table is what the 3.0.5 jar generates"

      - name: Build the Nim trace emitters (plain, scenario, teleport)
        run: |
          set -euo pipefail
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle24/parity_trace_bc24 tools/parity_trace_bc24.nim
          nim c --hints:off -d:release -d:bc24Scenario --path:src \
            -o:/tmp/oracle24/parity_trace_bc24_scenario tools/parity_trace_bc24.nim
          nim c --hints:off -d:release -d:bc24Scenario \
            -d:bc24ScenarioTeleport --path:src \
            -o:/tmp/oracle24/parity_trace_bc24_teleport tools/parity_trace_bc24.nim

      - name: Run both engines on the fifteen pairs (whole 2000-round games)
        run: |
          set -euo pipefail
          JAR=/tmp/oracle24/battlecode24.jar
          CLASSES=/tmp/oracle24/build/classes
          mkdir -p /tmp/oracle24/traces
          for MAP in DefaultSmall Yinyang BreadPudding Rivers Tunnels; do
            for BOT in examplefuncsplayer bc24scenario bc24scenariotel; do
              case "$BOT" in
                examplefuncsplayer) NIMBIN=/tmp/oracle24/parity_trace_bc24 ;;
                bc24scenario) NIMBIN=/tmp/oracle24/parity_trace_bc24_scenario ;;
                *) NIMBIN=/tmp/oracle24/parity_trace_bc24_teleport ;;
              esac
              java -Xmx2g -XX:+UseSerialGC -cp "$JAR:$CLASSES" \
                battlecode.world.Bc24Trace "$MAP" 2000 "$BOT" "$CLASSES" \
                > "/tmp/oracle24/traces/${BOT}.${MAP}.java" \
                2> "/tmp/oracle24/traces/${BOT}.${MAP}.log"
              cat "/tmp/oracle24/traces/${BOT}.${MAP}.log"
              "$NIMBIN" --map:"$MAP" --rounds:2000 \
                --out:"/tmp/oracle24/traces/${BOT}.${MAP}.nim"
              echo "${BOT}/${MAP}: $(wc -l < "/tmp/oracle24/traces/${BOT}.${MAP}.java") java lines, $(wc -l < "/tmp/oracle24/traces/${BOT}.${MAP}.nim") nim lines"
            done
          done

      - name: Tier A, Tier A-prime and Tier C (all BLOCKING)
        run: |
          set -euo pipefail
          python3 tools/ci/parity_tiers_bc24.py \
            --dir /tmp/oracle24/traces \
            --maps DefaultSmall Yinyang BreadPudding Rivers Tunnels \
            --bots examplefuncsplayer bc24scenario bc24scenariotel \
            --ledger tools/ci/parity_ledger_bc24.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Tier A-prime coverage — the rare paths really did fire
        # A scenario bot that agrees bit for bit while doing nothing proves
        # nothing. These are read off the JAVA trace, so they are facts about
        # the ENGINE's run, not about the port's.
        run: |
          set -euo pipefail
          cd /tmp/oracle24/traces
          ups="$(grep -h ' T ' bc24scenario.*.java | grep -c 'up=111' || true)"
          echo "rounds with all three upgrades bought: ${ups}"
          test "${ups}" -gt 0 || {
            echo "::error::the scenario bot never bought all three upgrades"
            exit 1; }
          picks="$(grep -h ' T ' bc24scenario.*.java | grep -cv 'picked=0' || true)"
          echo "team records with a flag pickup: ${picks}"
          test "${picks}" -gt 0 || {
            echo "::error::the scenario bot never picked a flag up"; exit 1; }
          stuns="$(grep -hc 'acd=40 mcd=40' bc24scenario.*.java | paste -sd+ | bc)"
          echo "duck records under a stun trap: ${stuns}"
          test "${stuns}" -gt 0 || {
            echo "::error::no stun trap ever fired: the trap paths are untested"
            exit 1; }
          mastery="$(awk '{for(i=1;i<=NF;i++) if ($i ~ /^ax=/) {split($i,a,"="); if (a[2]+0 >= 75) c++}} END {print c+0}' bc24scenario.*.java)"
          echo "duck records at attack level 4 or better: ${mastery}"
          test "${mastery}" -gt 0 || {
            echo "::error::no duck ever reached the mastery threshold"; exit 1; }
          # And the TELEPORT variant really does fire the round-200
          # confirmation: a flag whose start location moves back at round 200.
          tel="$(grep -h '^R 200 F ' bc24scenariotel.DefaultSmall.java | grep -c 'start=1')"
          echo "flags confirmed at round 200 in the teleport variant: ${tel}"
          test "${tel}" -eq 6 || {
            echo "::error::the round-200 confirmation did not run"; exit 1; }

      - name: Upload the parity traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-traces-bc24
          path: |
            /tmp/oracle24/traces/*.log
            /tmp/oracle24/skills.json
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------
  # THE bc25 PARITY ORACLE. The 2025 Java engine as a CI-ONLY differential
  # test, and the cheapest of the series: the released fat jar is
  # SELF-CONTAINED (6413 entries, all 182 battlecode classes, every bundled
  # dependency and all 75 .map25 resources), so there is no Gradle, no jsi
  # shim, no multi-file javac, no Maven download list and no deps.lock here.
  #
  # `--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED` IS MANDATORY on
  # every java invocation. Without it the instrumented `java.util.Random`
  # fails its static initialiser with IllegalAccessError, EVERY player class
  # load throws, all four starting towers die by exception on round 1, and the
  # game ends at round 1 with DESTROY_ALL_UNITS and a four-line trace -- the
  # job exits 0 and the diff is empty. THAT IS THE "green oracle proving
  # nothing" TRAP. Bc25Trace.java therefore exits 3 if no robot is ever built,
  # and the step below additionally asserts every game reached 1900 rounds.
  #
  # There is no JDK in any image stage -- only here.
  # ---------------------------------------------------------------------
  parity-oracle-bc25:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # JDK 21, and not a preference: the engine's build.gradle sets
      # VERSION_21 and hard-fails below it, and the instrumenter uses ASM
      # 9.7.1, which is happy with class-file version 65.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch the pinned Battlecode 2025 sources and the published jar
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine25 /tmp/oracle25
          curl -fsSL \
            "https://github.com/battlecode/battlecode25/archive/${BC25_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine25
          echo "BC25_DIR=/tmp/engine25/battlecode25-${BC25_COMMIT}" >> "$GITHUB_ENV"
          url="$(python3 -c 'import json;print(json.load(open("tools/oracle/bc25/jar.lock"))["url"])')"
          curl -fsSL -o /tmp/oracle25/battlecode25.jar "$url"
          ls -la /tmp/oracle25/battlecode25.jar

      # `--check` runs the same generator the `test` job runs, so a
      # hand-edited constants table fails here too rather than only there.
      - name: Build the oracle (jar sha256 AND size verified, JDK 21, no javac flags)
        run: |
          set -euo pipefail
          tools/oracle/bc25/build_oracle.sh \
            /tmp/oracle25/battlecode25.jar "$BC25_DIR" /tmp/oracle25/build

      # NO VERSION-STRING ASSERTION. `GameConstants.SPEC_VERSION` in the 2025
      # sources is the literal "1", not "3.1.0", so bc24's
      # `test "${spec}" = "3.0.5"` step has NO bc25 equivalent: the sha256 IS
      # the version pin (docs/RULES-BC25.md Divergences item 12) and Tier B
      # cross-checks the constants instead.
      - name: The jar's own constants, printed, and its useless SPEC_VERSION
        run: |
          set -euo pipefail
          JAR=/tmp/oracle25/battlecode25.jar
          mkdir -p /tmp/oracle25/tables
          javac -nowarn -encoding UTF-8 -cp "$JAR" \
            -d /tmp/oracle25/tables tools/JavaBc25Tables.java
          spec="$(java --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED \
            -cp "$JAR:/tmp/oracle25/tables" JavaBc25Tables specversion)"
          echo "GameConstants.SPEC_VERSION in the jar: ${spec}"
          test "${spec}" = "1" || {
            echo "::error::the jar's SPEC_VERSION is no longer the literal 1"
            echo "::error::(${spec}); tools/oracle/bc25/jar.lock and"
            echo "::error::docs/RULES-BC25.md Divergences item 12 both say it is."
            exit 1; }
          # The "released jar versus pinned master sources" gap, closed by
          # comparison rather than by assertion.
          java --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED \
            -cp "$JAR:/tmp/oracle25/tables" JavaBc25Tables constants \
            > /tmp/oracle25/jar-constants.txt
          echo "::group::the jar's GameConstants"
          cat /tmp/oracle25/jar-constants.txt
          echo "::endgroup::"
          # Every constant the generator read from the SOURCES must equal the
          # one the JAR carries. This is what makes the sha256 pin enough.
          python3 - <<'PY'
          import pathlib, re
          jar = {}
          for line in pathlib.Path("/tmp/oracle25/jar-constants.txt").read_text().splitlines():
              if "=" not in line: continue
              k, v = line.split("=", 1)
              jar[k.strip()] = v.strip()
          nim = pathlib.Path("src/battlecode/years/bc25/constants.nim").read_text()
          def camel(name):
              parts = name.split("_")
              return parts[0].capitalize() + "".join(p.capitalize() for p in parts[1:])
          bad = []
          checked = 0
          for name, value in jar.items():
              m = re.search(r"^  %s\*: (int|int64|string) = (.+)$" % camel(name),
                            nim, re.M)
              if not m: continue
              checked += 1
              want = m.group(2).strip().strip('"')
              if want != value:
                  bad.append(f"{name}: jar={value} port={want}")
          print(f"cross-checked {checked} GameConstants fields against the jar")
          if checked < 40:
              raise SystemExit(f"::error::only {checked} constants cross-checked")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              raise SystemExit(1)
          PY

      - name: Tier B (BLOCKING) — the WHOLE finite arithmetic domain, byte-diffed
        run: |
          set -euo pipefail
          JAR=/tmp/oracle25/battlecode25.jar
          java --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED \
            -cp "$JAR:/tmp/oracle25/tables" JavaBc25Tables tables \
            > /tmp/oracle25/tables.json
          if ! diff -u data/bc25/tables.json /tmp/oracle25/tables.json; then
            echo "::error::data/bc25/tables.json is not what the released jar's"
            echo "::error::own classes emit. bc25 has NO transcendental anywhere"
            echo "::error::and NO float32 anywhere, so this tier is the ENTIRE"
            echo "::error::domain rather than a sample: the whole UnitType table,"
            echo "::error::the paint percentage for every (paint, capacity) pair,"
            echo "::error::the cooldown surcharge for every percentage x every"
            echo "::error::base, the coverage per mille at the 70 % boundary for"
            echo "::error::every map area, and the four pattern bit tables."
            exit 1
          fi
          echo "the committed bc25 arithmetic table is what the 3.1.0 jar generates"

      - name: Build the Nim trace emitters (example bot + three scenarios)
        run: |
          set -euo pipefail
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle25/parity_trace_bc25 tools/parity_trace_bc25.nim
          nim c --hints:off -d:release -d:bc25Scenario --path:src \
            -o:/tmp/oracle25/parity_trace_bc25_scenario tools/parity_trace_bc25.nim
          nim c --hints:off -d:release -d:bc25Scenario -d:bc25ScenarioPaint \
            --path:src \
            -o:/tmp/oracle25/parity_trace_bc25_paint tools/parity_trace_bc25.nim
          nim c --hints:off -d:release -d:bc25Scenario -d:bc25ScenarioWipe \
            --path:src \
            -o:/tmp/oracle25/parity_trace_bc25_wipe tools/parity_trace_bc25.nim

      - name: Run both engines on the twenty-four pairs (whole 2000-round games)
        run: |
          set -euo pipefail
          JAR=/tmp/oracle25/battlecode25.jar
          CLASSES=/tmp/oracle25/build/classes
          mkdir -p /tmp/oracle25/traces
          for MAP in DefaultSmall CastleDefense Paintball Justice Filter Jail; do
            for BOT in examplefuncsplayer bc25scenario bc25scenariopaint \
                       bc25scenariowipe; do
              case "$BOT" in
                examplefuncsplayer) NIMBIN=/tmp/oracle25/parity_trace_bc25 ;;
                bc25scenario) NIMBIN=/tmp/oracle25/parity_trace_bc25_scenario ;;
                bc25scenariopaint) NIMBIN=/tmp/oracle25/parity_trace_bc25_paint ;;
                *) NIMBIN=/tmp/oracle25/parity_trace_bc25_wipe ;;
              esac
              # THE FLAG. Every single java invocation carries it.
              java -Xmx2g -XX:+UseSerialGC \
                --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED \
                -cp "$JAR:$CLASSES" \
                battlecode.world.Bc25Trace "$MAP" 2000 "$BOT" "$CLASSES" \
                > "/tmp/oracle25/traces/${BOT}.${MAP}.java" \
                2> "/tmp/oracle25/traces/${BOT}.${MAP}.log"
              cat "/tmp/oracle25/traces/${BOT}.${MAP}.log"
              "$NIMBIN" --map:"$MAP" --rounds:2000 \
                --out:"/tmp/oracle25/traces/${BOT}.${MAP}.nim"
              echo "${BOT}/${MAP}: $(wc -l < "/tmp/oracle25/traces/${BOT}.${MAP}.java") java lines, $(wc -l < "/tmp/oracle25/traces/${BOT}.${MAP}.nim") nim lines"
            done
          done

      # THE `--add-opens` TRAP, caught head-on: without the flag every game
      # ends at round 1 with a four-line trace, and this is what notices.
      - name: Every game really ran (the --add-opens trap)
        run: |
          set -euo pipefail
          fail=0
          for f in /tmp/oracle25/traces/*.java; do
            last="$(tail -1 "$f")"
            rounds="$(echo "$last" | sed -n 's/^R \([0-9]*\) W .*/\1/p')"
            lines="$(wc -l < "$f")"
            echo "$(basename "$f"): ${rounds} rounds, ${lines} lines"
            if [ -z "${rounds}" ] || [ "${rounds}" -lt 1900 ]; then
              echo "::error::$(basename "$f") stopped at round ${rounds:-0}."
              echo "::error::Without --add-opens=java.base/jdk.internal.misc="
              echo "::error::ALL-UNNAMED every player class load throws, the four"
              echo "::error::starting towers die on round 1, and this oracle is"
              echo "::error::green while proving nothing."
              fail=1
            fi
          done
          exit "${fail}"

      - name: Tier A, Tier A-prime and Tier C (all BLOCKING)
        run: |
          set -euo pipefail
          python3 tools/ci/parity_tiers_bc25.py \
            --dir /tmp/oracle25/traces \
            --maps DefaultSmall CastleDefense Paintball Justice Filter Jail \
            --bots examplefuncsplayer bc25scenario bc25scenariopaint \
                   bc25scenariowipe \
            --ledger tools/ci/parity_ledger_bc25.json \
            --summary "$GITHUB_STEP_SUMMARY"

      # Tier A-prime coverage: A SCENARIO BOT THAT AGREES BIT FOR BIT WHILE
      # DOING NOTHING PROVES NOTHING, and this is the step that stops it.
      # These are read off the JAVA trace, so they are facts about the
      # ENGINE's run and not about the port's.
      #
      # WHAT IS AND IS NOT ASSERTED HERE IS MEASURED, NOT HOPED. The scenario
      # bot provably reaches the Special Resource Pattern lifecycle (register,
      # activate at fifty, break and reset), the marker subsystem, the
      # zero-paint starvation path and every robot type the engine's own paint
      # economy lets a 2000-round game afford. It does NOT reach
      # `completeTowerPattern`, `upgradeTower`, the defense buff, the splasher
      # or either instant-win condition, for a reason that is a fact about the
      # 2025 rules rather than about this bot: a tower's paint stash is the
      # binding constraint and a soldier needs twenty-five undisturbed turns
      # beside a ruin. Those six are recorded in docs/PARITY.md
      # "What is NOT compared" with that reason, and every one of them is
      # covered instead by the native shards
      # (tests/test_bc25_towers.nim, test_bc25_endladder.nim,
      # test_bc25_units.nim) -- never silently left in a bot that does not
      # reach them.
      - name: Tier A-prime coverage — the rare paths really did fire
        run: |
          set -uo pipefail
          fail=0
          srp_total=0
          life_max=0
          active_total=0
          starved_total=0
          for MAP in DefaultSmall CastleDefense Paintball Justice Filter Jail; do
            T="/tmp/oracle25/traces/bc25scenario.${MAP}.java"
            srp="$(grep -c ' P ' "$T" || true)"
            life="$(grep ' P ' "$T" | sed 's/.*life=//' | sort -n | tail -1 || true)"
            active="$(grep -c 'srp=1' "$T" || true)"
            markers="$(grep ' M ' "$T" | sed 's/.*mk=//' | sort -u | wc -l || true)"
            starved="$(grep 'ty=SOLDIER' "$T" | grep -c 'pnt=0 ' || true)"
            soldiers="$(grep -c 'ty=SOLDIER' "$T" || true)"
            moppers="$(grep -c 'ty=MOPPER' "$T" || true)"
            # EVERY substitution is defaulted before it is compared. An empty
            # one used to make `test` die with "integer expression expected"
            # and take the whole step with it, hiding the real assertions.
            srp="${srp:-0}"; life="${life:-0}"; active="${active:-0}"
            markers="${markers:-0}"; starved="${starved:-0}"
            soldiers="${soldiers:-0}"; moppers="${moppers:-0}"
            echo "${MAP}: srp records=${srp} max life=${life}" \
                 "srp active rounds=${active} marker checksums=${markers}" \
                 "starved soldier records=${starved}" \
                 "soldier records=${soldiers} mopper records=${moppers}"
            srp_total=$((srp_total + srp))
            active_total=$((active_total + active))
            starved_total=$((starved_total + starved))
            if [ "${life}" -gt "${life_max}" ]; then life_max="${life}"; fi
            # PER MAP, unconditionally: the marker subsystem, the starvation
            # path and both robot types the paint economy can afford.
            test "${markers}" -ge 2 || {
              echo "::error::${MAP}: the marker checksum never changed, so the"
              echo "::error::whole per-team marker subsystem is untested."
              fail=1; }
            test "${starved}" -ge 2 || {
              echo "::error::${MAP}: no soldier ever stood at exactly 0 paint,"
              echo "::error::so the 20-HP-a-turn starvation path is untested."
              fail=1; }
            # Both robot types the paint economy can afford really appear.
            # Measured on this exact bot: 1 726 to 33 720 mopper records and
            # 940 to 26 929 soldier records a map, so 100 is a floor an idle
            # bot could not reach and a working one clears by an order of
            # magnitude.
            test "${soldiers}" -ge 100 || { echo "::error::${MAP}: no soldiers"; fail=1; }
            test "${moppers}" -ge 100 || { echo "::error::${MAP}: no moppers"; fail=1; }
          done

          # THE SRP LIFECYCLE IS ASSERTED ACROSS THE SIX MAPS, NOT PER MAP,
          # and the reason is a fact about the 2025 map set rather than about
          # the bot: `isValidPatternCenter(loc, false)` needs a 5x5 with NO
          # WALL AND NO RUIN anywhere in it, and THREE of the six `small` maps
          # -- DefaultSmall, CastleDefense and Paintball -- have ZERO such
          # tiles on the whole board (measured; `Justice` has six, `Jail` 28,
          # `Filter` 56). A per-map assertion would be demanding that the bot
          # lay a pattern where the rules forbid one.
          echo "across the six maps: srp records=${srp_total}" \
               "max lifetime=${life_max} srp-active rounds=${active_total}" \
               "starved soldier records=${starved_total}"
          test "${srp_total}" -ge 1 || {
            echo "::error::the scenario bot never registered a resource"
            echo "::error::pattern on ANY map -- the SRP lifecycle is untested."
            fail=1; }
          test "${life_max}" -ge 50 || {
            echo "::error::no resource pattern anywhere reached lifetime 50,"
            echo "::error::so the fifty-round activation delay is untested."
            fail=1; }
          test "${active_total}" -ge 1 || {
            echo "::error::no round on any map counted an ACTIVE pattern."
            fail=1; }
          exit "${fail}"

      - name: Upload the traces (first 200 divergent lines and a digest)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle25/evidence
          for f in /tmp/oracle25/traces/*.log; do
            cp "$f" /tmp/oracle25/evidence/
          done
          # Whole traces are 3-4 MB a side and eighteen pairs would be seventy
          # megabytes; only the first 200 divergent lines and a gzipped digest
          # are worth keeping.
          for f in /tmp/oracle25/traces/*.java; do
            base="$(basename "$f" .java)"
            sed 's/ bc=[0-9]*//' "$f" > /tmp/oracle25/stripped.java
            if ! diff -q /tmp/oracle25/stripped.java \
                 "/tmp/oracle25/traces/${base}.nim" >/dev/null; then
              diff /tmp/oracle25/stripped.java \
                "/tmp/oracle25/traces/${base}.nim" | head -200 \
                > "/tmp/oracle25/evidence/${base}.diff"
            fi
            head -400 "$f" | gzip > "/tmp/oracle25/evidence/${base}.head.gz"
          done
          ls -la /tmp/oracle25/evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-bc25
          path: /tmp/oracle25/evidence
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # Packaging smoke: the production image builds, and one real episode runs
  # end to end in raw docker with the certification fixture's seat mix.
  # ---------------------------------------------------------------------
  # THE bc23 PARITY ORACLE. The published 2023 fat jar as a CI-ONLY
  # differential test, on TEMURIN 8 -- and that is not a preference: the jar
  # bundles ASM 5.0.4 and under JDK 21 the instrumenter throws inside
  # ClassReader.<init> on EVERY player class load, no robot is ever built,
  # and the job would exit 0 while proving nothing (docs/PARITY.md section
  # bc23). There is no JDK in any image stage -- only here.
  #
  # MEASURED IN THE SANDBOX BEFORE THIS JOB WAS WRITTEN: all six trace pairs
  # are bit-exact for WHOLE 2000-round games, 96k-270k trace lines a side,
  # with the traced bytecode peak at 5-7 % of the limit and ZERO mid-turn
  # cut-offs. That is why tools/ci/parity_ledger_bc23.json ships EMPTY.
  # ---------------------------------------------------------------------
  parity-oracle-bc23:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # TEMURIN 8. NOT NEGOTIABLE. See the job comment.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: The JDK really is 8
        run: |
          set -euo pipefail
          java -version 2>&1 | tee /tmp/javaver
          javac -version 2>&1 | tee -a /tmp/javaver
          grep -q '1\.8\.' /tmp/javaver || {
            echo "::error::this oracle MUST run on Temurin 8: the jar bundles"
            echo "::error::ASM 5.0.4 and under a newer JDK the instrumenter"
            echo "::error::throws on every player class load, no robot is ever"
            echo "::error::built, and this job would be green while proving"
            echo "::error::nothing (docs/PARITY.md section bc23)."
            exit 1; }
          # And `--release` must NOT be used: it arrived in JDK 9 and dies
          # with "invalid flag" here in seconds (the bc21 lesson). This
          # asserts the trap rather than trusting a comment.
          if javac --release 8 -version >/dev/null 2>&1; then
            echo "::error::this javac accepts --release, so it is not 8"
            exit 1
          fi
          echo "javac rejects --release, as a JDK-8 javac must"

      - name: Fetch the pinned Battlecode 2023 sources and the published jar
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine23 /tmp/oracle23
          curl -fsSL \
            "https://github.com/battlecode/battlecode23/archive/${BC23_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine23
          echo "BC23_DIR=/tmp/engine23/battlecode23-${BC23_COMMIT}" >> "$GITHUB_ENV"
          curl -fsSL -o /tmp/oracle23/battlecode23.jar "${BC23_JAR_URL}"

      - name: Build the oracle (jar sha256 AND size verified, JDK 8, no javac flags)
        run: |
          set -euo pipefail
          ./tools/oracle/bc23/build_oracle.sh /tmp/oracle23/battlecode23.jar \
            /tmp/oracle23/build

      # Tier B, part 1: every GameConstants field, PRINTED from the jar's own
      # classes -- and NO VERSION-STRING ASSERTION, because the released
      # 3.0.15 jar reports SPEC_VERSION = "3.0.14" (measured). The sha256 and
      # the size are the version pin; these constants are the cross-check.
      - name: The jar's own constants, and its useless SPEC_VERSION
        run: |
          set -euo pipefail
          javac -nowarn -encoding UTF-8 -cp /tmp/oracle23/battlecode23.jar \
            -d /tmp/oracle23/build/classes tools/JavaBc23Tables.java
          timeout 600 java -cp \
            "/tmp/oracle23/battlecode23.jar:/tmp/oracle23/build/classes" \
            JavaBc23Tables constants | tee /tmp/oracle23/constants.txt
          spec="$(grep '^SPEC_VERSION=' /tmp/oracle23/constants.txt | cut -d= -f2)"
          echo "the RELEASED 3.0.15 jar reports SPEC_VERSION=${spec}"
          test "${spec}" = "3.0.14" || {
            echo "::error::the jar's SPEC_VERSION moved to ${spec}. The pin is"
            echo "::error::the sha256 in tools/oracle/bc23/jar.lock, so this is"
            echo "::error::only a note -- but the note is now wrong and"
            echo "::error::docs/RULES-BC23.md Divergences item 12 needs a fix."
            exit 1; }
          # Every constant the generated table claims, against the JAR.
          python3 - <<'PY'
          import pathlib, re
          jar = {}
          for line in pathlib.Path("/tmp/oracle23/constants.txt").read_text().splitlines():
              if "=" not in line:
                  continue
              k, v = line.split("=", 1)
              jar[k] = v
          src = pathlib.Path("src/battlecode/years/bc23/constants.nim").read_text()
          def camel(name):
              parts = name.split("_")
              return parts[0].capitalize() + "".join(p.capitalize() for p in parts[1:])
          bad = []
          checked = 0
          for name, value in sorted(jar.items()):
              m = re.search(r"^  " + re.escape(camel(name)) +
                            r"\*: (\w+) = (.+)$", src, re.M)
              if not m:
                  continue
              kind, literal = m.group(1), m.group(2).strip()
              checked += 1
              if kind == "string":
                  want = literal.strip('"')
                  if want != value:
                      bad.append(f"{name}: nim {want!r} jar {value!r}")
              elif kind in ("float32", "float64"):
                  if abs(float(literal) - float(value)) > 1e-6:
                      bad.append(f"{name}: nim {literal} jar {value}")
              else:
                  if int(literal) != int(float(value)):
                      bad.append(f"{name}: nim {literal} jar {value}")
          print(f"cross-checked {checked} GameConstants fields against the jar")
          if checked < 40:
              raise SystemExit(f"::error::only {checked} fields cross-checked")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              raise SystemExit(1)
          PY

      # Tier B, part 2 (BLOCKING): the WHOLE FINITE ARITHMETIC DOMAIN,
      # regenerated from the jar's own classes and BYTE-DIFFED against the
      # committed table. bc23 has no transcendental anywhere, so this tier is
      # not a sample: the RobotType and Anchor tables, both carrier weight
      # tables at every reachable weight, THE ENTIRE cooldown-multiplier
      # lattice, the float32 conquest threshold at every island count and the
      # island occupancy formula at every pair. `tests/test_bc23_tempo.nim`
      # asserts the NIM side against the same bytes on every test run.
      - name: Tier B (BLOCKING) — the WHOLE finite arithmetic domain, byte-diffed
        run: |
          set -euo pipefail
          timeout 600 java -cp \
            "/tmp/oracle23/battlecode23.jar:/tmp/oracle23/build/classes" \
            JavaBc23Tables tables > /tmp/oracle23/tables.json
          if ! diff -u data/bc23/tables.json /tmp/oracle23/tables.json; then
            echo "::error::data/bc23/tables.json is not what the jar's own"
            echo "::error::classes emit. Re-run tools/JavaBc23Tables.java and"
            echo "::error::commit the result."
            exit 1
          fi
          echo "Tier B: the committed arithmetic table IS the jar's own output"

      - name: Build the Nim trace emitters (Tier A and Tier A')
        run: |
          set -euo pipefail
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle23/parity_trace_bc23 tools/parity_trace_bc23.nim
          # The SAME source with `-d:bc23Scenario`, which swaps the chassis
          # for src/battlecode/years/bc23/chassis/scenario23.nim -- the Nim
          # half of the Tier A' twin.
          nim c --hints:off -d:release -d:bc23Scenario --path:src \
            -o:/tmp/oracle23/parity_trace_bc23_scenario \
            tools/parity_trace_bc23.nim

      # WHOLE 2000-ROUND GAMES on the six `small` pairs, for BOTH bots. Every
      # `java` invocation is wrapped in `timeout 600`, because the sandboxed
      # player threads are NON-DAEMON and a driver that throws without
      # System.exit() hangs for ever (measured).
      - name: Run both engines on twelve pairs (whole 2000-round games)
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle23/traces
          for BOT in examplefuncsplayer23 bc23scenario; do
            case "$BOT" in
              examplefuncsplayer23) NIMBIN=/tmp/oracle23/parity_trace_bc23 ;;
              bc23scenario) NIMBIN=/tmp/oracle23/parity_trace_bc23_scenario ;;
            esac
            for MAP in Quiet SmallElements Lantern Spin Sneaky Barcode; do
              timeout 600 java -Xmx2g -XX:+UseSerialGC \
                -cp "/tmp/oracle23/battlecode23.jar:/tmp/oracle23/build/classes" \
                battlecode.world.Bc23Trace "$MAP" 2000 "$BOT" \
                /tmp/oracle23/build/classes \
                > "/tmp/oracle23/traces/${BOT}.${MAP}.java" \
                2> "/tmp/oracle23/traces/${BOT}.${MAP}.java.log"
              tail -1 "/tmp/oracle23/traces/${BOT}.${MAP}.java.log"
              "$NIMBIN" "$MAP" 2000 \
                > "/tmp/oracle23/traces/${BOT}.${MAP}.nim"
              echo "${BOT}/${MAP}: java $(wc -l < "/tmp/oracle23/traces/${BOT}.${MAP}.java") lines," \
                   "nim $(wc -l < "/tmp/oracle23/traces/${BOT}.${MAP}.nim") lines"
            done
          done

      # EVERY GAME REALLY RAN. This is the step that catches the JDK-21 ASM
      # trap from the other side: the driver exits 3 when no robot is built,
      # and this asserts the rounds and the unit count as well, so a harness
      # that produced a few hundred empty lines cannot be green.
      - name: Every game really ran (the ASM trap)
        run: |
          set -euo pipefail
          for BOT in examplefuncsplayer23 bc23scenario; do
          for MAP in Quiet SmallElements Lantern Spin Sneaky Barcode; do
            log="/tmp/oracle23/traces/${BOT}.${MAP}.java.log"
            rounds="$(sed -n 's/.* rounds=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            built="$(sed -n 's/.* built=\([0-9]*\).*/\1/p' "$log" | tail -1)"
            pct="$(sed -n 's/.* peak_pct=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            echo "${BOT}/${MAP}: rounds=${rounds} built=${built} peak_bytecode=${pct}%"
            test "${rounds:-0}" -ge 1900 || {
              echo "::error::${BOT}/${MAP} only reached round ${rounds}. Under"
              echo "::error::a JDK newer than 8 the instrumenter kills every"
              echo "::error::robot as it spawns and the trace is a few hundred"
              echo "::error::empty lines."
              exit 1; }
            test "${built:-0}" -ge 50 || {
              echo "::error::${BOT}/${MAP} built only ${built} robots in 2000"
              echo "::error::rounds."
              exit 1; }
            test "${pct:-100}" -le 50 || {
              echo "::error::${BOT}/${MAP} peaked at ${pct}% of a bytecode"
              echo "::error::limit, above the 50% headroom bound. Past that"
              echo "::error::point the comparison is no longer defined."
              exit 1; }
          done
          done

      # A SCENARIO BOT THAT AGREES BIT FOR BIT WHILE DOING NOTHING PROVES
      # NOTHING (docs/PARITY.md section bc23). This reads the JAVA traces --
      # the engine's own output, not the port's -- and asserts that the paths
      # Tier A cannot reach really fired. Every threshold below is MEASURED
      # on the six committed maps at this jar and this bot; they are floors,
      # not equalities, so a change that fires a path MORE often is green.
      - name: Tier A-prime really exercised the paths Tier A cannot reach
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys

          MAPS = ["Quiet", "SmallElements", "Lantern", "Spin", "Sneaky",
                  "Barcode"]
          seen = {
              "an anchor planted on an island (I own=1|2 anch=STANDARD)": 0,
              "an island lost back to neutral after being held": 0,
              "a well upgraded to rate 3": 0,
              "a well transformed to elixir (W ty=EX)": 0,
              "an amplifier built (U ty=AMPLIFIER)": 0,
              "a carrier holding an anchor (U ty=CARRIER anc=1)": 0,
              "the shared array changing (S fold not constant)": 0,
          }
          for name in MAPS:
              path = pathlib.Path(
                  f"/tmp/oracle23/traces/bc23scenario.{name}.java")
              owned = {}
              folds = set()
              for line in path.read_text().splitlines():
                  f = line.split()
                  if len(f) < 4:
                      continue
                  kind = f[2]
                  if kind == "I":
                      island, own, anch = f[3], f[4], f[6]
                      if own in ("own=1", "own=2"):
                          owned[island] = True
                          if anch == "anch=STANDARD":
                              seen["an anchor planted on an island "
                                   "(I own=1|2 anch=STANDARD)"] += 1
                      elif own == "own=0" and owned.get(island):
                          owned[island] = False
                          seen["an island lost back to neutral after "
                               "being held"] += 1
                  elif kind == "W":
                      if f[5] == "rate=3":
                          seen["a well upgraded to rate 3"] += 1
                      if f[4] == "ty=EX":
                          seen["a well transformed to elixir (W ty=EX)"] += 1
                  elif kind == "U":
                      if f[5] == "ty=AMPLIFIER":
                          seen["an amplifier built (U ty=AMPLIFIER)"] += 1
                      if f[5] == "ty=CARRIER" and f[12] != "anc=0":
                          seen["a carrier holding an anchor "
                               "(U ty=CARRIER anc=1)"] += 1
                  elif kind == "S" and f[3] == "A":
                      folds.add(f[4])
              if len(folds) > 1:
                  seen["the shared array changing "
                       "(S fold not constant)"] += 1

          bad = []
          for what, count in sorted(seen.items()):
              print(f"  {count:8d}  {what}")
              if count == 0:
                  bad.append(what)
          for b in bad:
              print(f"::error::Tier A-prime never produced: {b}. The scenario "
                    f"bot agrees with the engine while doing nothing, which "
                    f"proves nothing.")
          sys.exit(1 if bad else 0)
          PY

      - name: Tier A and Tier C (both BLOCKING)
        run: |
          set -euo pipefail
          # The comparator's own negative control first: a trace pair that
          # differs only in LENGTH must be reported as a divergence, in both
          # directions. It read as bit-exact until r1-F26.
          python3 tools/ci/parity_tiers_bc23.py --selftest
          python3 tools/ci/parity_tiers_bc23.py \
            --dir /tmp/oracle23/traces \
            --maps Quiet SmallElements Lantern Spin Sneaky Barcode \
            --bots examplefuncsplayer23 bc23scenario \
            --ledger tools/ci/parity_ledger_bc23.json \
            --summary "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload the traces (first 200 divergent lines and a digest)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle23/upload
          cd /tmp/oracle23/traces
          for BOT in examplefuncsplayer23 bc23scenario; do
          for MAP in Quiet SmallElements Lantern Spin Sneaky Barcode; do
            j="${BOT}.${MAP}.java"
            n="${BOT}.${MAP}.nim"
            [ -f "$j" ] && [ -f "$n" ] || continue
            # A 2000-round trace is 18-22 MB a side; only the first 200
            # divergent lines and a gzipped digest are uploaded.
            sed -E 's/ bc=[0-9]+//' "$j" > "/tmp/j.$$"
            diff "/tmp/j.$$" "$n" | head -200 \
              > "/tmp/oracle23/upload/${BOT}.${MAP}.diff.txt" || true
            head -400 "$j" | gzip -9 \
              > "/tmp/oracle23/upload/${BOT}.${MAP}.java.head.gz"
            head -400 "$n" | gzip -9 \
              > "/tmp/oracle23/upload/${BOT}.${MAP}.nim.head.gz"
            cp "${BOT}.${MAP}.java.log" "/tmp/oracle23/upload/" || true
            rm -f "/tmp/j.$$"
          done
          done
          ls -la /tmp/oracle23/upload

      - name: Upload the parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-bc23
          path: /tmp/oracle23/upload
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # THE bc22 PARITY ORACLE. The published 2022 fat jar as a CI-ONLY
  # differential test, on TEMURIN 8 -- and that is not a preference: the jar
  # bundles ASM 5.0.4 and under JDK 21 the instrumenter throws inside
  # ClassReader.<init> on EVERY player class load, no robot is ever built,
  # the game ends at round 1 with ANNIHILATION after six trace lines, and the
  # job would exit 0 while proving nothing (docs/PARITY.md section bc22).
  # There is no JDK in any image stage -- only here.
  #
  # MEASURED IN THE SANDBOX BEFORE THIS JOB WAS WRITTEN, with this jar and
  # this JDK: ALL FORTY trace pairs -- one example-bot pair and four scenario
  # pairs on each of eight maps -- are bit-exact for WHOLE 2000-round games,
  # 180k-285k trace lines a side, with the example bot's traced bytecode peak
  # at 6-7 % of its limit and the scenario bots' at 13-23 %, and ZERO
  # mid-turn cut-offs anywhere. That is why tools/ci/parity_ledger_bc22.json
  # ships EMPTY.
  # ---------------------------------------------------------------------
  parity-oracle-bc22:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # TEMURIN 8. NOT NEGOTIABLE. See the job comment.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: The JDK really is 8
        run: |
          set -euo pipefail
          java -version 2>&1 | tee /tmp/javaver22
          javac -version 2>&1 | tee -a /tmp/javaver22
          grep -q '1\.8\.' /tmp/javaver22 || {
            echo "::error::this oracle MUST run on Temurin 8: the jar bundles"
            echo "::error::ASM 5.0.4 and under a newer JDK the instrumenter"
            echo "::error::throws on every player class load, no robot is ever"
            echo "::error::built, and this job would be green while proving"
            echo "::error::nothing (docs/PARITY.md section bc22)."
            exit 1; }
          # And `--release` must NOT be used: it arrived in JDK 9 and dies
          # with "invalid flag" here in seconds (the bc21 lesson). This
          # asserts the trap rather than trusting a comment.
          if javac --release 8 -version >/dev/null 2>&1; then
            echo "::error::this javac accepts --release, so it is not 8"
            exit 1
          fi
          echo "javac rejects --release, as a JDK-8 javac must"

      - name: Fetch the published 2022 jar
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle22
          curl -fsSL -o /tmp/oracle22/battlecode22.jar "${BC22_JAR_URL}"

      - name: Build the oracle (jar sha256 AND size verified, JDK 8, no javac flags)
        run: |
          set -euo pipefail
          ./tools/oracle/bc22/build_oracle.sh /tmp/oracle22/battlecode22.jar \
            /tmp/oracle22/build

      # Tier B, part 1: every GameConstants field, PRINTED from the jar's own
      # classes -- and unlike bc23's and bc25's jars this one really does
      # report its own version, so SPEC_VERSION is a SECOND pin on top of the
      # sha256 and the size rather than a trap.
      - name: The jar's own constants, and its SPEC_VERSION
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle22/build/classes
          javac -nowarn -encoding UTF-8 -cp /tmp/oracle22/battlecode22.jar \
            -d /tmp/oracle22/build/classes tools/JavaBc22Tables.java
          timeout 600 java -cp \
            "/tmp/oracle22/battlecode22.jar:/tmp/oracle22/build/classes" \
            JavaBc22Tables constants | tee /tmp/oracle22/constants.txt
          spec="$(grep '^SPEC_VERSION=' /tmp/oracle22/constants.txt | cut -d= -f2)"
          echo "the released 2.2.1 jar reports SPEC_VERSION=${spec}"
          test "${spec}" = "2.2.1" || {
            echo "::error::the jar's SPEC_VERSION is ${spec}, not 2.2.1. The"
            echo "::error::primary pin is the sha256 and the size in"
            echo "::error::tools/oracle/bc22/jar.lock, so this means the pin"
            echo "::error::and the file have come apart."
            exit 1; }
          # Every constant the generated table claims, against the JAR.
          python3 - <<'PY'
          import pathlib, re
          jar = {}
          for line in pathlib.Path("/tmp/oracle22/constants.txt").read_text().splitlines():
              if "=" not in line:
                  continue
              k, v = line.split("=", 1)
              jar[k] = v
          src = pathlib.Path("src/battlecode/years/bc22/constants.nim").read_text()
          def camel(name):
              parts = name.split("_")
              return parts[0].capitalize() + "".join(p.capitalize() for p in parts[1:])
          bad = []
          checked = 0
          for name, value in sorted(jar.items()):
              m = re.search(r"^  " + re.escape(camel(name)) +
                            r"\*: (\w+) = (.+)$", src, re.M)
              if not m:
                  print(f"::error::GameConstants.{name} has no counterpart in "
                        f"src/battlecode/years/bc22/constants.nim")
                  bad.append(name)
                  continue
              kind, literal = m.group(1), m.group(2).strip()
              checked += 1
              if kind == "string":
                  want = literal.strip('"')
                  if want != value:
                      bad.append(f"{name}: nim {want!r} jar {value!r}")
              elif kind in ("float32", "float64"):
                  if abs(float(literal) - float(value)) > 1e-6:
                      bad.append(f"{name}: nim {literal} jar {value}")
              else:
                  if int(literal) != int(float(value)):
                      bad.append(f"{name}: nim {literal} jar {value}")
          print(f"cross-checked {checked} GameConstants fields against the jar")
          # The 2022 GameConstants has exactly 32 static fields and the
          # generated table carries ALL of them (measured), so this floor is
          # the whole class, not a sample.
          if checked < 32:
              raise SystemExit(f"::error::only {checked} fields cross-checked")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              raise SystemExit(1)
          PY

      # Tier B, part 2 (BLOCKING): the WHOLE FINITE ARITHMETIC DOMAIN,
      # regenerated from the jar's own classes and BYTE-DIFFED against the
      # committed table -- the RobotType table (9 constructor fields x 7
      # types) with every per-level health/damage/healing/mutate-cost/worth/
      # drop, the AnomalyType table, THE ENTIRE rubble cooldown lattice
      # (rubble 0..100 x eight bases, 808 entries, the 22 that differ from
      # the integer form flagged in the file), the prototype health, the
      # reclaim, the four anomaly truncations over their whole reachable
      # domains, and the laboratory rate for all 3 x 177 (level, n) pairs.
      # bc22 has exactly ONE transcendental and its domain is finite, so this
      # tier is not a sample: it is the entire domain.
      - name: Tier B (BLOCKING) — the WHOLE finite arithmetic domain, byte-diffed
        run: |
          set -euo pipefail
          timeout 600 java -cp \
            "/tmp/oracle22/battlecode22.jar:/tmp/oracle22/build/classes" \
            JavaBc22Tables tables > /tmp/oracle22/tables.json
          if ! diff -u data/bc22/tables.json /tmp/oracle22/tables.json; then
            echo "::error::data/bc22/tables.json is not what the jar's own"
            echo "::error::classes emit. Re-run tools/JavaBc22Tables.java and"
            echo "::error::commit the result."
            exit 1
          fi
          echo "Tier B: the committed arithmetic table IS the jar's own output"

      - name: Build the Nim trace emitters (Tier A and the four Tier A′ variants)
        run: |
          set -euo pipefail
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle22/parity_trace_bc22 tools/parity_trace_bc22.nim
          # The SAME source with `-d:bc22Scenario`, which swaps the chassis
          # for src/battlecode/years/bc22/chassis/scenario22.nim -- the Nim
          # half of the Tier A′ twin -- plus its three end-forcing variants.
          nim c --hints:off -d:release -d:bc22Scenario --path:src \
            -o:/tmp/oracle22/pt_bc22scenario tools/parity_trace_bc22.nim
          nim c --hints:off -d:release -d:bc22Scenario \
            -d:bc22ScenarioAnnihilate --path:src \
            -o:/tmp/oracle22/pt_bc22scenarioannihilate \
            tools/parity_trace_bc22.nim
          nim c --hints:off -d:release -d:bc22Scenario -d:bc22ScenarioTie \
            --path:src -o:/tmp/oracle22/pt_bc22scenariotie \
            tools/parity_trace_bc22.nim
          nim c --hints:off -d:release -d:bc22Scenario -d:bc22ScenarioFury \
            --path:src -o:/tmp/oracle22/pt_bc22scenariofury \
            tools/parity_trace_bc22.nim

      # WHOLE 2000-ROUND GAMES on the eight parity pairs, for ALL FIVE bots.
      # Every `java` invocation is wrapped in `timeout 900`, because the
      # sandboxed player threads are NON-DAEMON and a driver that throws
      # without System.exit() hangs for ever (measured).
      - name: Run both engines on forty pairs (whole 2000-round games)
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle22/traces
          for BOT in examplefuncsplayer22 bc22scenario \
                     bc22scenarioannihilate bc22scenariotie \
                     bc22scenariofury; do
            case "$BOT" in
              examplefuncsplayer22) NIMBIN=/tmp/oracle22/parity_trace_bc22 ;;
              *) NIMBIN="/tmp/oracle22/pt_${BOT}" ;;
            esac
            for MAP in chalice maze nottestsmall snowflake_redux rugged \
                       charge turtle vortex; do
              timeout 900 java -Xmx2g -XX:+UseSerialGC \
                -cp "/tmp/oracle22/battlecode22.jar:/tmp/oracle22/build/classes" \
                battlecode.world.Bc22Trace "$MAP" 2000 "$BOT" \
                /tmp/oracle22/build/classes \
                > "/tmp/oracle22/traces/${BOT}.${MAP}.java" \
                2> "/tmp/oracle22/traces/${BOT}.${MAP}.java.log"
              tail -1 "/tmp/oracle22/traces/${BOT}.${MAP}.java.log"
              "$NIMBIN" "$MAP" 2000 \
                > "/tmp/oracle22/traces/${BOT}.${MAP}.nim"
              echo "${BOT}/${MAP}: java $(wc -l < "/tmp/oracle22/traces/${BOT}.${MAP}.java") lines," \
                   "nim $(wc -l < "/tmp/oracle22/traces/${BOT}.${MAP}.nim") lines"
            done
          done

      # EVERY GAME REALLY RAN. This is the step that catches the JDK-21 ASM
      # trap from the other side: the driver exits 3 when no robot is built,
      # and this asserts the rounds, the robot count and the headroom as
      # well, so a harness that produced a few hundred empty lines cannot be
      # green. The floors are MEASURED and they differ by bot: the example
      # bot mirrors itself into 108-349 robots and plays to round 2000 on
      # every map (built 186-342), while the scenario bots are deliberately
      # small (built 57-155) and SEVERAL of their games END EARLY by winning
      # -- an ANNIHILATION at rounds 1084-1366 and two ladder-driven early
      # ends at 1641 and 1764 -- which is the whole point of those variants.
      # So their round floor is 800, and what catches the ASM trap for them
      # is the `built` floor and the driver's own exit 3: under a JDK newer
      # than 8 no robot is EVER built and the game ends at round 1.
      - name: Every game really ran (the ASM trap)
        run: |
          set -euo pipefail
          for BOT in examplefuncsplayer22 bc22scenario \
                     bc22scenarioannihilate bc22scenariotie \
                     bc22scenariofury; do
          case "$BOT" in
            examplefuncsplayer22) MINROUNDS=1900; MINBUILT=100; MAXPCT=50 ;;
            *) MINROUNDS=800; MINBUILT=40; MAXPCT=25 ;;
          esac
          for MAP in chalice maze nottestsmall snowflake_redux rugged \
                     charge turtle vortex; do
            log="/tmp/oracle22/traces/${BOT}.${MAP}.java.log"
            rounds="$(sed -n 's/.* rounds=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            built="$(sed -n 's/.* built=\([0-9]*\).*/\1/p' "$log" | tail -1)"
            robots="$(sed -n 's/.* peak_robots=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            pct="$(sed -n 's/.* peak_pct=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            echo "${BOT}/${MAP}: rounds=${rounds} built=${built}" \
                 "peak_robots=${robots} peak_bytecode=${pct}%"
            test "${rounds:-0}" -ge "${MINROUNDS}" || {
              echo "::error::${BOT}/${MAP} only reached round ${rounds}. Under"
              echo "::error::a JDK newer than 8 the instrumenter kills every"
              echo "::error::robot as it spawns and the trace is a few hundred"
              echo "::error::empty lines."
              exit 1; }
            test "${built:-0}" -ge "${MINBUILT}" || {
              echo "::error::${BOT}/${MAP} built only ${built} robots."
              exit 1; }
            test "${pct:-100}" -le "${MAXPCT}" || {
              echo "::error::${BOT}/${MAP} peaked at ${pct}% of a bytecode"
              echo "::error::limit, above the ${MAXPCT}% headroom bound. Past"
              echo "::error::that point the comparison is no longer defined,"
              echo "::error::because the port's DecisionOps budget has no"
              echo "::error::mid-turn resumption and the JVM's limit does."
              exit 1; }
          done
          done
          # The example bot's mirror really does fill a board.
          for MAP in chalice maze nottestsmall snowflake_redux rugged \
                     charge turtle vortex; do
            robots="$(sed -n 's/.* peak_robots=\([0-9]*\) .*/\1/p' \
              "/tmp/oracle22/traces/examplefuncsplayer22.${MAP}.java.log" | tail -1)"
            test "${robots:-0}" -ge 60 || {
              echo "::error::examplefuncsplayer22/${MAP} peaked at only"
              echo "::error::${robots} robots; the measured range is 108-349."
              exit 1; }
          done

      # A SCENARIO BOT THAT AGREES BIT FOR BIT WHILE DOING NOTHING PROVES
      # NOTHING (docs/PARITY.md section bc22). This reads the JAVA traces --
      # the engine's own output, not the port's -- and asserts that the paths
      # Tier A cannot reach really fired. Every threshold below is MEASURED
      # on the eight committed maps at this jar and these bots; they are
      # floors over the WHOLE set of thirty-two scenario games, not
      # per-game equalities, so a change that fires a path more often is
      # green. What the scenario bots still do NOT reach is listed in
      # docs/PARITY.md section bc22, "What is NOT compared".
      - name: Tier A-prime really exercised the paths Tier A cannot reach
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys

          MAPS = ["chalice", "maze", "nottestsmall", "snowflake_redux",
                  "rugged", "charge", "turtle", "vortex"]
          BOTS = ["bc22scenario", "bc22scenarioannihilate",
                  "bc22scenariotie", "bc22scenariofury"]
          # what -> (measured floor over all 32 games)
          FLOORS = {
              "a LABORATORY promoted from PROTOTYPE to TURRET": 4,
              "a WATCHTOWER promoted from PROTOTYPE to TURRET": 1,
              "a robot MUTATED to level 2": 1,
              "a robot MUTATED to level 3 (the GOLD mutation)": 1,
              "an ARCHON transformed to PORTABLE and then MOVED": 8,
              "the shared array changed (S fold not constant)": 16,
              "the rubble changed (a VORTEX permuted the board)": 12,
              "gold appeared on the MAP (a reclaim drop)": 8,
              "a team's gold reserve rose (a TRANSMUTATION)": 24,
              "the anomaly cursor advanced": 20,
              "a SAGE existed on the board": 4,
              "the game ended by ANNIHILATION": 2,
              "the game ended on MORE_ARCHONS": 2,
              "the game ended on MORE_GOLD_NET_WORTH": 2,
              "the game ended on MORE_LEAD_NET_WORTH": 2,
          }
          seen = dict.fromkeys(FLOORS, 0)

          for bot in BOTS:
              for name in MAPS:
                  path = pathlib.Path(
                      f"/tmp/oracle22/traces/{bot}.{name}.java")
                  labproto = set()
                  wtproto = set()
                  labdone = wtdone = lv2 = lv3 = 0
                  moved = 0
                  portloc = {}
                  folds = set()
                  rubble = set()
                  cursor = set()
                  mapgold = 0
                  teamgold = 0
                  sage = 0
                  for line in path.open():
                      f = line.split()
                      if len(f) < 4:
                          continue
                      kind = f[2]
                      if kind == "U":
                          rid, ty, md = f[3], f[5][3:], f[6][3:]
                          lv = int(f[7][3:])
                          if ty == "LABORATORY":
                              if md == "PROTOTYPE":
                                  labproto.add(rid)
                              elif md == "TURRET" and rid in labproto:
                                  labdone += 1
                          elif ty == "WATCHTOWER":
                              if md == "PROTOTYPE":
                                  wtproto.add(rid)
                              elif md == "TURRET" and rid in wtproto:
                                  wtdone += 1
                          elif ty == "SAGE":
                              sage += 1
                          if lv >= 2:
                              lv2 += 1
                          if lv >= 3:
                              lv3 += 1
                          if md == "PORTABLE" and ty == "ARCHON":
                              xy = (f[8], f[9])
                              if rid in portloc and portloc[rid] != xy:
                                  moved += 1
                              portloc[rid] = xy
                      elif kind == "S":
                          folds.add(f[4])
                      elif kind == "G":
                          rubble.add(f[5])
                          mapgold = max(mapgold, int(f[7][8:]))
                      elif kind == "T":
                          teamgold = max(teamgold, int(f[4][3:]))
                      elif kind == "A":
                          cursor.add(f[3])
                      elif kind == "Z":
                          dom = f[4][4:]
                          key = f"the game ended by ANNIHILATION" \
                              if dom == "ANNIHILATION" \
                              else f"the game ended on {dom}"
                          if key in seen:
                              seen[key] += 1
                  seen["a LABORATORY promoted from PROTOTYPE to TURRET"] += \
                      1 if labdone else 0
                  seen["a WATCHTOWER promoted from PROTOTYPE to TURRET"] += \
                      1 if wtdone else 0
                  seen["a robot MUTATED to level 2"] += 1 if lv2 else 0
                  seen["a robot MUTATED to level 3 (the GOLD mutation)"] += \
                      1 if lv3 else 0
                  seen["an ARCHON transformed to PORTABLE and then MOVED"] += \
                      1 if moved else 0
                  seen["the shared array changed (S fold not constant)"] += \
                      1 if len(folds) > 1 else 0
                  seen["the rubble changed (a VORTEX permuted the board)"] += \
                      1 if len(rubble) > 1 else 0
                  seen["gold appeared on the MAP (a reclaim drop)"] += \
                      1 if mapgold else 0
                  seen["a team's gold reserve rose (a TRANSMUTATION)"] += \
                      1 if teamgold else 0
                  seen["the anomaly cursor advanced"] += \
                      1 if len(cursor) > 1 else 0
                  seen["a SAGE existed on the board"] += 1 if sage else 0

          bad = []
          for what, floor in sorted(FLOORS.items()):
              count = seen[what]
              print(f"  {count:5d} / {floor:<5d}  {what}")
              if count < floor:
                  bad.append(f"{what}: {count}, floor {floor}")
          for b in bad:
              print(f"::error::Tier A-prime under its measured floor: {b}. "
                    f"The scenario bots agree with the engine while doing "
                    f"less than they did, which proves less.")
          sys.exit(1 if bad else 0)
          PY

      - name: Tier A, A′ and C (all BLOCKING)
        run: |
          set -euo pipefail
          # The comparator's own negative control first, covering all THREE
          # known comparator bugs: a `bc=` column on one side only, a trace
          # pair that differs only in LENGTH (in both directions), and a
          # zero-padded hex fold that is the same fold.
          python3 tools/ci/parity_tiers_bc22.py --selftest
          python3 tools/ci/parity_tiers_bc22.py \
            --dir /tmp/oracle22/traces \
            --maps chalice maze nottestsmall snowflake_redux rugged charge \
                   turtle vortex \
            --bots examplefuncsplayer22 bc22scenario \
                   bc22scenarioannihilate bc22scenariotie bc22scenariofury \
            --ledger tools/ci/parity_ledger_bc22.json \
            --summary "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload the traces (first 200 divergent lines and a digest)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle22/upload
          cd /tmp/oracle22/traces
          for BOT in examplefuncsplayer22 bc22scenario \
                     bc22scenarioannihilate bc22scenariotie \
                     bc22scenariofury; do
          for MAP in chalice maze nottestsmall snowflake_redux rugged \
                     charge turtle vortex; do
            j="${BOT}.${MAP}.java"
            n="${BOT}.${MAP}.nim"
            [ -f "$j" ] && [ -f "$n" ] || continue
            # A 2000-round trace is 18-27 MB a side; only the first 200
            # divergent lines and a gzipped digest are uploaded.
            sed -E 's/ bc=[0-9]+//' "$j" > "/tmp/j.$$"
            diff "/tmp/j.$$" "$n" | head -200 \
              > "/tmp/oracle22/upload/${BOT}.${MAP}.diff.txt" || true
            head -400 "$j" | gzip -9 \
              > "/tmp/oracle22/upload/${BOT}.${MAP}.java.head.gz"
            head -400 "$n" | gzip -9 \
              > "/tmp/oracle22/upload/${BOT}.${MAP}.nim.head.gz"
            cp "${BOT}.${MAP}.java.log" "/tmp/oracle22/upload/" || true
            rm -f "/tmp/j.$$"
          done
          done
          ls -la /tmp/oracle22/upload

      - name: Upload the parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-bc22
          path: /tmp/oracle22/upload
          if-no-files-found: warn
          retention-days: 14
  # ---------------------------------------------------------------------
  # THE bc16 PARITY ORACLE. The published 2016 engine, run headlessly as a
  # differential test, on TEMURIN 8 -- and that is not a preference: the jar
  # bundles a 2016-era ASM and a 2016-era XStream and the whole instrumenter
  # is built for Java 8 class files. Under a modern JDK the instrumenter
  # throws inside ClassReader.<init> on every player class load and the job
  # would exit 0 while proving nothing (docs/PARITY.md section bc16). There is
  # no JDK in any image stage -- only here.
  #
  # **TIER A IS A REAL AND LARGE TIER FOR THIS YEAR, and that is the single
  # most important thing to understand about bc16 parity.** The zombie half of
  # this game is ENGINE-SIDE, so an IDLE player bot still exercises the den
  # schedules and their per-den split, the spawn ring's direction and
  # chirality, `spawnAllPossible` and its proximity-damage fallback, the whole
  # eight-step zombie movement ladder, ALL THREE `java.util.Random` streams,
  # infection and the die-and-turn conversion, the corpse-rubble deposit,
  # `clearRubble` by digging zombies, the parts income curve, both factions'
  # archons being eaten, the mid-turn DESTROYED check and the round-2999
  # ladder. A tier that agrees bit for bit WHILE NOTHING HAPPENS proves
  # nothing, so this job asserts off the JAVA trace that all of it really
  # happened.
  #
  # MEASURED IN THE SANDBOX BEFORE THIS JOB WAS WRITTEN, with this jar and a
  # real Temurin 8: ALL EIGHTEEN trace pairs -- `bc16idle` and `bc16greenhorn`
  # on each of the nine parity maps -- are BIT-EXACT FOR WHOLE 3000-ROUND
  # GAMES, 10k-129k trace lines a side, with the traced bytecode peak at 0 %
  # of every limit and therefore never leaving the engine's own 1.0 branch of
  # `decrementDelays`. That is why tools/ci/parity_ledger_bc16.json ships
  # EMPTY. Three real defects were found and fixed getting there, and each is
  # recorded in docs/PARITY.md section bc16:
  #   1. `Collectors.toMap` accumulates with `HashMap.merge`, which PREPENDS
  #      within a bucket, not `put`, which appends -- so the converter's
  #      emulated `keySet()` order was reversed inside every shared bucket and
  #      the per-den zombie split was permuted (`zigzag`, round 100);
  #   2. `ZombieControlProvider.denQueues` is keyed by ROBOT ID, not by
  #      `MapLocation`, so the driver's `q=` column read 0:0:0:0 for every den
  #      on every round (`prisons`, round 1200);
  #   3. `String.format("%.6f")` rounds HALF-UP where C's `printf` -- which is
  #      what Nim's `formatFloat` calls -- rounds HALF-TO-EVEN, so a 900-term
  #      sum over BYTE-IDENTICAL arrays printed differently (`checkers`, round
  #      219). Both sides now print the two sums as raw IEEE-754 bit patterns.
  # ---------------------------------------------------------------------
  parity-oracle-bc16:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # TEMURIN 8. NOT NEGOTIABLE. See the job comment.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: The JDK really is 8
        run: |
          set -euo pipefail
          java -version 2>&1 | tee /tmp/javaver16
          javac -version 2>&1 | tee -a /tmp/javaver16
          grep -q '1\.8\.' /tmp/javaver16 || {
            echo "::error::this oracle MUST run on Temurin 8: the jar bundles"
            echo "::error::a 2016-era ASM and under a newer JDK the"
            echo "::error::instrumenter throws on every player class load and"
            echo "::error::this job would be green while proving nothing"
            echo "::error::(docs/PARITY.md section bc16)."
            exit 1; }
          # And `--release` must NOT be used: it arrived in JDK 9 and dies
          # with "invalid flag" here in seconds (the bc21 lesson). This
          # asserts the trap rather than trusting a comment.
          if javac --release 8 -version >/dev/null 2>&1; then
            echo "::error::this javac accepts --release, so it is not 8"
            exit 1
          fi
          echo "javac rejects --release, as a JDK-8 javac must"

      - name: Fetch the published 2016 jar
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle16
          curl -fsSL -o /tmp/oracle16/battlecode2016.jar "${BC16_JAR_URL}"

      - name: Build the oracle (jar sha256, size AND version verified, JDK 8)
        run: |
          set -euo pipefail
          ./tools/oracle/bc16/build_oracle.sh \
            /tmp/oracle16/battlecode2016.jar /tmp/oracle16/build

      # Tier B, part 1: every GameConstants field, PRINTED from the jar's own
      # classes. THERE IS NO `SPEC_VERSION` IN 2016's GameConstants -- the
      # field does not exist -- so the sha256, the size and the jar's own
      # `battlecode-version` entry are the pins, and this step cross-checks
      # every constant anyway. 2016's GameConstants is an INTERFACE, so its
      # fields are implicitly `public static final` and reflection sees all of
      # them.
      - name: The jar's own constants, cross-checked against the generated table
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle16/build/classes
          javac -nowarn -encoding UTF-8 -cp /tmp/oracle16/battlecode2016.jar \
            -d /tmp/oracle16/build/classes tools/JavaBc16Tables.java
          timeout 600 java -cp \
            "/tmp/oracle16/battlecode2016.jar:/tmp/oracle16/build/classes" \
            JavaBc16Tables constants | tee /tmp/oracle16/constants.txt
          python3 - <<'PY'
          import pathlib, re
          jar = {}
          for line in pathlib.Path("/tmp/oracle16/constants.txt").read_text().splitlines():
              if "=" not in line:
                  continue
              k, v = line.split("=", 1)
              jar[k] = v
          src = pathlib.Path("src/battlecode/years/bc16/constants.nim").read_text()
          def camel(name):
              parts = name.split("_")
              return parts[0].capitalize() + "".join(p.capitalize() for p in parts[1:])
          bad = []
          checked = 0
          missing = []
          for name, value in sorted(jar.items()):
              m = re.search(r"^  " + re.escape(camel(name)) +
                            r"\*: (\w+) = (.+)$", src, re.M)
              if not m:
                  missing.append(name)
                  continue
              kind, literal = m.group(1), m.group(2).strip()
              checked += 1
              if kind == "string":
                  want = literal.strip('"')
                  if want != value:
                      bad.append(f"{name}: nim {want!r} jar {value!r}")
              elif kind in ("float32", "float64"):
                  if abs(float(literal) - float(value)) > 1e-9:
                      bad.append(f"{name}: nim {literal} jar {value}")
              else:
                  if int(literal) != int(float(value)):
                      bad.append(f"{name}: nim {literal} jar {value}")
          print(f"cross-checked {checked} of {len(jar)} GameConstants fields "
                f"against the jar")
          # The ARMAGEDDON_* family and the instrumentation constants are
          # DELIBERATELY not ported (V4, V5, V8), so they are named here
          # rather than silently skipped.
          for name in missing:
              print(f"  not ported (see docs/RULES-BC16.md section "
                    f"Divergences): {name}")
          if checked < 25:
              raise SystemExit(f"::error::only {checked} fields cross-checked; "
                               f"the generated table has come apart from the jar")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              raise SystemExit(1)
          PY

      # Tier B, part 2 (BLOCKING): the WHOLE FINITE ARITHMETIC DOMAIN,
      # regenerated from the jar's own classes and BYTE-DIFFED against the
      # committed table -- the twelve-row RobotType table with all seventeen
      # constructor fields and the turnsInto graph, the eight derived
      # predicates, the outbreak ladder for levels 0..12 with every type's
      # scaled health and attack, the guard reduction over every reachable
      # attack power, `Math.pow(k/8000, 1.5)` FOR ALL 8 001 k (the V1 table),
      # `(int) Math.sqrt(r2)` for r2 0..10 000, THE WHOLE `directionTo`
      # LATTICE for dx, dy in -80..80 (25 921 pairs), the rubble clear map and
      # the parts income curve. bc16 has exactly TWO non-algebraic functions
      # and both domains are finite, so this tier is not a sample: it is the
      # entire domain.
      - name: Tier B (BLOCKING) — the WHOLE finite arithmetic domain, byte-diffed
        run: |
          set -euo pipefail
          timeout 600 java -cp \
            "/tmp/oracle16/battlecode2016.jar:/tmp/oracle16/build/classes" \
            JavaBc16Tables tables 2016.0.2.2 > /tmp/oracle16/tables.json
          if ! diff -u data/bc16/tables.json /tmp/oracle16/tables.json \
               | head -40; then
            echo "::error::data/bc16/tables.json is not what the jar's own"
            echo "::error::classes emit. Re-run tools/JavaBc16Tables.java and"
            echo "::error::commit the result."
            exit 1
          fi
          diff -q data/bc16/tables.json /tmp/oracle16/tables.json
          echo "Tier B: the committed arithmetic table IS the jar's own output"

      # AND THE ENGINE'S OWN `Math.pow` IS WITHIN ONE ULP OF THE TABLE.
      #
      # `pow_1_5` is tabled from `StrictMath.pow`, not from the `Math.pow` the
      # engine actually calls, because `Math.pow` is permitted 1 ulp of error
      # and IS NOT REPRODUCIBLE BETWEEN JDK BUILDS -- measured, Temurin 8u422
      # and 8u452 disagree on this domain, and either disagrees with
      # `StrictMath` on hundreds of the 8 001 cells. A byte-diff of a
      # `Math.pow` table therefore fails for a reason that has nothing to do
      # with this port. `StrictMath.pow` must reproduce fdlibm bit for bit on
      # every conforming JVM, so the byte-diff above stays absolute -- and
      # this step adds the assertion it would otherwise have lost: the RUNNING
      # JDK's `Math.pow`, the call the engine makes, is within one ulp of
      # every tabled value. Strictly more checks than a `Math.pow` byte-diff,
      # not fewer. See docs/PARITY.md section bc16 and docs/RULES-BC16.md V1.
      - name: Tier B (BLOCKING) — the running JDK's own Math.pow, within 1 ulp
        run: |
          set -euo pipefail
          cat > /tmp/oracle16/PowCheck.java <<'JAVA'
          import java.io.*;
          import java.util.*;
          public final class PowCheck {
              public static void main(String[] a) throws Exception {
                  String all = new Scanner(new File(a[0]), "UTF-8")
                      .useDelimiter("\\A").next();
                  int i = all.indexOf("\"pow_1_5\":");
                  int lo = all.indexOf('[', i), hi = all.indexOf(']', lo);
                  String[] cells = all.substring(lo + 1, hi).split(",");
                  if (cells.length != 8001)
                      throw new IllegalStateException(
                          "pow_1_5 has " + cells.length + " cells, want 8001");
                  int exact = 0, oneUlp = 0, worse = 0, firstBad = -1;
                  for (int k = 0; k <= 8000; k++) {
                      double want = Double.parseDouble(cells[k].trim());
                      double got = Math.pow(k / 8000.0, 1.5);
                      long g = Double.doubleToRawLongBits(got);
                      long w = Double.doubleToRawLongBits(want);
                      if (g == w) exact++;
                      else if (Math.abs(g - w) <= 1L) oneUlp++;
                      else { worse++; if (firstBad < 0) firstBad = k; }
                  }
                  System.out.println("this JDK's Math.pow against the tabled "
                      + "StrictMath.pow: " + exact + " bit-exact, " + oneUlp
                      + " one ulp apart, " + worse + " further");
                  if (worse > 0) {
                      System.out.println("::error::" + worse + " tabled "
                          + "pow(k/8000,1.5) values are more than one ulp "
                          + "from this JDK's Math.pow, first at k="
                          + firstBad + ". That is not a rounding-mode "
                          + "difference, it is a wrong table.");
                      System.exit(1);
                  }
                  System.exit(0);
              }
          }
          JAVA
          javac -nowarn -encoding UTF-8 -d /tmp/oracle16/build/classes \
            /tmp/oracle16/PowCheck.java
          timeout 300 java -cp /tmp/oracle16/build/classes PowCheck \
            data/bc16/tables.json

      # Tier B, part 3 (BLOCKING): D3 AND D4, PROVED RATHER THAN TRUSTED. The
      # committed maps carry a build-time SYMMETRY and a build-time PER-DEN
      # SPLIT of the public zombie schedule, and both are reproduced here from
      # the JVM's own `GameMap.getSymmetry()` and
      # `GameMap.getZombieSpawnSchedule(denLoc)` and compared cell by cell.
      # This is the step that catches a `HashMap` iteration-order bug, and it
      # is the step that DID catch one.
      - name: Tier B (BLOCKING) — the 22 maps' symmetry and per-den split, from the JVM
        run: |
          set -euo pipefail
          cat > /tmp/oracle16/MapProbe.java <<'JAVA'
          import battlecode.common.*;
          import battlecode.world.*;
          import java.util.*;
          public final class MapProbe {
              public static void main(String[] a) throws Exception {
                  StringBuilder b = new StringBuilder();
                  for (String name : a) {
                      GameMap m = GameMapIO.loadMap(name, null);
                      MapLocation o = m.getOrigin();
                      b.append(name).append(" symmetry=")
                       .append(m.getSymmetry().name().toLowerCase())
                       .append('\n');
                      List<String> rows = new ArrayList<String>();
                      for (GameMap.InitialRobotInfo r : m.getInitialRobots()) {
                          if (r.type != RobotType.ZOMBIEDEN) continue;
                          MapLocation l = new MapLocation(
                              r.originOffsetX, r.originOffsetY);
                          ZombieSpawnSchedule s = m.getZombieSpawnSchedule(
                              l.add(o.x, o.y));
                          StringBuilder d = new StringBuilder();
                          d.append(name).append(" den ").append(l.x)
                           .append(',').append(l.y);
                          for (int round : s.getRounds()) {
                              d.append(" r").append(round).append('=');
                              int[] c = new int[4];
                              for (ZombieCount zc : s.getScheduleForRound(round)) {
                                  RobotType t = zc.getType();
                                  int i = t == RobotType.STANDARDZOMBIE ? 0
                                        : t == RobotType.RANGEDZOMBIE ? 1
                                        : t == RobotType.FASTZOMBIE ? 2 : 3;
                                  c[i] += zc.getCount();
                              }
                              d.append(c[0]).append(':').append(c[1])
                               .append(':').append(c[2]).append(':')
                               .append(c[3]);
                          }
                          rows.add(d.toString());
                      }
                      Collections.sort(rows);
                      for (String r : rows) b.append(r).append('\n');
                  }
                  System.out.print(b);
                  System.exit(0);
              }
          }
          JAVA
          javac -nowarn -encoding UTF-8 -cp /tmp/oracle16/battlecode2016.jar \
            -d /tmp/oracle16/build/classes /tmp/oracle16/MapProbe.java
          MAPS="checkers zigzag swamp river prisons frogger closequarters
                lockdown industrial quadrants turtle boxy voluted collision
                caverns 6147 desert space scouting vortex wormy quarry"
          timeout 600 java -cp \
            "/tmp/oracle16/battlecode2016.jar:/tmp/oracle16/build/classes" \
            MapProbe ${MAPS} > /tmp/oracle16/mapprobe.txt
          wc -l /tmp/oracle16/mapprobe.txt
          python3 - <<'PY'
          import json, pathlib
          # `RobotType`'s own SCREAMING names, because that is what the
          # converter writes into the committed JSON. Lower-case keys read
          # back as zero from every schedule row, every row is then dropped as
          # empty, and the comparison reports `ours None` against a real JVM
          # row on all 110 dens -- which is what it did.
          TYPES = ["STANDARDZOMBIE", "RANGEDZOMBIE", "FASTZOMBIE",
                   "BIGZOMBIE"]
          want = {}
          for line in pathlib.Path("/tmp/oracle16/mapprobe.txt").read_text().splitlines():
              f = line.split()
              if len(f) >= 2 and f[1].startswith("symmetry="):
                  want[("sym", f[0])] = f[1].split("=", 1)[1]
              elif len(f) >= 3 and f[1] == "den":
                  x, y = f[2].split(",")
                  rows = {}
                  for cell in f[3:]:
                      rnd, counts = cell[1:].split("=")
                      rows[int(rnd)] = [int(v) for v in counts.split(":")]
                  want[("den", f[0], int(x), int(y))] = rows
          bad = []
          dens = 0
          for key, value in sorted(want.items(), key=lambda kv: str(kv[0])):
              if key[0] == "sym":
                  doc = json.loads(pathlib.Path(
                      f"data/maps/bc16/{key[1]}.json").read_text())
                  if doc["symmetry"] != value:
                      bad.append(f"{key[1]}: symmetry {doc['symmetry']!r}, "
                                 f"the JVM says {value!r}")
                  continue
              _, name, x, y = key
              dens += 1
              doc = json.loads(pathlib.Path(
                  f"data/maps/bc16/{name}.json").read_text())
              here = None
              for den in doc["dens"]:
                  if den["x"] == x and den["y"] == y:
                      here = den
              if here is None:
                  bad.append(f"{name}: no den at {x},{y}")
                  continue
              got = {}
              for rnd, counts in here["schedule"].items():
                  got[int(rnd)] = [counts.get(t, 0) for t in TYPES]
              got = {r: c for r, c in got.items() if any(c)}
              wantrows = {r: c for r, c in value.items() if any(c)}
              if got != wantrows:
                  diff = [f"r{r}: ours {got.get(r)} jvm {wantrows.get(r)}"
                          for r in sorted(set(got) | set(wantrows))
                          if got.get(r) != wantrows.get(r)]
                  bad.append(f"{name} den {x},{y}: " + "; ".join(diff[:4]))
          print(f"compared 22 symmetries and {dens} per-den schedules against "
                f"the JVM's own GameMap")
          for b in bad[:20]:
              print(f"::error::{b}")
          if bad:
              print("::error::D3/D4: the committed maps' build-time symmetry "
                    "or per-den zombie split is not what the engine computes. "
                    "This is the assertion that PROVES the java.util.HashMap "
                    "iteration-order emulation rather than trusting it.")
              raise SystemExit(1)
          PY

      - name: Build the Nim trace emitters (Tier A idle, Tier A″ greenhorn)
        run: |
          set -euo pipefail
          # `-d:bc16Idle` is the Nim twin of tools/oracle/bc16/bc16idle,
          # whose whole body is `while (true) Clock.yield();`.
          nim c --hints:off -d:release -d:bc16Idle --path:src \
            -o:/tmp/oracle16/pt_bc16idle tools/parity_trace_bc16.nim
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle16/pt_bc16greenhorn tools/parity_trace_bc16.nim

      # WHOLE GAMES on the nine parity pairs, for BOTH bots. The round cap is
      # 3000, but neither oracle bot survives to it: an idle archon line is
      # eaten by the horde and `greenhorn` only slows that down, so the
      # MEASURED lengths are 298-683 rounds for `bc16idle` and 485-1424 for
      # `bc16greenhorn`. That is not a weaker window -- the trace runs from
      # round 0 to the engine's own `GameWorld.isRunning() == false`, so the
      # end round, the winner and the end condition are themselves compared,
      # and a port that ended one round early would diverge here. Every
      # `java` invocation is wrapped in `timeout 900`, because the sandboxed
      # player threads are NON-DAEMON and a driver that throws without
      # System.exit() hangs for ever (measured).
      - name: Run both engines on eighteen pairs (whole games, round 0 to the end)
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle16/traces
          for BOT in bc16idle bc16greenhorn; do
            case "$BOT" in
              bc16idle) NIMBIN=/tmp/oracle16/pt_bc16idle; NIMBOT=idle ;;
              *) NIMBIN=/tmp/oracle16/pt_bc16greenhorn; NIMBOT=greenhorn ;;
            esac
            for MAP in checkers zigzag swamp river prisons frogger turtle \
                       desert space; do
              timeout 900 java -Xmx2g -XX:+UseSerialGC \
                -cp "/tmp/oracle16/battlecode2016.jar:/tmp/oracle16/build/classes" \
                battlecode.world.Bc16Trace "$MAP" 3000 "$BOT" \
                /tmp/oracle16/build/classes \
                > "/tmp/oracle16/traces/${BOT}.${MAP}.java" \
                2> "/tmp/oracle16/traces/${BOT}.${MAP}.java.log"
              tail -1 "/tmp/oracle16/traces/${BOT}.${MAP}.java.log"
              "$NIMBIN" "$MAP" 3000 "$NIMBOT" \
                > "/tmp/oracle16/traces/${BOT}.${MAP}.nim"
              echo "${BOT}/${MAP}: java $(wc -l < "/tmp/oracle16/traces/${BOT}.${MAP}.java") lines," \
                   "nim $(wc -l < "/tmp/oracle16/traces/${BOT}.${MAP}.nim") lines"
            done
          done

      # EVERY GAME REALLY RAN, AND THE ENGINE'S OWN HALF REALLY HAPPENED.
      # This is the step that catches the modern-JDK ASM trap from the other
      # side, and it is also what stops a bit-exact tier from being vacuous.
      # The floors are MEASURED over the eighteen pairs.
      - name: Every game really ran (the ASM trap, and the anti-vacuity check)
        run: |
          set -euo pipefail
          for BOT in bc16idle bc16greenhorn; do
          for MAP in checkers zigzag swamp river prisons frogger turtle \
                     desert space; do
            log="/tmp/oracle16/traces/${BOT}.${MAP}.java.log"
            rounds="$(sed -n 's/.* rounds=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            zombies="$(sed -n 's/.* zombies_peak=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            robots="$(sed -n 's/.* peak_robots=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            pct="$(sed -n 's/.* peak_pct=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            turn="$(sed -n 's/.* saw_zombie_turn=\([a-z]*\) .*/\1/p' "$log" | tail -1)"
            inf="$(sed -n 's/.* saw_infection=\([a-z]*\)$/\1/p' "$log" | tail -1)"
            echo "${BOT}/${MAP}: rounds=${rounds} zombies_peak=${zombies}" \
                 "peak_robots=${robots} peak_bytecode=${pct}%" \
                 "zombie_turn=${turn} infection=${inf}"
            test "${rounds:-0}" -ge 250 || {
              echo "::error::${BOT}/${MAP} only reached round ${rounds}."
              echo "::error::Under a JDK newer than 8 the instrumenter kills"
              echo "::error::every player robot as it spawns and the game is"
              echo "::error::over in a handful of rounds. The floor is 250"
              echo "::error::against a measured minimum of 298"
              echo "::error::(bc16idle/swamp) and a measured maximum of 1424"
              echo "::error::(bc16greenhorn/prisons) -- neither bot survives"
              echo "::error::the 3000-round cap, which is the point."
              exit 1; }
            test "${robots:-0}" -ge 10 || {
              echo "::error::${BOT}/${MAP} peaked at ${robots} robots."
              exit 1; }
            test "${pct:-100}" -le 20 || {
              echo "::error::${BOT}/${MAP} peaked at ${pct}% of a bytecode"
              echo "::error::limit, above the 20% headroom bound -- which is"
              echo "::error::exactly \`limit - 8000\`, the knee of the"
              echo "::error::engine's own decrementDelays. Past that point"
              echo "::error::the comparison is no longer defined (V1)."
              exit 1; }
            test "${turn}" = "true" || {
              echo "::error::${BOT}/${MAP}: NOT ONE ZOMBIE ever took a turn."
              echo "::error::A tier that agrees bit for bit while nothing"
              echo "::error::happens proves nothing."
              exit 1; }
          done
          done
          # AND THE HORDE REALLY ESCALATED. Across the eighteen pairs at least
          # 150 zombies must have been on the board at once somewhere, and
          # infection must have fired on at least one pair -- the two things
          # that make this year itself.
          total=0
          infected=0
          for BOT in bc16idle bc16greenhorn; do
          for MAP in checkers zigzag swamp river prisons frogger turtle \
                     desert space; do
            log="/tmp/oracle16/traces/${BOT}.${MAP}.java.log"
            z="$(sed -n 's/.* zombies_peak=\([0-9]*\) .*/\1/p' "$log" | tail -1)"
            total=$(( total + ${z:-0} ))
            if [ "$(sed -n 's/.* saw_infection=\([a-z]*\)$/\1/p' "$log" | tail -1)" = "true" ]; then
              infected=$(( infected + 1 ))
            fi
          done
          done
          echo "peak zombies summed over the eighteen pairs: ${total};" \
               "pairs that saw an infection: ${infected}/18"
          test "${total}" -ge 150 || {
            echo "::error::only ${total} zombies were ever on the board across"
            echo "::error::the eighteen whole games (measured: 735). The dens"
            echo "::error::did not spawn, so this oracle proved nothing."
            exit 1; }
          test "${infected}" -ge 9 || {
            echo "::error::infection fired on only ${infected} of the"
            echo "::error::eighteen pairs. A zombie bite infects for 10 turns"
            echo "::error::and it is THE mechanic of this year."
            exit 1; }

      - name: Tiers A, A″ and C (all BLOCKING)
        run: |
          set -euo pipefail
          # The comparator's own negative control first, covering all FOUR
          # known comparator bugs -- a `bc=` column on one side only, a trace
          # pair that differs only in LENGTH (in both directions), a
          # zero-padded hex fold that is the same fold, and a HALF-UP versus
          # HALF-TO-EVEN float tie -- plus the origin tripwire.
          python3 tools/ci/parity_tiers_bc16.py --selftest
          python3 tools/ci/parity_tiers_bc16.py \
            --dir /tmp/oracle16/traces \
            --maps checkers zigzag swamp river prisons frogger turtle \
                   desert space \
            --bots bc16idle bc16greenhorn \
            --ledger tools/ci/parity_ledger_bc16.json \
            --summary "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload the traces (first 200 divergent lines and a digest)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle16/upload
          # `if: always()` means this runs after an EARLIER step failed too,
          # in which case the traces were never produced. Reporting nothing is
          # correct there; failing the job a second time for a missing
          # directory only hides the real error.
          if [ ! -d /tmp/oracle16/traces ]; then
            echo "no traces were produced; an earlier step failed"
            exit 0
          fi
          cd /tmp/oracle16/traces
          for BOT in bc16idle bc16greenhorn; do
          for MAP in checkers zigzag swamp river prisons frogger turtle \
                     desert space; do
            j="${BOT}.${MAP}.java"
            n="${BOT}.${MAP}.nim"
            [ -f "$j" ] && [ -f "$n" ] || continue
            # A bc16 trace runs 0.9-16 MB a side; only the first 200
            # divergent lines and a gzipped digest are uploaded.
            sed -E 's/ bc=[0-9]+//' "$j" > "/tmp/j.$$"
            diff "/tmp/j.$$" "$n" | head -200 \
              > "/tmp/oracle16/upload/${BOT}.${MAP}.diff.txt" || true
            head -400 "$j" | gzip -9 \
              > "/tmp/oracle16/upload/${BOT}.${MAP}.java.head.gz"
            head -400 "$n" | gzip -9 \
              > "/tmp/oracle16/upload/${BOT}.${MAP}.nim.head.gz"
            cp "${BOT}.${MAP}.java.log" "/tmp/oracle16/upload/" || true
            rm -f "/tmp/j.$$"
          done
          done
          ls -la /tmp/oracle16/upload

      - name: Upload the parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-bc16
          path: /tmp/oracle16/upload
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # parity-oracle-bc17: the 2017 Java engine as a CI-only oracle.
  #
  # THE TENTH YEAR AND THE ONLY CONTINUOUS-SPACE ONE. Coordinates, radii,
  # strides, bullet speeds, attack powers, health and the whole tree economy
  # are Java `float`, every gameplay class is `strictfp`, and the
  # transcendental surface is exactly {sin, cos, atan2}.
  #
  # **EVERY FLOAT IN THIS TRACE IS PRINTED AS ITS RAW IEEE-754 BITS IN HEX
  # ON BOTH SIDES**, which is bc17's one deliberate departure from every
  # sibling year: a float32 needs nine significant decimal digits to
  # round-trip and a formatter mismatch between Java's `%.9g` and Nim's
  # `formatFloat` would masquerade as a divergence for a week. bc16 manages
  # that with a `%.6f` convention plus a per-field float allowlist in the
  # comparator; bc17 removes the problem instead, so
  # `tools/ci/parity_tiers_bc17.py` needs NO float allowlist at all.
  #
  # THE ORACLE RUNS ON TEMURIN 8 AND THAT IS NOT NEGOTIABLE: the jar bundles
  # a 2017-era ASM 5.0.4 and the whole instrumenter is built for Java 8 class
  # files, so under a modern JDK it throws IllegalArgumentException inside
  # ClassReader.<init> on EVERY player class load, no robot is ever built,
  # the game ends in one round and THE JOB WOULD EXIT 0 WHILE PROVING
  # NOTHING. The first step asserts `java -version` really is 1.8 AND that
  # `javac --release 8` FAILS (the bc21 lesson: `--release` arrived in JDK 9
  # and dies with "invalid flag" on a JDK-8 javac); `Bc17Trace.java` asserts
  # it again from the other side by exiting 3 when nothing ever happened;
  # and `tools/ci/bc17_assert_trace.py` asserts it a third time by requiring
  # every game to have reached round 2 900 or ended DECIDED.
  #
  # THE JAR IS A FAT JAR and nothing else is downloaded to run it: 10 210
  # entries, every battlecode class, `org/objectweb/asm`, `gnu/trove`,
  # `net/sf/jsi`, `com/google/flatbuffers` and all 70
  # `battlecode/world/resources/*.map17` resources -- so there is no Gradle,
  # no Maven resolution, no deps.lock, no jsi shim and no `--map-dir`. The
  # PINNED ENGINE SOURCES are fetched only because the two engine patches
  # need four files of them; everything else is loaded out of the jar.
  #
  # 90 minutes: bc17's games run to 2 999 rounds with real ballistics and
  # there are 54 compared pairs plus one uncompared metering run. MEASURED
  # in the phase-20 sandbox: 168 seconds of JVM for all 54 games, 26 seconds
  # for the comparator and 106 seconds for the trace assertions, so the
  # budget is roughly twenty times the measurement (docs/PARITY.md section
  # bc17). Tier A" is NINE pairs and was NOT reduced.
  #
  # There is no JDK, no JRE and no Java in ANY runtime image stage.
  # ---------------------------------------------------------------------
  parity-oracle-bc17:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      # TEMURIN 8. NOT NEGOTIABLE. See the job comment.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: The JDK really is 8
        run: |
          set -euo pipefail
          java -version 2>&1 | tee /tmp/javaver17
          javac -version 2>&1 | tee -a /tmp/javaver17
          grep -q '1\.8\.' /tmp/javaver17 || {
            echo "::error::this oracle MUST run on Temurin 8: the jar bundles"
            echo "::error::a 2017-era ASM 5.0.4 and under a newer JDK the"
            echo "::error::instrumenter throws inside ClassReader.<init> on"
            echo "::error::every player class load, nothing is ever built,"
            echo "::error::the game ends in one round and this job would be"
            echo "::error::green while proving nothing"
            echo "::error::(docs/PARITY.md section bc17)."
            exit 1; }
          # And `--release` must NOT be used: it arrived in JDK 9 and dies
          # with "invalid flag" here in seconds (the bc21 lesson). This
          # asserts the trap rather than trusting a comment.
          if javac --release 8 -version >/dev/null 2>&1; then
            echo "::error::this javac accepts --release, so it is not 8"
            exit 1
          fi
          echo "javac rejects --release, as a JDK-8 javac must"

      - name: Fetch the published 2017 jar and the pinned engine sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle17 /tmp/engine17
          curl -fsSL -o /tmp/oracle17/battlecode2017.jar "${BC17_JAR_URL}"
          # The two ENGINE patches need four source files; everything else --
          # every class and all 70 map resources -- is loaded out of the jar.
          curl -fsSL \
            "https://github.com/battlecode/battlecode-server-2017/archive/${BC17_COMMIT}.tar.gz" \
            | tar xz -C /tmp/engine17
          echo "BC17_DIR=/tmp/engine17/battlecode-server-2017-${BC17_COMMIT}" \
            >> "$GITHUB_ENV"

      # THE COMMITTED WEAK FLOOR IS UPSTREAM'S FILE, BYTE FOR BYTE. The
      # `determinism.patch` hunks are the ONLY difference between what the
      # 2017 scaffold shipped and what this job compiles, and this step
      # proves it rather than trusting the patch header.
      - name: The committed examplefuncsplayer17 is the scaffold's own file
        run: |
          set -euo pipefail
          mkdir -p /tmp/scaffold17
          curl -fsSL \
            "https://github.com/battlecode/battlecode-scaffold-2017/archive/${BC17_SCAFFOLD_COMMIT}.tar.gz" \
            | tar xz -C /tmp/scaffold17
          up="/tmp/scaffold17/battlecode-scaffold-2017-${BC17_SCAFFOLD_COMMIT}/src/examplefuncsplayer/RobotPlayer.java"
          diff -u "$up" tools/oracle/bc17/examplefuncsplayer17/RobotPlayer.java
          python3 - <<'PY'
          import json, os
          lock = json.load(open("tools/oracle/bc17/jar.lock"))
          assert lock["scaffold_commit"] == os.environ["BC17_SCAFFOLD_COMMIT"], \
              lock["scaffold_commit"]
          print("tools/oracle/bc17/jar.lock agrees with ci.yml's scaffold pin")
          PY
          echo "the committed bot is battlecode-scaffold-2017@${BC17_SCAFFOLD_COMMIT} verbatim (AGPL-3.0, see NOTICE)"

      - name: Build the oracle (jar sha256, size AND SPEC_VERSION verified, three patches, JDK 8)
        run: |
          set -euo pipefail
          ./tools/oracle/bc17/build_oracle.sh \
            /tmp/oracle17/battlecode2017.jar "$BC17_DIR" /tmp/oracle17/build

      # Tier B, part 1 (BLOCKING): EVERY `GameConstants` FIELD AND THE WHOLE
      # SIX-ROW `RobotType` TABLE, printed from the jar's own classes by
      # REFLECTION -- 2017's `GameConstants` is an INTERFACE, so its fields
      # are implicitly `public static final` and reflection sees all of them
      # -- and the generated `constants.nim` regenerated from that dump and
      # BYTE-DIFFED. A hand-edited constant fails here.
      - name: Tier B (BLOCKING) — the jar's own constants and RobotType table
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle17/tables
          javac -nowarn -encoding UTF-8 \
            -cp /tmp/oracle17/battlecode2017.jar \
            -d /tmp/oracle17/tables tools/JavaBc17Tables.java
          timeout 600 java -cp \
            "/tmp/oracle17/battlecode2017.jar:/tmp/oracle17/tables" \
            JavaBc17Tables constants > /tmp/oracle17/constants.json
          head -3 /tmp/oracle17/constants.json
          python3 tools/gen_year_constants.py --year bc17 \
            --tables /tmp/oracle17/constants.json --check

      # Tier B, part 2 (BLOCKING): THE fdlibm PIN. Every boundary vector
      # value-for-value and eleven expression-shape digests over a
      # 2 000 000-point sample of the engine's own argument domains, drawn by
      # a recipe BOTH SIDES RUN (`java.util.Random(20170101)`), regenerated
      # here under the pinned JDK 8 and byte-diffed against the committed
      # file. The `"jdk"` line is PROVENANCE, not a vector: it records which
      # Temurin 8 build wrote the file, and `actions/setup-java` moves that
      # string every few months while `StrictMath` is required to reproduce
      # fdlibm bit for bit on every conforming JVM. Everything else is an
      # absolute byte-diff.
      - name: Tier B (BLOCKING) — the fdlibm vectors, regenerated and byte-diffed
        run: |
          set -euo pipefail
          start=$(date +%s)
          timeout 900 java -cp \
            "/tmp/oracle17/battlecode2017.jar:/tmp/oracle17/tables" \
            JavaBc17Tables fdlibm > /tmp/oracle17/fdlibm.json
          echo "JavaBc17Tables fdlibm took $(( $(date +%s) - start ))s"
          echo "committed: $(grep '\"jdk\"' data/bc17/fdlibm_vectors.json)"
          echo "this run : $(grep '\"jdk\"' /tmp/oracle17/fdlibm.json)"
          grep -v '"jdk"' data/bc17/fdlibm_vectors.json > /tmp/oracle17/fd.want
          grep -v '"jdk"' /tmp/oracle17/fdlibm.json > /tmp/oracle17/fd.got
          if ! diff -u /tmp/oracle17/fd.want /tmp/oracle17/fd.got | head -40; then
            echo "::error::data/bc17/fdlibm_vectors.json is not what the"
            echo "::error::jar's own StrictMath emits under JDK 8."
            exit 1
          fi
          diff -q /tmp/oracle17/fd.want /tmp/oracle17/fd.got
          rows="$(grep -c '"bits"' data/bc17/fdlibm_vectors.json || true)"
          echo "Tier B: the committed fdlibm table IS the JVM's own output"

      # Tier B, part 3 (BLOCKING): ALL 22 COMMITTED MAPS' `LiveMap` FIELDS --
      # width, height, origin, seed, rounds and every initial body's id,
      # team, type, float coordinates, radius, health, contained bullets and
      # contained robot IN `getInitialBodies()` ORDER -- from the JVM's own
      # loader, byte-diffed against the same dump taken from the committed
      # JSON. This is what PROVES `tools/convert_maps_bc17.py`'s pure-Python
      # flatbuffer walk rather than trusting it.
      - name: Tier B (BLOCKING) — the 22 maps' LiveMap fields, from the JVM
        run: |
          set -euo pipefail
          MAPS="Aligned Alone Barrier Blitzkrieg Chess Cramped CropCircles
                DenseForest GiantForest GreenHouse HiddenTunnel HouseDivided
                Hurdle Interference LineOfFire Maniple OMGTree Snowflake
                TreeFarm Waves Whirligig shrine"
          timeout 600 java -cp \
            "/tmp/oracle17/battlecode2017.jar:/tmp/oracle17/tables" \
            JavaBc17Tables maps ${MAPS} > /tmp/oracle17/maps.jvm
          python3 tools/convert_maps_bc17.py \
            --jar /tmp/oracle17/battlecode2017.jar --dump-bits \
            --only ${MAPS} > /tmp/oracle17/maps.ours
          wc -l /tmp/oracle17/maps.jvm /tmp/oracle17/maps.ours
          if ! diff -u /tmp/oracle17/maps.jvm /tmp/oracle17/maps.ours \
               | head -40; then
            echo "::error::the committed data/maps/bc17/*.json are not what"
            echo "::error::the JVM's own LiveMap loader reads out of the jar."
            exit 1
          fi
          diff -q /tmp/oracle17/maps.jvm /tmp/oracle17/maps.ours
          echo "Tier B: 22 maps, byte-identical to the JVM's own LiveMap"

      - name: Build the six Nim trace emitters (Tiers A, A′ and A″)
        run: |
          set -euo pipefail
          # One binary per bot, exactly as bc16's and bc19's are: the bot is
          # a COMPILE-TIME define in `rules.runControllerFor`, so a bot
          # cannot leak into another tier's build.
          nim c --hints:off -d:release -d:bc17Idle --path:src \
            -o:/tmp/oracle17/pt_bc17idle tools/parity_trace_bc17.nim
          nim c --hints:off -d:release --path:src \
            -o:/tmp/oracle17/pt_examplefuncsplayer17 tools/parity_trace_bc17.nim
          nim c --hints:off -d:release -d:bc17Scenario --path:src \
            -o:/tmp/oracle17/pt_bc17scenario tools/parity_trace_bc17.nim
          nim c --hints:off -d:release -d:bc17Scenario -d:bc17ScenarioTree \
            --path:src -o:/tmp/oracle17/pt_bc17scenariotree \
            tools/parity_trace_bc17.nim
          nim c --hints:off -d:release -d:bc17Scenario -d:bc17ScenarioKill \
            --path:src -o:/tmp/oracle17/pt_bc17scenariokill \
            tools/parity_trace_bc17.nim
          nim c --hints:off -d:release -d:bc17Scenario -d:bc17ScenarioTie \
            --path:src -o:/tmp/oracle17/pt_bc17scenariotie \
            tools/parity_trace_bc17.nim

      # WHOLE GAMES, round 1 to the engine's own `isRunning() == false`, on
      # the NINE parity pairs, for all SIX compared bots -- 54 pairs. Every
      # `java` invocation is wrapped in `timeout 900`, because the sandboxed
      # player threads are NON-DAEMON and a driver that throws without
      # `System.exit()` hangs for ever (measured on four sibling years).
      - name: Run both engines on fifty-four pairs (whole games)
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle17/traces
          total=0
          for BOT in bc17idle examplefuncsplayer17 bc17scenario \
                     bc17scenariotree bc17scenariokill bc17scenariotie; do
            for MAP in CropCircles GreenHouse HiddenTunnel HouseDivided \
                       OMGTree shrine Chess Cramped Alone; do
              start=$(date +%s)
              timeout 900 java -Xmx2g -XX:+UseSerialGC \
                -cp "/tmp/oracle17/build/classes:/tmp/oracle17/battlecode2017.jar" \
                battlecode.world.Bc17Trace "$MAP" 3000 "$BOT" \
                /tmp/oracle17/build/bots \
                > "/tmp/oracle17/traces/${BOT}.${MAP}.java" \
                2> "/tmp/oracle17/traces/${BOT}.${MAP}.java.log"
              jvm=$(( $(date +%s) - start ))
              total=$(( total + jvm ))
              tail -1 "/tmp/oracle17/traces/${BOT}.${MAP}.java.log"
              "/tmp/oracle17/pt_${BOT}" "$MAP" 3000 \
                > "/tmp/oracle17/traces/${BOT}.${MAP}.nim" \
                2> "/tmp/oracle17/traces/${BOT}.${MAP}.nim.log"
              tail -1 "/tmp/oracle17/traces/${BOT}.${MAP}.nim.log"
              echo "${BOT}/${MAP}: ${jvm}s JVM," \
                   "java $(wc -l < "/tmp/oracle17/traces/${BOT}.${MAP}.java") lines," \
                   "nim $(wc -l < "/tmp/oracle17/traces/${BOT}.${MAP}.nim") lines"
            done
          done
          echo "TOTAL JVM WALL CLOCK OVER THE 54 PAIRS: ${total}s"
          echo "bc17 parity: ${total}s of JVM over 54 whole games" \
            >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # THE Tier A" FALLBACK, DECIDED IN PHASE 10 AND BOUNDED: if this
          # ever exceeds 80 minutes the tier is cut to the six `small` pairs
          # and the cut is recorded in docs/PARITY.md with the measurement.
          # It has not fired: the phase-20 measurement was 168 seconds.
          test "${total}" -le 4800 || {
            echo "::error::the 54 pairs took ${total}s of JVM, past the"
            echo "::error::80-minute bound. docs/PARITY.md section bc17"
            echo "::error::records the decided fallback: cut Tier A\" to the"
            echo "::error::six \`small\` pairs and RECORD THE CUT."
            exit 1; }

      # TIER B' (b) (BLOCKING, AND NOT COMPARED AGAINST THE PORT): the bot
      # that is MEANT to be paused. `bc17slowbot` burns ~20 000 instrumented
      # bytecodes a turn and the engine must pause it; the port has no
      # bytecode counter at all and meters a fixed DecisionOps budget
      # instead (V1), so nothing here is compared -- this run exists so the
      # port's READING of the metering rule is proved rather than asserted.
      - name: Tier B′ (BLOCKING) — the engine really does pause a slow bot
        run: |
          set -euo pipefail
          timeout 900 java -Xmx2g -XX:+UseSerialGC \
            -cp "/tmp/oracle17/build/classes:/tmp/oracle17/battlecode2017.jar" \
            battlecode.world.Bc17Trace shrine 60 bc17slowbot \
            /tmp/oracle17/build/bots \
            > /tmp/oracle17/traces/bc17slowbot.shrine.java \
            2> /tmp/oracle17/traces/bc17slowbot.shrine.java.log
          tail -1 /tmp/oracle17/traces/bc17slowbot.shrine.java.log

      # EVERY GAME REALLY RAN, AND EVERY PATH THE TIER CLAIMS REALLY FIRED.
      # This is the step that stops a bit-exact tier from being vacuous, and
      # it reads the ENGINE'S OWN trace, never the port's.
      - name: Every game really ran (the ASM trap and the anti-vacuity gate)
        run: |
          set -euo pipefail
          python3 tools/ci/bc17_assert_trace.py \
            --dir /tmp/oracle17/traces \
            --maps CropCircles GreenHouse HiddenTunnel HouseDivided OMGTree \
                   shrine Chess Cramped Alone \
            --scenario-bots bc17scenario bc17scenariotree bc17scenariokill \
                            bc17scenariotie \
            --slowbot-trace /tmp/oracle17/traces/bc17slowbot.shrine.java

      - name: Tiers A, A′, A″ and C (all BLOCKING)
        run: |
          set -euo pipefail
          # The comparator's own negative control first: a `bc=` column on
          # one side only, a trace pair that differs only in LENGTH (in both
          # directions), a zero-padded fold that is the same fold, a
          # zero-padded RAW-BIT float that is the same float, ONE ULP that is
          # not, and a ledger entry whose cause is "unknown".
          python3 tools/ci/parity_tiers_bc17.py --selftest
          python3 tools/ci/parity_tiers_bc17.py \
            --dir /tmp/oracle17/traces \
            --maps CropCircles GreenHouse HiddenTunnel HouseDivided OMGTree \
                   shrine Chess Cramped Alone \
            --bots bc17idle examplefuncsplayer17 bc17scenario \
                   bc17scenariotree bc17scenariokill bc17scenariotie \
            --ledger tools/ci/parity_ledger_bc17.json \
            --summary "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload the traces (first 200 divergent lines and a digest)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle17/upload
          # `if: always()` means this runs after an EARLIER step failed too,
          # in which case the traces were never produced. Reporting nothing
          # is correct there; failing the job a second time for a missing
          # directory only hides the real error.
          if [ ! -d /tmp/oracle17/traces ]; then
            echo "no traces were produced; an earlier step failed"
            exit 0
          fi
          cd /tmp/oracle17/traces
          for BOT in bc17idle examplefuncsplayer17 bc17scenario \
                     bc17scenariotree bc17scenariokill bc17scenariotie; do
            for MAP in CropCircles GreenHouse HiddenTunnel HouseDivided \
                       OMGTree shrine Chess Cramped Alone; do
              j="${BOT}.${MAP}.java"
              n="${BOT}.${MAP}.nim"
              [ -f "$j" ] && [ -f "$n" ] || continue
              # A bc17 trace runs 1-300 MB a side (`Chess` is 2 804 066
              # lines); only the first 200 divergent lines and a gzipped
              # digest are uploaded.
              # `bc=` comes off BOTH sides, exactly as the comparator's
              # own `normalize()` takes it off both: stripping it from the
              # Java side only leaves a 13 KB "diff" for a pair that is
              # bit-exact, which is a diagnostic that lies.
              sed -E 's/ bc=[0-9]+//' "$j" > "/tmp/j.$$"
              sed -E 's/ bc=[0-9]+//' "$n" > "/tmp/n.$$"
              diff "/tmp/j.$$" "/tmp/n.$$" | head -200 \
                > "/tmp/oracle17/upload/${BOT}.${MAP}.diff.txt" || true
              head -400 "$j" | gzip -9 \
                > "/tmp/oracle17/upload/${BOT}.${MAP}.java.head.gz"
              head -400 "$n" | gzip -9 \
                > "/tmp/oracle17/upload/${BOT}.${MAP}.nim.head.gz"
              cp "${BOT}.${MAP}.java.log" "/tmp/oracle17/upload/" || true
              rm -f "/tmp/j.$$" "/tmp/n.$$"
            done
          done
          cp bc17slowbot.shrine.java.log /tmp/oracle17/upload/ || true
          # NOT `ls | head`: under `set -o pipefail` the SIGPIPE `head` sends
          # `ls` fails the whole step after every tier has already passed.
          echo "$(find /tmp/oracle17/upload -type f | wc -l) files," \
               "$(du -sh /tmp/oracle17/upload | cut -f1) of evidence"

      - name: Upload the parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-bc17
          path: /tmp/oracle17/upload
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # parity-oracle-bc19: the 2019 JAVASCRIPT engine as a CI-only oracle.
  #
  # THE FIRST YEAR IN THIS REPOSITORY WHOSE ENGINE IS NOT JAVA. There is no
  # jar, no JVM and no JDK anywhere in this job: `coldbrew/` is a handful of
  # CommonJS files and the driver `require`s `Game` and `ActionRecord`
  # directly.
  #
  # THE NODE VERSION IS A RULES PIN, NOT A PREFERENCE. `coldbrew/game.js:153`
  # passes `regions.sort` a ONE-ARGUMENT, SIGN-CONSTANT COMPARATOR, so the
  # map generator's output is V8-IMPLEMENTATION-DEFINED; the 22 committed
  # boards were generated under exactly this version and this job byte-diffs
  # them. IF A FUTURE NODE BUMP MAKES THAT DIFF FAIL, THE COMMITTED MAPS ARE
  # THE RULES AND THE OLD NODE IS THE PIN -- regenerating instead is a rules
  # change and bumps GameVersion (docs/PARITY.md section bc19).
  #
  # EXACTLY ONE npm PACKAGE IS INSTALLED. The engine's own package.json pulls
  # 404, including `vm2` (deprecated, known sandbox-escape CVEs), `rollup`,
  # `esm` and `update-notifier` -- which makes a NETWORK CALL on every
  # `cli/run.js` invocation. The driver needs `game.js`, `action_record.js`,
  # `specs.json` and `mersenne-twister` and nothing else, proved by running
  # whole 1000-round games on exactly that set.
  #
  # 45 minutes, not 75: bc19's games are a third of bc16's length and the
  # engine measured well under a second per 1000-round game here, so
  # fifty-four pairs is minutes rather than an hour.
  # ---------------------------------------------------------------------
  parity-oracle-bc19:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-Linux-X64"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: nimby --global sync nimby.lock

      - name: Regenerate nim.cfg from the synced package tree
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BC19_NODE_VERSION }}

      - name: The Node really is the pinned one, and the lock says so
        run: |
          set -euo pipefail
          want="v${BC19_NODE_VERSION}"
          got="$(node --version)"
          echo "node ${got}, lock wants ${want}"
          test "${got}" = "${want}" || {
            echo "::error::this oracle MUST run on ${want}."
            echo "::error::coldbrew/game.js:153 passes regions.sort a"
            echo "::error::ONE-ARGUMENT, SIGN-CONSTANT comparator, so the map"
            echo "::error::generator's output is V8-IMPLEMENTATION-DEFINED:"
            echo "::error::a different V8 generates DIFFERENT BOARDS FROM THE"
            echo "::error::SAME SEEDS and this job would compare two"
            echo "::error::different games (docs/PARITY.md section bc19)."
            exit 1; }
          # And the lock file is the source of that number, not this yaml.
          grep -qx "node_version=${BC19_NODE_VERSION}" \
            tools/oracle/bc19/engine.lock || {
            echo "::error::tools/oracle/bc19/engine.lock does not pin"
            echo "::error::node_version=${BC19_NODE_VERSION}. The lock is the"
            echo "::error::pin; ci.yml only reads it."
            exit 1; }
          grep -qx "engine_commit=${BC19_COMMIT}" \
            tools/oracle/bc19/engine.lock || {
            echo "::error::engine.lock does not pin engine_commit=${BC19_COMMIT}"
            exit 1; }

      - name: Clone the pinned engine and install EXACTLY ONE npm package
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/battlecode/battlecode19 \
            /tmp/bc19engine
          git -C /tmp/bc19engine checkout --quiet "${BC19_COMMIT}"
          echo "BC19_ENGINE=/tmp/bc19engine" >> "$GITHUB_ENV"
          # THE LICENCE, VERIFIED IN CI AND NOT ONLY IN NOTICE: the root
          # LICENSE is GPL-3.0 and it is the ONLY licence file anywhere in
          # the tree, which is what makes app/public/assets/img/** covered.
          licences="$(find /tmp/bc19engine -iname 'licen*' -o -iname 'copying*' \
            | grep -v '/node_modules/' | wc -l)"
          test "${licences}" -eq 1 || {
            echo "::error::expected exactly ONE licence file in the pinned"
            echo "::error::battlecode19 tree, found ${licences}. NOTICE's"
            echo "::error::reasoning depends on that being true."
            exit 1; }
          grep -q 'GNU GENERAL PUBLIC LICENSE' /tmp/bc19engine/LICENSE || {
            echo "::error::the pinned battlecode19 LICENSE is not the GPL"
            exit 1; }
          # NO `npm install` OF coldbrew/package.json. One package, pinned by
          # version AND by the integrity hash the engine's own
          # package-lock.json records.
          mkdir -p /tmp/bc19engine/coldbrew/node_modules /tmp/mt
          cd /tmp/mt
          npm pack "mersenne-twister@${BC19_MT_VERSION}" > /dev/null
          grep -qx "npm_integrity=${BC19_MT_INTEGRITY}" \
            "${GITHUB_WORKSPACE}/tools/oracle/bc19/engine.lock" || {
            echo "::error::engine.lock does not pin the mersenne-twister"
            echo "::error::integrity hash ${BC19_MT_INTEGRITY}"
            exit 1; }
          grep -q "\"integrity\": \"${BC19_MT_INTEGRITY}\"" \
            /tmp/bc19engine/coldbrew/package-lock.json || {
            echo "::error::the ENGINE'S OWN package-lock.json does not carry"
            echo "::error::${BC19_MT_INTEGRITY} for mersenne-twister. The"
            echo "::error::pin has to be the engine's own, not ours."
            exit 1; }
          tar xzf "mersenne-twister-${BC19_MT_VERSION}.tgz"
          mv package /tmp/bc19engine/coldbrew/node_modules/mersenne-twister
          test -z "$(ls /tmp/bc19engine/coldbrew/node_modules | \
            grep -v '^mersenne-twister$')" || {
            echo "::error::something other than mersenne-twister was installed"
            ls /tmp/bc19engine/coldbrew/node_modules
            exit 1; }
          echo "node_modules holds exactly: $(ls /tmp/bc19engine/coldbrew/node_modules)"

      - name: Apply the two committed engine patches and assert they applied
        run: |
          set -euo pipefail
          cd /tmp/bc19engine
          # THESE ARE THE ONLY TWO PLACES THE ORACLE IS NOT THE PUBLISHED
          # ENGINE, and docs/PARITY.md section bc19 names both with their
          # reasons.
          for patch in \
            "${GITHUB_WORKSPACE}/tools/oracle/bc19/visible_order.patch" \
            "${GITHUB_WORKSPACE}/tools/oracle/bc19/examplefuncsplayer19/determinism.patch"; do
            hunks="$(grep -c '^@@' "${patch}")"
            echo "applying $(basename "${patch}") (${hunks} hunk(s))"
            git apply --check "${patch}" || {
              echo "::error::$(basename "${patch}") no longer applies to"
              echo "::error::${BC19_COMMIT}. A patch that has drifted off the"
              echo "::error::pinned commit is a patch nobody has read."
              exit 1; }
            git apply "${patch}"
          done
          # V2: the unseeded shuffle is GONE and the ascending-id sort is in.
          grep -q 'visible_robots.sort' coldbrew/game.js || {
            echo "::error::visible_order.patch applied but the ascending-id"
            echo "::error::sort is not in game.js"; exit 1; }
          grep -q 'Math.floor(Math.random() \* (i + 1))' coldbrew/game.js && {
            echo "::error::the unseeded Fisher-Yates shuffle is STILL in"
            echo "::error::getGameStateDump. V2's whole point is that it"
            echo "::error::draws from the GLOBAL, UNSEEDED Math.random()."
            exit 1; } || true
          # Hunk 1: the deterministic per-robot RNG. Hunk 2: no team guard.
          grep -q 'rngFor(this.me.id).nextDouble()' \
            coldbrew/bots/example_js/robot.js || {
            echo "::error::determinism.patch hunk 1 did not land"; exit 1; }
          grep -q 'this.me.team == 1' coldbrew/bots/example_js/robot.js && {
            echo "::error::determinism.patch hunk 2 did not land: the stock"
            echo "::error::team==1 guard makes RED build NOTHING AT ALL, and"
            echo "::error::a baseline inert on one side cannot be scored."
            exit 1; } || true
          echo "both patches applied and verified"

      - name: The comparator's own self-test
        run: |
          set -euo pipefail
          # A comparator with the `zip` bug reads a one-line-longer oracle
          # trace as bit-exact. This constructs exactly that pair and
          # asserts a divergence IS reported -- and that the normaliser is
          # applied to BOTH sides (the bc23 lesson).
          python3 tools/ci/parity_tiers_bc19.py --self-test

      # TIER B (BLOCKING) -- the constants, the arithmetic and the map data,
      # OVER THEIR WHOLE FINITE DOMAINS. bc19 has exactly two non-integer
      # operations and both domains are finite, so this tier is NOT A
      # SAMPLE: it is the entire domain.
      - name: "Tier B: the arithmetic tables and all 22 boards, byte-diffed"
        run: |
          set -euo pipefail
          node tools/JsBc19Tables.mjs --engine "$BC19_ENGINE" --check
          node tools/gen_maps_bc19.mjs --engine "$BC19_ENGINE" \
            --out data/maps/bc19 --check
          # AND THE THIRTEEN DEGENERATE SEEDS ARE REFUSED BY NAME, which
          # proves V3's curation rather than trusting it.
          #
          # THE `::error::` PREFIX IS STRIPPED HERE ON PURPOSE. This run is a
          # DELIBERATE NEGATIVE TEST: the generator is supposed to refuse
          # every one of these seeds and to say so on stderr, and its
          # `::error::` lines would otherwise land in the run summary as
          # ANNOTATIONS on a green job -- a reviewer reading a passing run
          # as failing. The refusals are still asserted, by name, below.
          node tools/gen_maps_bc19.mjs --engine "$BC19_ENGINE" \
            --out /tmp/bc19curate --seeds 7 --assert-degenerate \
            2>&1 | sed 's/^::error:://' \
            | tee /tmp/bc19curate.txt || true
          for seed in 7 20 24 83 108 127 175 211 232 267 283 348 365; do
            grep -q "^refused ${seed}: " /tmp/bc19curate.txt || {
              echo "::error::seed ${seed} was expected to be REFUSED as an"
              echo "::error::unplayable board (0 castles, 2-4 passable"
              echo "::error::squares) and was not. A pool that can draw such"
              echo "::error::a board is not a pool (V3)."
              exit 1; }
          done
          echo "all 13 degenerate seeds refused by name"

      - name: Build the six Nim trace binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/bc19bin
          build() {
            echo "::group::nim c $2 tools/parity_trace_bc19.nim -> $1"
            nim c -d:release $2 --hints:off --path:src \
              -o:"/tmp/bc19bin/$1" tools/parity_trace_bc19.nim
            echo "::endgroup::"
          }
          build bc19idle "-d:bc19Idle"
          build examplefuncsplayer19 ""
          build bc19scenario "-d:bc19Scenario"
          build bc19scenariotrade "-d:bc19Scenario -d:bc19ScenarioTrade"
          build bc19scenariokill "-d:bc19Scenario -d:bc19ScenarioKill"
          build bc19scenariotie "-d:bc19Scenario -d:bc19ScenarioTie"

      # TIERS A, A', A'' AND C, all BLOCKING, over the NINE PARITY PAIRS.
      #
      # TIER A is deliberately SMALL in this year, and that is the single
      # most important difference between bc19 parity and bc16 parity: in
      # bc16 the zombies are ENGINE-SIDE, so an idle player still exercises
      # half the game, while IN BC19 NOTHING AT ALL HAPPENS WITHOUT A PLAYER
      # ACTION. THE LOAD-BEARING TIERS ARE A' AND A''.
      #
      # TIER B' (a) rides along on every one of them: `--assert-clock` makes
      # the driver exit 6 if any live robot's `robot.time` ever fell below
      # CHESS_INITIAL, so the engine's own freeze branch provably never
      # fired in a game this job COMPARES.
      #
      # TIER C is the first divergent round of every whole game against
      # `tools/ci/parity_ledger_bc19.json`, WHICH SHIPS EMPTY.
      - name: "Tiers A / A' / A'' / B' (a) / C -- 54 whole-game pairs"
        run: |
          set -euo pipefail
          maps="seed-0009 seed-0021 seed-0034 seed-0043 seed-0048 seed-0107 \
                seed-0017 seed-0125 seed-0045"
          mkdir -p "$RUNNER_TEMP/bc19" "$RUNNER_TEMP/bc19digest"
          fails=0
          pairs=0
          for bot in bc19idle examplefuncsplayer19 bc19scenario \
                     bc19scenariotrade bc19scenariokill bc19scenariotie; do
            for map in $maps; do
              flags=""
              # bc19scenariotrade's WHOLE SCRIPT IS THE BARTER and it never
              # builds anything, so only the "no unit was ever built" half of
              # the guard is waived -- it still has to have acted.
              if [ "$bot" = bc19scenariotrade ]; then
                flags="--allow-no-build"
              fi
              # MEASURED, AND RECORDED IN docs/PARITY.md section bc19: on
              # seed-0017 BOTH castles' (x+1, y+1) square is IMPASSABLE, so
              # the stock example bot's only action throws inside the starter
              # library and the game is inert. The pair is still COMPARED and
              # is bit-exact; only the "something happened" guard is waived.
              if [ "$bot" = examplefuncsplayer19 ] && [ "$map" = seed-0017 ]
              then
                flags="$flags --allow-inert"
              fi
              j="$RUNNER_TEMP/bc19/${bot}.${map}.oracle.txt"
              n="$RUNNER_TEMP/bc19/${bot}.${map}.nim.txt"
              # EVERY node INVOCATION IS WRAPPED IN `timeout`.
              timeout 600 node tools/oracle/bc19/bc19_trace.js \
                --engine "$BC19_ENGINE" --bot "$bot" --map "$map" \
                --rounds 1000 --assert-clock $flags --out "$j" \
                2> "$RUNNER_TEMP/bc19/${bot}.${map}.err" || {
                  rc=$?
                  echo "::error::the oracle driver exited ${rc} on ${bot}/${map}"
                  sed -n '1,20p' "$RUNNER_TEMP/bc19/${bot}.${map}.err"
                  fails=$((fails+1)); continue; }
              cat "$RUNNER_TEMP/bc19/${bot}.${map}.err"
              timeout 600 "/tmp/bc19bin/${bot}" --bot "$bot" --map "$map" \
                --rounds 1000 --out "$n"
              pairs=$((pairs+1))
              python3 tools/ci/parity_tiers_bc19.py --oracle "$j" --nim "$n" \
                --bot "$bot" --map "$map" \
                --ledger tools/ci/parity_ledger_bc19.json \
                --digest "$RUNNER_TEMP/bc19digest/${bot}.${map}.txt.gz" \
                || fails=$((fails+1))
              # The traces themselves are NOT uploaded: only the first 200
              # divergent lines and a gzipped digest are.
              rm -f "$j" "$n"
            done
          done
          echo "compared ${pairs} whole-game pairs, ${fails} failure(s)"
          test "${fails}" -eq 0

      # THE JOB ASSERTS OFF THE **ORACLE** TRACE THAT TIER A REALLY DID WHAT
      # IT CLAIMS, because a bit-exact comparison of two traces of nothing is
      # a bit-exact comparison of nothing.
      - name: "Tier A: the oracle trace really shows the trickle, the id pool and the round-limit ladder"
        run: |
          set -euo pipefail
          j=/tmp/bc19a.txt
          timeout 600 node tools/oracle/bc19/bc19_trace.js \
            --engine "$BC19_ENGINE" --bot bc19idle --map seed-0043 \
            --rounds 1000 --assert-clock --out "$j" 2>/tmp/bc19a.err
          cat /tmp/bc19a.err
          # The FLAT trickle: +25 fuel a team a round, and NOTHING else
          # moves a store in an idle game.
          python3 tools/ci/bc19_assert_trace.py trickle "$j"
          # The id pool: `ids` equals 2 x castles-per-side and NEVER GROWS,
          # because nothing is ever built.
          ids="$(grep -o 'ids=[0-9]*' "$j" | sort -u)"
          echo "ids seen across the whole game: ${ids}"
          test "$(echo "${ids}" | wc -l)" -eq 1 || {
            echo "::error::the id pool grew in an idle game"; exit 1; }
          test "${ids}" = "ids=4" || {
            echo "::error::seed-0043 has two castles a side, so the pool"
            echo "::error::should hold exactly 4 ids; saw ${ids}"; exit 1; }
          # THE ROUND-LIMIT LADDER: both sides keep every castle and end
          # level on castles AND on health, so the coin flip fires and the
          # engine records its own `win_condition = 1` overwrite.
          tail -1 "$j" | grep -q 'wc=1' || {
            echo "::error::the round-limit ladder did not record wc=1."
            echo "::error::game.js:604 assigns win_condition = 1"
            echo "::error::UNCONDITIONALLY after the round-1000 block, so an"
            echo "::error::all-square game is RECORDED as greater health"
            echo "::error::while the winner really is a coin flip."
            sed -n '$p' "$j"; exit 1; }
          # AND ROUND 1000 HAS EXACTLY ONE `A` LINE. The game-over check runs
          # BEFORE EVERY TURN, so the counter reaches 1000 on the first turn
          # of that round and the check fires immediately after it.
          n="$(grep -c '^R 1000 A ' "$j")"
          echo "round 1000 has ${n} action line(s)"
          test "${n}" -eq 1 || {
            echo "::error::round 1000 has ${n} turns, expected exactly ONE"
            exit 1; }

      # TIER A': the job asserts OFF THE ORACLE TRACE that the scripted rare
      # paths really fired. A scenario bot that silently stopped reaching a
      # path would otherwise compare bit-exactly against a Nim twin that
      # also stopped reaching it -- a bit-exact comparison of two traces of
      # nothing.
      #
      # THE ASSERTION IS OVER THE UNION OF THE NINE COMPARED GAMES, not over
      # one of them, and that is measured rather than lazy: AN ORDER STARTS
      # WITH ONE HUNDRED KARBONITE AND NO PASSIVE INCOME, so which of the
      # four buildable mobile types a castle can afford depends on how many
      # castles the board gives it. Every path below fires in at least one
      # of the nine, and the tier compares all nine.
      - name: "Tier A': the scripted rare paths really fired"
        run: |
          set -euo pipefail
          maps="seed-0009 seed-0021 seed-0034 seed-0043 seed-0048 seed-0107 \
                seed-0017 seed-0125 seed-0045"
          : > /tmp/bc19union.txt
          for map in $maps; do
            timeout 600 node tools/oracle/bc19/bc19_trace.js \
              --engine "$BC19_ENGINE" --bot bc19scenario --map "$map" \
              --rounds 1000 --assert-clock --out "/tmp/bc19s.$map.txt" \
              2>/dev/null
            cat "/tmp/bc19s.$map.txt" >> /tmp/bc19union.txt
            rm -f "/tmp/bc19s.$map.txt"
          done
          need() {
            grep -q -- "$1" /tmp/bc19union.txt || {
              echo "::error::Tier A' never reached: $2"
              echo "::error::(pattern $1). A scripted path the bot does not"
              echo "::error::reach must be DROPPED from the bot and added to"
              echo "::error::docs/PARITY.md section 'What is NOT compared'"
              echo "::error::with the reason -- never left in silently."
              exit 1; }
            echo "ok: $2"
          }
          # ONE OF EVERY BUILDABLE UNIT TYPE.
          for ty in CASTLE PILGRIM CRUSADER PROPHET PREACHER; do
            need "ty=${ty} " "a ${ty} was on the board"
          done
          # THE FIVE ACTION KINDS THE SCRIPT FORCES.
          need 'act=BUILD ' 'a build'
          need 'act=MOVE ' 'a move'
          need 'act=ATTACK ' 'an attack'
          need 'act=MINE ' 'a mine'
          need 'act=GIVE ' 'a give'
          # A BROADCAST AT THE MAXIMUM LEGAL RADIUS, whose fuel cost is 90.
          need 'sr=7938' 'the r2 7938 broadcast'
          # CASTLE TALK FROM A MOBILE UNIT (the pilgrim's turn 7).
          need 'ct=77' 'castle talk from a pilgrim'
          # A PILGRIM CARRYING AN UNREFINED LOAD -- mining really happened.
          grep -qE 'ty=PILGRIM .* (k=[1-9]|f=[1-9])' /tmp/bc19union.txt || {
            echo "::error::no pilgrim ever carried anything"; exit 1; }
          echo "ok: a pilgrim carried an unrefined load"
          rm -f /tmp/bc19union.txt

      # THE CHURCH, AND THE LEGAL 0-DAMAGE CHURCH ATTACK (D6.1), on EVERY
      # ONE of the nine boards. `bc19scenariotie` is the bot that reaches
      # them because it buys NOTHING ELSE: a church costs 50 of the opening
      # hundred karbonite, and by the time `bc19scenario`'s pilgrim exists
      # its castles have spent that hundred on the four mobile types.
      - name: "Tier A': the CHURCH and its 0-damage attack (D6.1)"
        run: |
          set -euo pipefail
          maps="seed-0009 seed-0021 seed-0034 seed-0043 seed-0048 seed-0107 \
                seed-0017 seed-0125 seed-0045"
          for map in $maps; do
            timeout 600 node tools/oracle/bc19/bc19_trace.js \
              --engine "$BC19_ENGINE" --bot bc19scenariotie --map "$map" \
              --rounds 30 --assert-clock --out /tmp/bc19c.txt 2>/dev/null
            grep -q 'ty=CHURCH ' /tmp/bc19c.txt || {
              echo "::error::no CHURCH was raised on ${map}"; exit 1; }
            grep -qE 'A [0-9]+ act=ATTACK dx=-?5 dy=-?5' /tmp/bc19c.txt || {
              echo "::error::the CHURCH never fired its 0-damage attack on"
              echo "::error::${map}. A CHURCH's ATTACK_RADIUS is the SCALAR"
              echo "::error::0, so both range comparisons are against"
              echo "::error::undefined and both are false -- the action is"
              echo "::error::ACCEPTED (record.action == 2) for 0 fuel and 0"
              echo "::error::damage. It is the quirk this year is most"
              echo "::error::likely to get wrong (D6.1)."
              exit 1; }
          done
          echo "the CHURCH and its 0-damage attack fired on all nine boards"

      # AND THE THREE END RUNGS THE SCRIPTS FORCE, each on the board chosen
      # for it in the design note's pair table.
      - name: "Tier A': castles_destroyed, more_unit_health and the barter"
        run: |
          set -euo pipefail
          # `castles_destroyed` (win_condition 0) on the one-castle-a-side
          # elimination board -- the normal way a bc19 game ends, and the
          # one rung an idle mirror can never reach.
          timeout 600 node tools/oracle/bc19/bc19_trace.js \
            --engine "$BC19_ENGINE" --bot bc19scenariokill --map seed-0017 \
            --rounds 1000 --assert-clock --out /tmp/bc19k.txt 2>/dev/null
          tail -1 /tmp/bc19k.txt | grep -q 'wc=0' || {
            echo "::error::bc19scenariokill did not end on castles_destroyed"
            sed -n '$p' /tmp/bc19k.txt; exit 1; }
          echo "bc19scenariokill: $(tail -1 /tmp/bc19k.txt)"
          # `more_unit_health` with the engine's own win_condition = 1: RED
          # builds and BLUE builds nothing, so the castles are level and the
          # health is not.
          timeout 600 node tools/oracle/bc19/bc19_trace.js \
            --engine "$BC19_ENGINE" --bot bc19scenariotie --map seed-0043 \
            --rounds 1000 --assert-clock --out /tmp/bc19t.txt 2>/dev/null
          tail -1 /tmp/bc19t.txt | grep -q 'winner=RED wc=1' || {
            echo "::error::bc19scenariotie did not end with RED winning on"
            echo "::error::unit health."
            sed -n '$p' /tmp/bc19t.txt; exit 1; }
          echo "bc19scenariotie: $(tail -1 /tmp/bc19t.txt)"
          # AND THE BARTER REALLY MOVES BOTH STORES IN OPPOSITE DIRECTIONS
          # on the matched payable offer -- the only externally visible
          # proof that `enactTrade` executed rather than merely recording an
          # offer.
          timeout 600 node tools/oracle/bc19/bc19_trace.js \
            --engine "$BC19_ENGINE" --bot bc19scenariotrade --map seed-0043 \
            --rounds 20 --assert-clock --allow-no-build \
            --out /tmp/bc19r.txt 2>/dev/null
          grep -q 'act=TRADE ' /tmp/bc19r.txt || {
            echo "::error::no trade was ever proposed"; exit 1; }
          python3 tools/ci/bc19_assert_trace.py barter /tmp/bc19r.txt

      # TIER B' (b): a SEPARATE, NON-COMPARED run that proves the engine
      # DOES freeze a slow bot. The port has no wall clock, so the freeze
      # branch is the one behaviour this oracle cannot compare -- this run
      # exists so the port's READING of the rule is PROVED rather than
      # asserted (docs/PARITY.md section bc19).
      - name: "Tier B' (b): the engine really does freeze a slow robot"
        run: |
          set -euo pipefail
          timeout 600 node tools/oracle/bc19/bc19_trace.js \
            --engine "$BC19_ENGINE" --bot bc19slowbot --map seed-0009 \
            --rounds 12 --expect-freeze --allow-inert \
            --out /tmp/bc19slow.txt

      - name: Upload the divergence digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-bc19-digests
          path: ${{ runner.temp }}/bc19digest
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Invoked by path, not through `bash`: a `bash SCRIPT` call ignores the exec
      # bit, so a 0644 helper would go green here and only fail wherever it is
      # executed directly.
      - name: Assert the smoke script is present and executable
        run: |
          set -euo pipefail
          test -f tools/ci/docker_smoke.sh || {
            echo "::error::tools/ci/docker_smoke.sh is missing"; exit 1; }
          test -x tools/ci/docker_smoke.sh || {
            echo "::error::tools/ci/docker_smoke.sh must be committed executable (mode 100755)."
            echo "::error::Fix with: git update-index --chmod=+x tools/ci/docker_smoke.sh"
            exit 1; }

      - name: Build image
        run: docker build --platform=linux/amd64 -t "${IMAGE}:ci" .

      # RAIL 2, GATED RATHER THAN ASSERTED. `Dockerfile:7` says "NO JDK, NO
      # JRE, NO JAVA, NO NODE in any stage" and a comment is not a gate: the
      # 2017, 2016, 2019 and 2026 engines are CI-only oracles and the
      # 2019/2020 generators need node, so a copy-paste from one of those
      # jobs into a Dockerfile stage is a real way for a JVM to arrive in a
      # published image. This asks the BUILT IMAGE, through its own shell,
      # what its PATH resolves -- `command -v` and not `which`, because
      # `which` is not installed in debian-slim and its absence would make
      # every probe "succeed" (r1-F6, design note §Packaging).
      - name: The built image has no java, javac, node or npm on its PATH
        run: |
          set -euo pipefail
          found=""
          for bin in java javac node npm; do
            # `|| true`: a resolved binary is the failure, a non-zero exit
            # from `command -v` is the pass, and `set -e` must not turn the
            # pass into a red step.
            path="$(docker run --rm --entrypoint /bin/sh "${IMAGE}:ci" \
              -c "command -v ${bin} 2>/dev/null || true")"
            if [ -n "${path}" ]; then
              echo "::error::${bin} resolves to ${path} inside ${IMAGE}:ci"
              found="${found} ${bin}"
            else
              echo "absent from the image's PATH: ${bin}"
            fi
          done
          if [ -n "${found}" ]; then
            echo "::error::rail 2: the published image must carry NO JVM and"
            echo "::error::NO Node.${found} is in it. The Battlecode engines"
            echo "::error::are CI-only oracles (docs/PARITY.md) and the map"
            echo "::error::and constant generators are build-time only."
            exit 1
          fi
          # And the probe itself has to be able to find something, or an
          # image with no shell at all would report four absences and pass.
          test -n "$(docker run --rm --entrypoint /bin/sh "${IMAGE}:ci" \
            -c 'command -v sh')" || {
            echo "::error::the absence probe could not resolve even /bin/sh,"
            echo "::error::so its four absences prove nothing"; exit 1; }

      # The contract probe inside docker_smoke.sh speaks WebSocket to the
      # running game exactly as `coworld certify` does. Without these it
      # fails loudly rather than skipping (see SMOKE_CONTRACT_PROBE).
      - name: Install the contract probe's client libraries
        run: python3 -m pip install --quiet websockets httpx jsonschema

      - name: Raw-Docker episode smoke (bc26, the certification fixture)
        # SMOKE_SLUG is passed explicitly so the workflow's SLUG is the single
        # source for the game/player entrypoint names; the script's own
        # scaffold-substituted default is only a fallback.
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc26
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # The SECOND episode: the bc20 year module, end to end, in the
      # production image. Certification stays on bc26 (the design note's
      # §Out of scope), so this is the only thing that proves a bc20 episode
      # runs in a container at all -- and its replay is what the wasm-viewer
      # job loads in a real browser.
      #
      # seed 4 draws `Hourglass` from the small pool, which plays the whole
      # 300 rounds: ~12.5 s at 24 fps, so the recording outlasts the viewer
      # smoke's 10 s soak (the ecos 2026-08-23 scar).
      - name: Raw-Docker episode smoke (bc20, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc20
          # The manifest declares exactly the two players the certification
          # fixture seats (certifier `players-run` fails any declared player
          # that has no slot), and `PLAYER_SCRIPTED` resolves per year:
          # on bc20 `awu` is bowl-of-chowder and `scaffold` is
          # examplefuncsplayer (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc20","pool":"small","seed":4,"gamesPerMatch":1,
             "maxRounds":300,"perGameBudgetSeconds":40,"matchBudgetSeconds":45,
             "connectTimeoutMs":15000}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc20.json
          # The certification contract probe ran against the bc26 episode a
          # moment ago on the same image; running it twice buys nothing and
          # doubles the flake surface.
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # The THIRD episode: the bc21 year module, end to end, in the production
      # image. Certification stays on bc26 (the design note's Out of scope),
      # so this is the only thing that proves a bc21 episode runs in a
      # container at all -- and its replay is what the wasm-viewer job loads
      # in a real browser.
      #
      # seed 2 draws `Arena` (32x32, six neutral Enlightenment Centres), which
      # gives the 400 rounds something to be about: at the default pace the
      # recording runs ~16 s, so it outlasts the viewer smoke's 10 s soak (the
      # ecos 2026-08-23 scar).
      #
      # SMOKE_REQUIRE_STATS is the episode SUBSTANCE assertion (the LEARNINGS
      # pin): an episode where a seat built nothing, bid nothing and won no
      # vote is now a red build rather than a green one with an empty replay.
      - name: Raw-Docker episode smoke (bc21, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc21
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc21
          # `awu` is california-roll and `scaffold` is examplefuncsplayer21
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc21","pool":"small","seed":2,"gamesPerMatch":1,
             "maxRounds":400,"perGameBudgetSeconds":45,"matchBudgetSeconds":50,
             "connectTimeoutMs":15000}
          SMOKE_REQUIRE_STATS: >-
            {"units_built":5,"influence_spent":100,"bids_placed":1,"votes":1}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc21.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # The FOURTH episode: the bc24 year module, end to end, in the
      # production image. Certification stays on bc26 (the design note's Out
      # of scope), so this is the only thing that proves a bc24 episode runs
      # in a container at all -- and its replay is what the wasm-viewer job
      # loads in a real browser.
      #
      # 600 ROUNDS, NOT 400: the first 200 are the setup phase, so a
      # 400-round smoke would record only 200 rounds of open play and might
      # never show a flag change hands. The seed is pinned to draw `Yinyang`
      # -- the map where even the WEAK bot manages flag pickups and captures
      # in the reference engine run -- and `tests/test_bc24_maps.nim` asserts
      # that draw, so the smoke's map cannot drift silently. At the default
      # pace 600 rounds records ~25 s of playback, which outlasts the viewer
      # smoke's 15 s soak (the ecos 2026-08-23 scar).
      #
      # SMOKE_REQUIRE_STATS is the episode SUBSTANCE assertion (the LEARNINGS
      # pin), enforced FOR BOTH SEATS by the script: an episode where a seat
      # spawned nothing, spent nothing, built nothing and hit nothing is a
      # red build rather than a green one with an empty replay.
      #
      # LEVELS AND HEALS ARE NOT IN THIS SET, because they are not things
      # BOTH seats can do. `examplefuncsplayer24` never heals, and its ducks
      # die faster than they earn the 15 attack experience a first level
      # costs (measured over this exact episode: 236 attacks against 143
      # jailings, and the jail penalty is -1 experience a time), so its
      # `levels_end` and `heal_dealt` are legitimately 0 -- that is what
      # being the weak floor means. Both are asserted ACROSS the seats in
      # the step below instead.
      - name: Raw-Docker episode smoke (bc24, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc24
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc24
          # `awu` is gone-sharkin and `scaffold` is examplefuncsplayer24
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc24","pool":"small","seed":1000,"gamesPerMatch":1,
             "maxRounds":600,"perGameBudgetSeconds":60,"matchBudgetSeconds":70,
             "connectTimeoutMs":15000}
          SMOKE_REQUIRE_STATS: >-
            {"ducks_spawned":10,"crumbs_spent":100,"traps_built":1,
             "damage_dealt":300}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc24.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # The FIFTH episode: the bc25 year module, end to end, in the
      # production image. Certification stays on bc26 (the design note's Out
      # of scope), so this is the only thing that proves a bc25 episode runs
      # in a container at all -- and its replay is what the wasm-viewer job
      # loads in a real browser.
      #
      # 600 ROUNDS: at the default pace that records ~25 s of playback, which
      # outlasts the viewer smoke's 15 s soak (the ecos 2026-08-23 scar), and
      # it is long enough that the strong chassis has built AND UPGRADED
      # towers. The seed is pinned to draw `DefaultSmall`, the smallest map in
      # the small pool, so the episode is fast and the map cannot drift --
      # `tests/test_bc25_maps.nim` asserts that exact draw.
      #
      # SMOKE_REQUIRE_STATS is the episode SUBSTANCE assertion (the LEARNINGS
      # pin), enforced FOR BOTH SEATS by the script: an episode where a seat
      # built nothing, painted nothing and spent nothing is a red build rather
      # than a green one with an empty replay.
      #
      # TOWERS AND RESOURCE PATTERNS ARE NOT IN THIS SET, because they are not
      # things BOTH seats do: `examplefuncsplayer25` never upgrades a tower
      # and never completes a resource pattern -- that is what being the weak
      # floor means. They are asserted ACROSS the seats in the step below.
      #
      # THE FLOORS ARE MEASURED, NOT GUESSED, and the first CI run is what
      # measured them (run 34172749340). This exact episode -- seed 3,
      # `DefaultSmall`, 600 rounds, spaark against examplefuncsplayer25:
      #
      #   seat 0 (spaark)               49 robots built, 254 tiles painted,
      #                                 52950 chips spent, 10540 paint spent
      #   seat 1 (examplefuncsplayer25) 67 robots built,  37 tiles painted,
      #                                 20000 chips spent,  7135 paint spent
      #
      # The committed floors are roughly half the WEAK seat's measured value.
      # THE DESIGN NOTE'S OWN `tiles_painted: 150` IS NOT USED, and the reason
      # is arithmetic rather than judgement: the note derived it from the Java
      # example-bot mirror over WHOLE 2000-ROUND GAMES (46-218 tiles a side),
      # and this smoke is 600 rounds -- less than a third of the game. The
      # weak floor paints 37 in that window, so 150 is a floor no correct
      # episode could ever clear. Fifteen is half of the measured value and
      # is still three times what an idle seat would produce. (r1-F34 read
      # the note's "never below this note's numbers" against it; the number
      # is kept, because raising it to 150 makes every correct episode red.
      # The across-the-pair floor in the next step, which the note also
      # numbers, IS raised to the note's value.)
      - name: Raw-Docker episode smoke (bc25, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc25
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc25
          # `awu` is spaark and `scaffold` is examplefuncsplayer25
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc25","pool":"small","seed":3,"gamesPerMatch":1,
             "maxRounds":600,"perGameBudgetSeconds":60,"matchBudgetSeconds":70,
             "connectTimeoutMs":15000}
          SMOKE_REQUIRE_STATS: >-
            {"robots_built":20,"tiles_painted":15,"chips_spent":8000,
             "paint_spent":3000}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc25.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # A SIXTH EPISODE: bc23. 800 rounds and not 600, and the reason is the
      # year: the default `anchor_round` is 400, so the window has to be long
      # enough for the strong chassis to actually build, ferry and plant an
      # anchor -- which is the one signature of this year the smoke asserts
      # across the pair. 800 rounds still records ~30 s of playback, which
      # outlasts the viewer smoke's 15 s soak (the ecos 2026-08-23 scar).
      # The seed is PINNED so the map cannot drift: `tests/test_bc23_maps.nim`
      # asserts that seed 1009 on the `small` pool draws exactly `Quiet`
      # (20x20, four islands, one headquarters a side), the smallest map in
      # the pool.
      - name: Raw-Docker episode smoke (bc23, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc23
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc23
          # `awu` is lemonade and `scaffold` is examplefuncsplayer23
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc23","pool":"small","seed":1009,"gamesPerMatch":1,
             "maxRounds":800,"perGameBudgetSeconds":70,
             "matchBudgetSeconds":80,"connectTimeoutMs":15000}
          # THE PER-SEAT FLOOR, AND IT IS MEASURED, NOT GUESSED. Phase 20 ran
          # exactly this episode and read the per-seat statistics off the
          # replay: units_built [37, 42], adamantium_mined [3617, 118],
          # mana_mined [203, 25], damage_dealt [5340, 2]. The committed
          # floors sit at roughly half the WEAK seat's value.
          #
          # TWO OF THE DESIGN NOTE'S FOUR NUMBERS ARE ABOVE WHAT A CORRECT
          # EPISODE PRODUCES and are therefore committed lower, with the
          # measurement beside them: the note asks for mana_mined 40 (the
          # weak seat mines 25 -- it collects on a coin flip from whatever
          # well it happens to stand beside, and `Quiet` has two adamantium
          # wells a side against one mana well) and damage_dealt 20 (the weak
          # seat deals 2 -- its launcher attacks the square ONE STEP EAST OF
          # ITSELF rather than the enemy it just sensed, which is upstream's
          # own bug and may not be "fixed" because that bot is one side of
          # the differential oracle). The note's own rule is "never above
          # what a correct episode produces", and this is that case.
          SMOKE_REQUIRE_STATS: >-
            {"units_built":20,"adamantium_mined":60,"mana_mined":12,
             "damage_dealt":1}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc23.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # THE ACROSS-THE-PAIR HALF, and for this year it is the half that
      # matters. The signatures of 2023 -- DEPOSITING cargo at a
      # headquarters, taking an anchor, planting it and holding an island --
      # are things only a seat playing WELL does: measured, the upstream
      # example bot never calls `transferResource` or `takeAnchor` AT ALL, so
      # asserting them per-seat would be asserting that the weak floor is not
      # weak. Together these five make an idle win machine-visible, which is
      # exactly what the 2026-09-03 round-1 degenerate match lacked.
      #
      # IF `islands_captured >= 1` EVER STOPS HOLDING, THE FIX IS TO RAISE
      # THE SMOKE'S `maxRounds` UNTIL IT DOES -- never to drop the
      # assertion. An episode of this year in which nobody ever anchors an
      # island is not this game being played.
      - name: The bc23 episode really played bc23
        run: |
          set -euo pipefail
          # Read from the REPLAY, whose `result` block is the results
          # document verbatim: `dist/smoke/results.json` is overwritten by
          # every episode in turn and naming it here would make this
          # assertion depend on which episode happened to run last (the bc24
          # fix).
          sum() { jq -r "[.result.games[0].$1[]] | add" \
            dist/smoke/replay-bc23.json; }
          built="$(sum units_built)"
          banked="$(sum resources_banked)"
          ancbuilt="$(sum anchors_built)"
          ancplaced="$(sum anchors_placed)"
          captured="$(sum islands_captured)"
          # Measured on this exact episode: 79 units built, 3480 kg banked,
          # 5 anchors built, 3 placed and 3 islands captured between the two
          # seats. The floors are the design note's own 60/200/1/1/1.
          echo "across the two seats: units=${built} banked=${banked}" \
               "anchors built=${ancbuilt} placed=${ancplaced}" \
               "islands captured=${captured}"
          test "${built}" -ge 60 || {
            echo "::error::the bc23 smoke episode built ${built} robots"
            echo "::error::between the two seats. A faction with five build"
            echo "::error::actions a turn does not build twenty."
            exit 1; }
          test "${banked}" -ge 200 || {
            echo "::error::${banked} kg was DEPOSITED into a headquarters in"
            echo "::error::the whole episode. In this year a resource joins"
            echo "::error::the team total the moment it is mined but a"
            echo "::error::headquarters can only spend from its OWN"
            echo "::error::stockpile, so a faction whose carriers never"
            echo "::error::deposit looks rich and builds nothing."
            exit 1; }
          test "${ancbuilt}" -ge 1 || {
            echo "::error::nobody built a reality anchor in the whole episode."
            exit 1; }
          test "${ancplaced}" -ge 1 || {
            echo "::error::an anchor was built and never delivered: an anchor"
            echo "::error::weighs a carrier's whole capacity, so the ferry is"
            echo "::error::the path this asserts."
            exit 1; }
          test "${captured}" -ge 1 || {
            echo "::error::no island changed hands in the whole episode."
            echo "::error::RAISE maxRounds until it does; do NOT drop this."
            exit 1; }

      # THE PACING NUMBER the next year module sizes its own probe from, and
      # the number that decided this year's own `--timeout 120 --soak 15`
      # (docs/RULES-BC23.md, "What this year measures").
      - name: Print the bc23 episode's simulated seconds per round
        run: |
          set -euo pipefail
          jq -r '"bc23 smoke: sim_seconds=\(.result.sim_seconds) " +
                 "rounds=\(.result.games[0].rounds_played) " +
                 "wall=\(.result.wall_clock_seconds)s"' \
            dist/smoke/replay-bc23.json

      # THE ACROSS-THE-SEATS HALF of the bc25 substance assertion. Three
      # signatures of this year -- building a tower beyond the starting two,
      # upgrading one, and colouring a real share of the map -- are things
      # only a seat playing WELL does, so asserting them per-seat would be
      # asserting that the weak floor is not weak. Asserting them across the
      # pair makes an idle win machine-visible, which is exactly what the
      # 2026-09-03 round-1 degenerate match lacked.
      - name: The bc25 episode really played bc25
        run: |
          set -euo pipefail
          # Read from the REPLAY, whose `result` block is the results
          # document verbatim: `dist/smoke/results.json` is overwritten by
          # every episode in turn and naming it here would make this
          # assertion depend on which episode happened to run last (the bc24
          # fix).
          sum() { jq -r "[.result.games[0].$1[]] | add" \
            dist/smoke/replay-bc25.json; }
          built="$(sum towers_built)"
          upgraded="$(sum towers_upgraded)"
          painted="$(sum squares_painted)"
          # Measured on the same run: 6 towers built, 9 upgraded, 241
          # squares held between the two clans. The floors are the design
          # note's own 1/1/200 (r1-F34: the squares floor was 120, below the
          # note's 200, for no measured reason -- 241 clears 200 with room).
          echo "across the two seats: towers built=${built}" \
               "towers upgraded=${upgraded} squares painted=${painted}"
          test "${built}" -ge 1 || {
            echo "::error::the bc25 smoke episode never raised a tower beyond"
            echo "::error::the two it started with. A bc25 game where nobody"
            echo "::error::paints a pattern onto a ruin is not this game."
            exit 1; }
          test "${upgraded}" -ge 1 || {
            echo "::error::nobody upgraded a tower in the whole episode."
            exit 1; }
          test "${painted}" -ge 200 || {
            echo "::error::the two clans between them held ${painted} tiles at"
            echo "::error::the end. The score IS the colour of the map."
            exit 1; }

      # THE PACING NUMBER the next year module sizes its own probe from,
      # printed rather than guessed (docs/RULES-BC25.md, "What this year
      # measures").
      - name: Print the bc25 episode's simulated seconds per round
        run: |
          set -euo pipefail
          jq -r '"bc25 smoke: sim_seconds=\(.result.sim_seconds) " +
                 "rounds=\(.result.games[0].rounds_played) " +
                 "wall=\(.result.wall_clock_seconds)s"' \
            dist/smoke/replay-bc25.json


      # `SMOKE_REQUIRE_STATS` is per-seat, and three of this game's
      # signatures -- lifting an enemy flag, specialising, and healing -- are
      # things only a seat playing WELL does. Asserting them per-seat would
      # be asserting that the weak floor is not weak. Asserting them across
      # the pair makes an idle win machine-visible, which is exactly what the
      # 2026-09-03 round-1 degenerate match lacked.
      #
      # The key is `flags_picked_up`, the name the results document actually
      # uses; the design note's jq line says `flag_pickups`, which is not a
      # key any bc24 results document has ever carried.
      - name: The bc24 episode really played bc24
        run: |
          set -euo pipefail
          # Read from the REPLAY, whose `result` block is the results
          # document verbatim: `dist/smoke/results.json` is overwritten by
          # every episode in turn and naming it here would make this
          # assertion depend on which episode happened to run last.
          sum() { jq -r "[.result.games[0].$1[]] | add" \
            dist/smoke/replay-bc24.json; }
          picked="$(sum flags_picked_up)"
          levels="$(sum levels_end)"
          healed="$(sum heal_dealt)"
          echo "across the two seats: flag pickups=${picked}" \
               "skill levels=${levels} health healed=${healed}"
          test "${picked}" -ge 1 || {
            echo "::error::the bc24 smoke episode never touched a flag."
            echo "::error::A bc24 game where nobody lifts a flag is not this"
            echo "::error::game being played."
            exit 1; }
          test "${levels}" -ge 3 || {
            echo "::error::nobody specialised: the whole episode ended with"
            echo "::error::${levels} skill levels between the two clans."
            exit 1; }
          test "${healed}" -ge 80 || {
            echo "::error::nobody healed: ${healed} health restored in the"
            echo "::error::whole episode, and one heal is worth 80."
            exit 1; }

      # A SEVENTH EPISODE: bc22. 700 rounds and not 400, for two reasons that
      # are both this year's: the default `lab_round` is 300 and a laboratory
      # needs a builder commissioned, walked, placed and then TEN repairs, so
      # the window has to reach roughly round 400 for the strong chassis to
      # actually make a gold -- which is the one signature of this year the
      # smoke asserts across the pair -- and the smallest map's FIRST ANOMALY
      # IS AT ROUND 200, so 700 rounds guarantees at least one anomaly really
      # struck. 700 rounds also records ~25 s of playback, which outlasts the
      # viewer smoke's 15 s soak (the ecos 2026-08-23 scar).
      #
      # The seed is PINNED so the map cannot drift: `tests/test_bc22_maps.nim`
      # asserts that seed 2029 on the `small` pool draws exactly
      # `snowflake_redux` (20x20, TWO archons a side, 32 lead squares
      # totalling 760, first anomaly at round 200) -- the liveliest small map.
      #
      # THE PER-SEAT FLOOR IS MEASURED, NOT GUESSED. `SMOKE_REQUIRE_STATS` is
      # enforced FOR BOTH SEATS by the script, so it may only name things
      # BOTH chassis do -- including the weak floor, whose archons build a
      # miner or a soldier most turns from round 1, whose miners mine every
      # adjacent square every turn (five times a turn on flat ground) and
      # whose soldiers attack `enemies[0]`. Phase 20 measured a whole
      # 2000-round `wololo` mirror on this map at units_built [27+13, 30+10],
      # lead_mined [10939, 8534] and damage_dealt [1519, 1845]; this smoke is
      # a THIRD of that window against a weak floor, so the committed numbers
      # are the design note's own 15 / 100 / 10, which sit well under a third
      # of the weak seat's measured value.
      - name: Raw-Docker episode smoke (bc22, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc22
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc22
          # `awu` is wololo and `scaffold` is examplefuncsplayer22
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc22","pool":"small","seed":2029,"gamesPerMatch":1,
             "maxRounds":700,"perGameBudgetSeconds":70,
             "matchBudgetSeconds":80,"connectTimeoutMs":15000}
          SMOKE_REQUIRE_STATS: >-
            {"units_built":15,"lead_mined":100,"damage_dealt":10}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc22.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # THE ACROSS-THE-PAIR HALF, and for this year it is the half that
      # matters. The signatures of 2022 -- commissioning a BUILDER, finishing
      # a LABORATORY, making a GOLD and taking a hit from an ANOMALY -- are
      # things only a seat playing WELL does: measured over eight full
      # 2000-round games, the upstream example bot's builder, sage,
      # laboratory and watchtower branches are EMPTY and it made 0 gold in
      # every one, so asserting them per-seat would be asserting that the
      # weak floor is not weak. Together these seven make an idle win
      # machine-visible, which is exactly what the 2026-09-03 round-1
      # degenerate match lacked.
      #
      # IF `labs_finished >= 1` OR `transmutes >= 1` EVER STOPS HOLDING, THE
      # FIX IS TO RAISE THE SMOKE'S `maxRounds` UNTIL IT DOES, or to pull
      # `lab_round` forward -- never to drop the assertion. An episode of
      # this year in which nobody ever makes a gold is not this game being
      # played.
      - name: The bc22 episode really played bc22
        run: |
          set -euo pipefail
          # Read from the REPLAY, whose `result` block is the results
          # document verbatim: `dist/smoke/results.json` is overwritten by
          # every episode in turn and naming it here would make this
          # assertion depend on which episode happened to run last (the bc24
          # fix).
          sum() { jq -r "[.result.games[0].$1[]] | add" \
            dist/smoke/replay-bc22.json; }
          built="$(sum units_built)"
          mined="$(sum lead_mined)"
          builders="$(sum builders_built)"
          labs="$(sum labs_built)"
          finished="$(sum labs_finished)"
          transmutes="$(sum transmutes)"
          charge="$(sum anomaly_losses_charge)"
          fury="$(sum anomaly_losses_fury_hp)"
          abyss="$(sum anomaly_losses_abyss_lead)"
          bite=$(( charge + fury + abyss ))
          echo "across the two seats: units=${built} lead=${mined}" \
               "builders=${builders} labs=${labs}/${finished}" \
               "transmutes=${transmutes} anomaly bite=${bite}"
          test "${built}" -ge 45 || {
            echo "::error::the bc22 smoke episode built ${built} robots"
            echo "::error::between the two seats. Both cooldowns start a"
            echo "::error::robot's life at ZERO in this year and an archon"
            echo "::error::acts every turn: a faction does not build twenty."
            exit 1; }
          test "${mined}" -ge 300 || {
            echo "::error::${mined} lead was mined in the whole episode."
            echo "::error::A miner's action cooldown is 2 against a limit of"
            echo "::error::10, so it mines FIVE TIMES A TURN on flat ground."
            exit 1; }
          test "${builders}" -ge 1 || {
            echo "::error::nobody commissioned a builder, so nothing could"
            echo "::error::ever be built: a LABORATORY and a WATCHTOWER are"
            echo "::error::a BUILDER's to place, not an archon's."
            exit 1; }
          test "${labs}" -ge 1 || {
            echo "::error::no laboratory was placed in the whole episode."
            exit 1; }
          test "${finished}" -ge 1 || {
            echo "::error::a laboratory was placed and never FINISHED. A"
            echo "::error::building spawns as an 80-HP PROTOTYPE that can"
            echo "::error::neither act nor move until a builder has repaired"
            echo "::error::it to full -- ten repairs. A prototype that is"
            echo "::error::never finished is 180 lead of nothing."
            exit 1; }
          test "${transmutes}" -ge 1 || {
            echo "::error::not one gold was made in the whole episode. A"
            echo "::error::LABORATORY IS THE ONLY SOURCE OF GOLD IN THIS"
            echo "::error::GAME. RAISE maxRounds until it fires, or pull"
            echo "::error::lab_round forward; do NOT drop this."
            exit 1; }
          test "${bite}" -ge 1 || {
            echo "::error::no anomaly measurably hit anyone, and the map's"
            echo "::error::first one is scheduled for round 200 of 700."
            exit 1; }

      # The EIGHTH episode: the bc16 year module, end to end, in the
      # production image. Certification stays on bc26 (the design note's Out
      # of scope), so this is the only thing that proves a bc16 episode runs
      # in a container at all -- and its replay is what the wasm-viewer job
      # loads in a real browser.
      #
      # 900 ROUNDS, AND NOT 400 OR 600, for two reasons that are both this
      # year's. On the pinned map (`river`, 32x32, THREE archons a side, four
      # dens, FIRST WAVE AT ROUND 150) a 400-round window would show ONE wave
      # and no escalation, while 900 rounds guarantees three scheduled waves,
      # an outbreak level change at round 300 and another at 600, and a viper
      # affordable at all (120 parts against a 2-a-round income). And the
      # across-the-pair substance assertions below need INFECTION and TURNING
      # to have happened at least once, which needs zombies to have reached a
      # unit. 900 rounds also records ~37 s of playback, which comfortably
      # outlasts the viewer smoke's 15 s soak (the ecos 2026-08-23 scar).
      #
      # THE SEED IS PINNED TO DRAW `river`, whose 4.0 archon separation makes
      # the two factions fight immediately, so the episode is short AND
      # eventful -- and `tests/test_bc16_maps.nim` asserts that exact draw
      # from the other side, so the smoke's map cannot drift silently.
      #
      # SMOKE_REQUIRE_STATS is the episode SUBSTANCE assertion (the LEARNINGS
      # 2026-09-03 pin), enforced FOR BOTH SEATS by the script. THE FLOORS ARE
      # MEASURED, NOT GUESSED: this exact episode -- seed 2016004, `river`,
      # 900 rounds, bulwark against greenhorn -- produces
      #
      #   seat 0 (bulwark)    75 units built, 7357 damage, 7400 parts (tenths)
      #   seat 1 (greenhorn)  72 units built, 4186 damage, 2600 parts (tenths)
      #
      # and the committed floors are roughly HALF the weak seat's value, which
      # is also comfortably ABOVE every number the design note names (6 / 150
      # / 500). GUARDS, TURRETS, NEUTRALS AND DENS ARE NOT IN THIS SET,
      # because they are not things BOTH seats do: `greenhorn` builds only
      # SOLDIERs, never activates a neutral and never kills a den -- that is
      # what being the weak floor means. They are asserted ACROSS the seats in
      # the step below instead.
      - name: Raw-Docker episode smoke (bc16, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc16
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc16
          # `awu` is bulwark and `scaffold` is greenhorn
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc16","pool":"small","seed":2016004,"gamesPerMatch":1,
             "maxRounds":900,"perGameBudgetSeconds":90,
             "matchBudgetSeconds":100,"connectTimeoutMs":15000}
          SMOKE_REQUIRE_STATS: >-
            {"units_built":30,"damage_dealt":1500,
             "parts_collected_tenths":1000}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc16.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # THE ACROSS-THE-PAIR HALF, and for this year it is the half that
      # matters. The signatures of 2016 -- commissioning a GUARD or a TURRET,
      # activating a NEUTRAL, being INFECTED and having one of your own units
      # STAND BACK UP ON THE HORDE'S SIDE -- are things only a seat playing
      # WELL does, and `greenhorn` does none of them, so asserting them
      # per-seat would be asserting that the weak floor is not weak. Together
      # they make an idle win machine-visible, which is exactly what the
      # 2026-09-03 round-1 degenerate match lacked.
      #
      # IF `robots_turned >= 6` OR `guards_built >= 3` EVER STOPS HOLDING,
      # THE FIX IS TO RAISE THE SMOKE'S `maxRounds` UNTIL IT DOES -- never to
      # drop the assertion. An episode of this year in which nobody was ever
      # infected is not this game being played.
      #
      # Measured on this exact episode (the numbers the floors are half of):
      # units 147, damage 11543, guards 7, infections 70, turned 18,
      # zombie damage 4150, zombies spawned 54, outbreak level 2.
      - name: The bc16 episode really played bc16
        run: |
          set -euo pipefail
          # Read from the REPLAY, whose `result` block is the results
          # document verbatim: `dist/smoke/results.json` is overwritten by
          # every episode in turn and naming it here would make this
          # assertion depend on which episode happened to run last (the bc24
          # fix).
          sum() { jq -r "[.result.games[0].$1[]] | add" \
            dist/smoke/replay-bc16.json; }
          scalar() { jq -r ".result.games[0].$1" \
            dist/smoke/replay-bc16.json; }
          built="$(sum units_built)"
          damage="$(sum damage_dealt)"
          guards="$(sum guards_built)"
          infected="$(sum infections_suffered)"
          turned="$(sum robots_turned)"
          zdamage="$(sum zombie_damage_dealt)"
          spawned="$(scalar zombies_spawned)"
          outbreak="$(scalar outbreak_level_end)"
          echo "across the two seats: units=${built} damage=${damage}" \
               "guards=${guards} infections=${infected} turned=${turned}" \
               "zombie-damage=${zdamage} zombies=${spawned}" \
               "outbreak=${outbreak}"
          test "${built}" -ge 80 || {
            echo "::error::the bc16 smoke episode built ${built} robots"
            echo "::error::between the two seats. An archon builds a 30-part"
            echo "::error::SOLDIER whenever parts allow and income is two a"
            echo "::error::round: a faction does not build twenty in 900."
            exit 1; }
          test "${damage}" -ge 4000 || {
            echo "::error::${damage} damage was dealt in the whole episode."
            echo "::error::On `river` the two factions start 4.0 apart."
            exit 1; }
          test "${guards}" -ge 3 || {
            echo "::error::nobody commissioned a GUARD. A guard is 145 HP"
            echo "::error::against a soldier's 60, deals DOUBLE damage to"
            echo "::error::zombies and blocks 4 off any hit above 10 -- it is"
            echo "::error::the unit this year is about, and the strong"
            echo "::error::chassis builds seven in this window."
            exit 1; }
          test "${infected}" -ge 20 || {
            echo "::error::only ${infected} units were ever infected. A"
            echo "::error::zombie bite infects for 10 turns and the first"
            echo "::error::wave lands on round 150 of 900."
            exit 1; }
          test "${turned}" -ge 6 || {
            echo "::error::not one unit stood back up on the horde's side."
            echo "::error::A robot that dies INFECTED leaves no rubble and"
            echo "::error::becomes a zombie of its own turnsInto -- it is THE"
            echo "::error::mechanic of this year. RAISE maxRounds until it"
            echo "::error::fires; do NOT drop this."
            exit 1; }
          test "${zdamage}" -ge 1500 || {
            echo "::error::${zdamage} damage was dealt to the horde in the"
            echo "::error::whole episode. Both factions fight it."
            exit 1; }
          test "${spawned}" -ge 25 || {
            echo "::error::only ${spawned} zombies were spawned. `river`'s"
            echo "::error::four dens owe 266 across the game and the first"
            echo "::error::wave is round 150 of 900."
            exit 1; }
          test "${outbreak}" -ge 2 || {
            echo "::error::the outbreak level ended at ${outbreak}. It rises"
            echo "::error::every 300 rounds, so a 900-round episode reaches"
            echo "::error::level 2 by arithmetic -- unless the episode ended"
            echo "::error::early."
            exit 1; }

      # 600 ROUNDS, AND NOT 400, for a reason that is this year's. On the
      # pinned map (`seed-0043`, 35x35, TWO castles a side, MINIMUM CASTLE
      # SEPARATION 14, 89.4 % passable, 4 karbonite and 4 fuel depots a
      # side) a 400-round window shows the opening economy but not the first
      # military exchange, while 600 rounds guarantees a pilgrim on every
      # near depot, at least one deposit at a castle, at least one military
      # unit built on both sides, and FIRST CONTACT -- a crusader crosses 14
      # squares in about five turns once built. 600 rounds also records
      # ~15-20 s of playback, which comfortably outlasts the viewer smoke's
      # 10 s soak (the ecos 2026-08-23 scar).
      #
      # THE SEED IS PINNED TO DRAW `seed-0043`, and
      # `tests/test_bc19_maps.nim` asserts that exact draw from the other
      # side, so the smoke's map cannot drift silently.
      #
      # SMOKE_REQUIRE_STATS is the episode SUBSTANCE assertion (the LEARNINGS
      # 2026-09-03 pin), enforced FOR BOTH SEATS by the script. THE FLOORS
      # ARE MEASURED, NOT GUESSED: this exact episode -- seed 13,
      # `seed-0043`, 600 rounds, saber against examplefuncsplayer19 --
      # produces
      #
      #   seat 0 (saber)                26 units built, 4622 moves, 160 damage
      #   seat 1 (examplefuncsplayer19)  6 units built, 2003 moves,   0 damage
      #
      # and the committed floors are at or below HALF the weak seat's value.
      # `damage_dealt` is floored at 0 PER SEAT deliberately: the weak floor
      # never aims, so it may legitimately deal nothing. MINING, DEPOSITING,
      # CHURCH EXPANSION, TRADING AND A PREACHER BLAST ARE NOT IN THIS SET,
      # because they are not things BOTH seats do -- `examplefuncsplayer19`
      # builds a crusader every tenth castle turn and moves it in a random
      # direction, and does nothing else at all. They are asserted ACROSS
      # the seats in the step below instead.
      - name: Raw-Docker episode smoke (bc19, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc19
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc19
          # `awu` is saber and `scaffold` is examplefuncsplayer19
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc19","pool":"small","seed":13,"gamesPerMatch":1,
             "maxRounds":600,"perGameBudgetSeconds":60,
             "matchBudgetSeconds":70,"connectTimeoutMs":15000}
          SMOKE_REQUIRE_STATS: >-
            {"units_built":3,"moves":40,"damage_dealt":0}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc19.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # THE ACROSS-THE-PAIR HALF, and for this year it is the half that
      # matters. The signatures of 2019 -- mining, walking the load home and
      # DEPOSITING it, expanding to a church, bartering, landing a preacher
      # blast -- are things only a seat playing WELL does, and
      # `examplefuncsplayer19` does NONE of them, so asserting them per-seat
      # would be asserting that the weak floor is not weak. Together they
      # make an idle win machine-visible, which is exactly what the
      # 2026-09-03 round-1 degenerate match lacked.
      #
      # IF `karbonite_deposited >= 30` OR `attacks >= 1` EVER STOPS HOLDING,
      # THE FIX IS TO RAISE THE SMOKE'S `maxRounds` UNTIL IT DOES -- never
      # to drop the assertion. An episode of this year in which nobody ever
      # refined a load or fired a shot is not this game being played.
      #
      # Measured on this exact episode (the numbers the floors are at or
      # below half of): units 39, karbonite mined 3252, fuel mined 18590,
      # karbonite deposited 3234, pilgrims 11, attacks 20, damage 200, ids
      # spent 43, queue length 38.
      #
      # `refused_actions` is NOT asserted here and must not be: this episode
      # seats `examplefuncsplayer19`, whose whole behaviour is a CRUSADER
      # build at the fixed offset (1,1), and on `seed-0043` that square is
      # unavailable most turns. 323 of its orders are refused in this
      # episode and that is the weak floor being weak, not a defect. The
      # `refused_actions == 0` gate belongs to `saber` and lives in
      # `tests/test_bc19_survival.nim`.
      - name: The bc19 episode really played bc19
        run: |
          set -euo pipefail
          # Read from the REPLAY, whose `result` block is the results
          # document verbatim: `dist/smoke/results.json` is overwritten by
          # every episode in turn and naming it here would make this
          # assertion depend on which episode happened to run last (the bc24
          # fix).
          sum() { jq -r "[.result.games[0].$1[]] | add" \
            dist/smoke/replay-bc19.json; }
          scalar() { jq -r ".result.games[0].$1" \
            dist/smoke/replay-bc19.json; }
          built="$(sum units_built)"
          kmined="$(sum karbonite_mined)"
          fmined="$(sum fuel_mined)"
          kdep="$(sum karbonite_deposited)"
          pilgrims="$(sum pilgrims_built)"
          attacks="$(sum attacks)"
          damage="$(sum damage_dealt)"
          ids="$(scalar ids_spent)"
          queue="$(scalar queue_length_end)"
          echo "across the two seats: units=${built} karbonite=${kmined}" \
               "fuel=${fmined} deposited=${kdep} pilgrims=${pilgrims}" \
               "attacks=${attacks} damage=${damage} ids=${ids}" \
               "queue=${queue}"
          test "${built}" -ge 8 || {
            echo "::error::the bc19 smoke episode built ${built} robots"
            echo "::error::between the two seats. A castle builds a 10/50"
            echo "::error::PILGRIM on its first affordable turn and the weak"
            echo "::error::floor builds a crusader every tenth turn."
            exit 1; }
          test "${kmined}" -ge 40 || {
            echo "::error::only ${kmined} karbonite was mined. Karbonite has"
            echo "::error::NO passive income in this year: an order that"
            echo "::error::does not mine cannot build anything at all."
            exit 1; }
          test "${fmined}" -ge 100 || {
            echo "::error::only ${fmined} fuel was mined. The only passive"
            echo "::error::income is 25 a round and every move burns it."
            exit 1; }
          test "${kdep}" -ge 30 || {
            echo "::error::only ${kdep} karbonite was ever DEPOSITED. Mined"
            echo "::error::karbonite is UNREFINED and unspendable until a"
            echo "::error::robot GIVEs it to an adjacent castle or church --"
            echo "::error::an order that mines and never walks the load home"
            echo "::error::has not played the game. RAISE maxRounds until it"
            echo "::error::fires; do NOT drop this."
            exit 1; }
          test "${pilgrims}" -ge 2 || {
            echo "::error::nobody built a PILGRIM. It is the only unit that"
            echo "::error::can mine and the only one that can build a"
            echo "::error::CHURCH."
            exit 1; }
          test "${attacks}" -ge 1 || {
            echo "::error::not one shot was fired in the whole episode. On"
            echo "::error::seed-0043 the two orders start 14 squares apart."
            echo "::error::RAISE maxRounds until it fires; do NOT drop this."
            exit 1; }
          test "${damage}" -ge 10 || {
            echo "::error::${damage} damage was dealt in the whole episode."
            exit 1; }
          test "${ids}" -ge 12 || {
            echo "::error::only ${ids} ids were drawn. Every unit ever"
            echo "::error::created draws one from the MT19937 stream and the"
            echo "::error::pool is never refilled -- ${ids} means almost"
            echo "::error::nothing was built."
            exit 1; }
          test "${queue}" -ge 6 || {
            echo "::error::the turn queue ended with ${queue} robots."
            exit 1; }

      # THE PACING NUMBER phase 60 sizes its check-8 dispatch from, and the
      # number that decided this year's `--timeout 90 --soak 10`
      # (docs/RULES-BC19.md, "Playback pacing, measured"). If the measured
      # value exceeds 3 ms/round, bc19 moves to the heavy set.
      - name: Print the bc19 episode's simulated seconds per round
        run: |
          set -euo pipefail
          jq -r '"bc19 smoke: sim_seconds=\(.result.sim_seconds) " +
                 "rounds=\(.result.games[0].rounds_played) " +
                 "wall=\(.result.wall_clock_seconds)s"' \
            dist/smoke/replay-bc19.json

      # bc17, THE TENTH YEAR MODULE AND THE ONLY CONTINUOUS-SPACE ONE.
      #
      # 900 ROUNDS, AND NOT 400, for a reason that is this year's. On the
      # pinned map (`HouseDivided`, 30x30, ONE archon a side, ARCHON
      # SEPARATION 6.5 -- the smallest in the whole `small` pool -- and 41
      # neutral trees of which 41 hold bullets and 6 hold a robot) a
      # 400-round window shows the opening farm but not the payoff: a
      # planted tree grows for EIGHTY-ONE rounds before it pays anything at
      # all, and a built fighter is DORMANT for its first twenty. 900 rounds
      # guarantees a mature farm, real tree income, first contact inside
      # twenty rounds and a decided game. It also records ~20 s of playback,
      # which comfortably outlasts the viewer smoke's 15 s soak (the ecos
      # 2026-08-23 scar).
      #
      # THE SEED IS PINNED TO DRAW `HouseDivided`, and
      # `tests/test_bc17_maps.nim` asserts that exact draw from the other
      # side, so the smoke's map cannot drift silently.
      #
      # SMOKE_REQUIRE_STATS is the episode SUBSTANCE assertion (the LEARNINGS
      # 2026-09-03 pin), enforced FOR BOTH SEATS by the script. THE FLOORS
      # ARE MEASURED, NOT GUESSED: this exact episode -- seed 5,
      # `HouseDivided`, 900 rounds, orchard against examplefuncsplayer17 --
      # produces
      #
      #   seat 0 (orchard)                20 units built, 1196 moves, 805 damage
      #   seat 1 (examplefuncsplayer17)    6 units built, 1860 moves, 368 damage
      #
      # and the committed floors are at or below HALF the weak seat's value.
      # `damage_dealt` is floored at 0 PER SEAT deliberately: the weak floor
      # fires at `robots[0]` and may legitimately never connect. PLANTING,
      # WATERING, SHAKING, CHOPPING AND DONATING ARE NOT IN THIS SET, because
      # they are not things BOTH seats do -- `examplefuncsplayer17` never
      # plants, waters, shakes, chops or donates, and it MAY NOT GAIN
      # BEHAVIOUR because it is one side of the differential parity oracle.
      # They are asserted ACROSS the seats in the step below instead.
      - name: Raw-Docker episode smoke (bc17, scripted vs scripted)
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          SMOKE_EXPECT_YEAR: bc17
          # The manifest declares exactly the two players the certification
          # fixture seats, and `PLAYER_SCRIPTED` resolves per year: on bc17
          # `awu` is orchard and `scaffold` is examplefuncsplayer17
          # (src/battlecode/baselines.nim).
          SMOKE_PLAYER_IDS: awu,scaffold
          SMOKE_CONFIG_OVERRIDE: >-
            {"year":"bc17","pool":"small","seed":5,"gamesPerMatch":1,
             "maxRounds":900,"perGameBudgetSeconds":90,
             "matchBudgetSeconds":100,"connectTimeoutMs":15000}
          # `damage_dealt_tenths`, not `damage_dealt`: EVERY float quantity
          # in this year's results document is an integer number of TENTHS
          # (results.nim, bc17's optional list), because bullets, health and
          # damage are all float32 and a raw float in a JSON results
          # document is a formatter argument waiting to happen.
          SMOKE_REQUIRE_STATS: >-
            {"units_built":3,"moves":400,"damage_dealt_tenths":0}
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/replay-bc17.json
          SMOKE_CONTRACT_PROBE: "0"
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # THE ACROSS-THE-PAIR HALF. The signatures of 2017 -- planting a
      # bullet tree, WATERING it so it does not wither at 0.5 a round,
      # shaking a neutral tree for the bullets inside it, chopping one open
      # and firing a shot -- are things only a seat playing WELL does, and
      # `examplefuncsplayer17` does NONE of them. Asserting them per-seat
      # would be asserting that the weak floor is not weak; asserting them
      # across the pair makes an idle win machine-visible, which is exactly
      # what the 2026-09-03 round-1 degenerate match lacked.
      #
      # IF `water_actions >= 200` OR `bullets_fired >= 1` EVER STOPS
      # HOLDING, THE FIX IS TO RAISE THE SMOKE'S `maxRounds` UNTIL IT DOES
      # -- never to drop the assertion. An episode of this year in which
      # nobody ever watered a tree or fired a bullet is not this game being
      # played.
      #
      # Measured on this exact episode (the numbers the floors are at or
      # below half of): trees planted 5, water actions 1145, shakes 30,
      # chops 80, bullets fired 951, tree income 1529 bullets, strikes 100.
      - name: The bc17 episode really played bc17
        run: |
          set -euo pipefail
          # Read from the REPLAY, whose `result` block is the results
          # document verbatim: `dist/smoke/results.json` is overwritten by
          # every episode in turn and naming it here would make this
          # assertion depend on which episode happened to run last (the bc24
          # fix).
          sum() { jq -r "[.result.games[0].$1[]] | add" \
            dist/smoke/replay-bc17.json; }
          planted="$(sum trees_planted)"
          water="$(sum water_actions)"
          shakes="$(sum shake_actions)"
          chops="$(sum chop_actions)"
          fired="$(sum bullets_fired)"
          income="$(sum bullets_earned_from_trees_tenths)"
          strikes="$(sum strike_actions)"
          echo "across the two seats: planted=${planted} water=${water}" \
               "shakes=${shakes} chops=${chops} fired=${fired}" \
               "tree_income_tenths=${income} strikes=${strikes}"
          test "${planted}" -ge 2 || {
            echo "::error::only ${planted} bullet trees were planted in the"
            echo "::error::whole episode. A bullet tree is the ONLY real"
            echo "::error::income in this year: the passive trickle is"
            echo "::error::max(0, 2 - 0.01 x supply), which is EXACTLY ZERO"
            echo "::error::at the 300 bullets both sides start with."
            exit 1; }
          test "${water}" -ge 200 || {
            echo "::error::only ${water} water actions in the whole episode."
            echo "::error::A bullet tree WITHERS at 0.5 health a round once"
            echo "::error::it matures, so a farm nobody waters is a farm"
            echo "::error::that dies. RAISE maxRounds until it fires; do NOT"
            echo "::error::drop this."
            exit 1; }
          test "${income}" -ge 3000 || {
            echo "::error::${income} tenths of a bullet were earned from"
            echo "::error::trees in the whole episode. A mature tree pays"
            echo "::error::health/50 a round -- 1 a round at full health --"
            echo "::error::and 900 rounds is eleven times the 81-round"
            echo "::error::maturity clock."
            exit 1; }
          test "${shakes}" -ge 5 || {
            echo "::error::not one neutral tree was shaken. HouseDivided"
            echo "::error::carries 41 of them and every one holds bullets;"
            echo "::error::shake() is free and works for ANY robot."
            exit 1; }
          test "${fired}" -ge 20 || {
            echo "::error::only ${fired} bullets were fired in the whole"
            echo "::error::episode. On HouseDivided the two archons start"
            echo "::error::6.5 apart, so first blood lands inside twenty"
            echo "::error::rounds. RAISE maxRounds until it fires; do NOT"
            echo "::error::drop this."
            exit 1; }
          test "${strikes}" -ge 10 || {
            echo "::error::not one lumberjack strike landed in the whole"
            echo "::error::episode. A strike is this year's only area"
            echo "::error::attack and it damages TREES as well as robots."
            exit 1; }

      # THE PACING NUMBER phase 60 sizes its check-8 dispatch from, and the
      # number that decided this year's own `--timeout 120 --soak 15`
      # (docs/RULES-BC17.md, "Playback pacing, measured"). bc17 is 3000
      # ROUNDS like bc16, and a 100 % seek re-simulates the whole of it in
      # the Worker.
      - name: Print the bc17 episode's simulated seconds per round
        run: |
          set -euo pipefail
          jq -r '"bc17 smoke: sim_seconds=\(.result.sim_seconds) " +
                 "rounds=\(.result.games[0].rounds_played) " +
                 "wall=\(.result.wall_clock_seconds)s"' \
            dist/smoke/replay-bc17.json

      # THE PACING NUMBER the next year module sizes its own probe from, and
      # the number that decided this year's own `--timeout 120 --soak 15`
      # (docs/RULES-BC16.md, "Playback pacing, measured").
      - name: Print the bc16 episode's simulated seconds per round
        run: |
          set -euo pipefail
          jq -r '"bc16 smoke: sim_seconds=\(.result.sim_seconds) " +
                 "rounds=\(.result.games[0].rounds_played) " +
                 "wall=\(.result.wall_clock_seconds)s"' \
            dist/smoke/replay-bc16.json

      # THE PACING NUMBER the next year module sizes its own probe from, and
      # the number that decided this year's own `--timeout 120 --soak 15`
      # (docs/RULES-BC22.md, "Playback pacing, measured").
      - name: Print the bc22 episode's simulated seconds per round
        run: |
          set -euo pipefail
          jq -r '"bc22 smoke: sim_seconds=\(.result.sim_seconds) " +
                 "rounds=\(.result.games[0].rounds_played) " +
                 "wall=\(.result.wall_clock_seconds)s"' \
            dist/smoke/replay-bc22.json

      - name: All TEN smoke replays are present and are different years
        run: |
          set -euo pipefail
          for f in dist/smoke/replay.json dist/smoke/replay-bc20.json \
                   dist/smoke/replay-bc21.json dist/smoke/replay-bc24.json \
                   dist/smoke/replay-bc25.json dist/smoke/replay-bc23.json \
                   dist/smoke/replay-bc22.json dist/smoke/replay-bc16.json \
                   dist/smoke/replay-bc19.json dist/smoke/replay-bc17.json; do
            test -s "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          y26="$(jq -r .year dist/smoke/replay.json)"
          y20="$(jq -r .year dist/smoke/replay-bc20.json)"
          y21="$(jq -r .year dist/smoke/replay-bc21.json)"
          y24="$(jq -r .year dist/smoke/replay-bc24.json)"
          y25="$(jq -r .year dist/smoke/replay-bc25.json)"
          y23="$(jq -r .year dist/smoke/replay-bc23.json)"
          y22="$(jq -r .year dist/smoke/replay-bc22.json)"
          y16="$(jq -r .year dist/smoke/replay-bc16.json)"
          y19="$(jq -r .year dist/smoke/replay-bc19.json)"
          y17="$(jq -r .year dist/smoke/replay-bc17.json)"
          echo "replay.json year=$y26  bc20=$y20  bc21=$y21  bc24=$y24" \
               "bc25=$y25  bc23=$y23  bc22=$y22  bc16=$y16  bc19=$y19" \
               "bc17=$y17"
          test "$y26" = "bc26" || { echo "::error::replay.json is not bc26"; exit 1; }
          test "$y20" = "bc20" || { echo "::error::replay-bc20.json is not bc20"; exit 1; }
          test "$y21" = "bc21" || { echo "::error::replay-bc21.json is not bc21"; exit 1; }
          test "$y24" = "bc24" || { echo "::error::replay-bc24.json is not bc24"; exit 1; }
          test "$y25" = "bc25" || { echo "::error::replay-bc25.json is not bc25"; exit 1; }
          test "$y23" = "bc23" || { echo "::error::replay-bc23.json is not bc23"; exit 1; }
          test "$y22" = "bc22" || { echo "::error::replay-bc22.json is not bc22"; exit 1; }
          test "$y16" = "bc16" || { echo "::error::replay-bc16.json is not bc16"; exit 1; }
          test "$y19" = "bc19" || { echo "::error::replay-bc19.json is not bc19"; exit 1; }
          test "$y17" = "bc17" || { echo "::error::replay-bc17.json is not bc17"; exit 1; }
          if [ "$(printf '%s\n' "$y26" "$y20" "$y21" "$y24" "$y25" "$y23" \
                  "$y22" "$y16" "$y19" "$y17" | sort -u | wc -l)" -ne 10 ]; then
            echo "::error::the ten smoke replays are not ten different years"
            exit 1
          fi

      # The replay this episode produced is the ONLY replay in CI that is
      # known to be a real, current-format episode of this game. wasm-viewer
      # downloads it and loads it in a browser, so the viewer is tested
      # against the bytes the platform will actually serve rather than a
      # hand-written fixture that can drift.
      - name: Upload the smoke replay
        uses: actions/upload-artifact@v4
        with:
          name: smoke-replay
          path: dist/smoke/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # The static replay viewer. The platform serves THIS bundle from
  # /v2/coworlds/replays/static/<cow_id>/<sha>/index.html, so a bundle that
  # does not build (or is missing its wasm) means every hosted replay hangs.
  # tools/build_replay_viewer.sh falls back to the pinned emscripten/emsdk
  # container (Dockerfile.replay-viewer) because the runner has no emcc.
  # ---------------------------------------------------------------------
  wasm-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The bundle is EXECUTED here, not merely built, and it is executed against
    # the replay docker-smoke just produced -- hence the dependency.
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # `coworld build` (bundle.py) refuses to package a source replay-viewer
      # bundle unless the hook is BOTH a file and os.X_OK:
      #   "Coworld builds with a source replay viewer bundle require an
      #    executable build hook".
      # Running it as `bash tools/build_replay_viewer.sh` would ignore the exec
      # bit entirely, so a mode-0644 hook passed CI and only blew up later, in
      # coworld-release.yml's "Build the Coworld manifest". Assert the bit, then
      # invoke by path so CI exercises exactly what `coworld build` requires.
      - name: Assert the replay-viewer build hook is present and executable
        run: |
          set -euo pipefail
          test -f tools/build_replay_viewer.sh || {
            echo "::error::tools/build_replay_viewer.sh is missing; coworld build needs it"
            echo "::error::to emit the static replay bundle"
            exit 1; }
          test -x tools/build_replay_viewer.sh || {
            echo "::error::tools/build_replay_viewer.sh must be committed executable (mode 100755):"
            echo "::error::coworld build hard-requires os.X_OK on the build hook."
            echo "::error::Fix with: git update-index --chmod=+x tools/build_replay_viewer.sh"
            exit 1; }

      - name: Assert the viewer load test is present
        run: |
          set -euo pipefail
          test -s tools/ci/viewer_smoke.mjs || {
            echo "::error::tools/ci/viewer_smoke.mjs is missing. It is the only gate that"
            echo "::error::EXECUTES the replay viewer; without it a bundle that deadlocks"
            echo "::error::(cogame-lantern, 2026-08-23) ships green. Copy it from"
            echo "::error::coworld-builder templates/tools/ci/viewer_smoke.mjs."
            exit 1; }

      - name: Build the static replay viewer bundle
        run: ./tools/build_replay_viewer.sh "$PWD/dist/static-replay-viewer"

      - name: Assert the bundle is complete
        run: |
          set -euo pipefail
          out="$PWD/dist/static-replay-viewer"
          test -s "${out}/index.html" || {
            echo "::error::${out}/index.html missing or empty"; exit 1; }
          wasm_count="$(find "${out}" -name '*.wasm' -size +1c | wc -l | tr -d ' ')"
          if [ "${wasm_count}" -lt 1 ]; then
            echo "::error::no non-empty .wasm module in ${out}"
            find "${out}" -type f | sed 's/^/  /'
            exit 1
          fi
          echo "bundle OK:"
          find "${out}" -type f -printf '  %p (%s bytes)\n'

      # -----------------------------------------------------------------
      # The load test. Everything above only proves files EXIST. cogame-lantern
      # shipped a viewer whose emscripten link flags (MODULARIZE / EXPORT_NAME)
      # and whose JS bootstrap came from two different starters: the factory was
      # never called, no error was thrown, and softmax.com sat on
      # "Loading replay..." forever with every file present and 200. Only
      # opening the page in a browser sees that.
      #
      # Playwright is pinned to 1.55.0 in BOTH places -- the npm module and the
      # browser download. Bump them together or the browser 404s.
      # -----------------------------------------------------------------
      - name: Download the smoke replay
        uses: actions/download-artifact@v4
        with:
          name: smoke-replay
          path: dist/smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright (pinned 1.55.0)
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Load the bundle in a real browser (ALL TEN years' replays)
        run: |
          set -euo pipefail
          # A for-loop, not `ls … | head -1`: under `set -o pipefail` an unmatched
          # glob makes ls exit 2 and kills the step before the harness ever runs
          # (cogame-raid 2026-08-23, run 32623414696).
          replays=""
          for candidate in dist/smoke/replay.json dist/smoke/replay-bc20.json \
                           dist/smoke/replay-bc21.json \
                           dist/smoke/replay-bc24.json \
                           dist/smoke/replay-bc25.json \
                           dist/smoke/replay-bc23.json \
                           dist/smoke/replay-bc22.json \
                           dist/smoke/replay-bc16.json \
                           dist/smoke/replay-bc19.json \
                           dist/smoke/replay-bc17.json; do
            if [ -f "${candidate}" ]; then replays="${replays} ${candidate}"; fi
          done
          test -n "${replays}" || {
            echo "::error::docker-smoke uploaded no replay to dist/smoke"; ls -la dist/smoke || true; exit 1; }
          # The bundle is EXECUTED once per replay: one year rendering is no
          # evidence at all about the other, and the bc20 game block is a
          # different set of elements under different CSS.
          for replay in ${replays}; do
          echo "loading ${replay} in dist/static-replay-viewer"
          # --strict-text-bounds is DELIBERATELY DROPPED here. The board is
          # pannable and zoomable (#viewpanel is kept, because a 60x60 board
          # renders 960 px wide against a 360 px featured-match frame), which
          # is the exact case the flag's own documentation excludes. The
          # canvas_text counts are still recorded in viewer-smoke.json, and
          # the renderer-fixture step below runs full-cap notes and mottos
          # through the same harness in its place -- a CI replay is always
          # scripted and carries no LLM text (the cogchemists 2026-08-24
          # scar).
          # --killfeed-overlap is the bc21 addition: #killfeed is anchored in
          # board-scaled units and the year stat boxes in pixels off the
          # transport band, so at FIT zoom on a small board the feed used to
          # overdraw them (bc20 judge, advisory). The fix is a fourth :root
          # variable, --statrail; this gate measures CLIENT RECTS at 360 px,
          # 720 px and 1280 px and at both FIT and 2x zoom, on EVERY year's
          # replay -- which is what makes it a repair of the shared chrome
          # rather than a bc21 workaround.
          # bc24 GETS A LONGER LEASH, and for a measured reason: a seek
          # re-simulates from the start of the game in the Worker, and bc24 is
          # 2000 rounds x 100 duck-turns. bc21 taught this the expensive way --
          # a compute-heavy year defeats a fixed-wait scrub probe and the
          # instrument, not the viewer, is what times out
          # (docs/RULES-BC24.md, Measured performance).
          # bc25 GETS THE SAME LONGER LEASH AS bc24, and for the same
          # measured reason: a seek re-simulates from the start of the game in
          # the Worker, and bc25 is 2000 rounds over a growing unit population
          # and a whole-map paint array (docs/RULES-BC25.md, "What this year
          # measures"). Decided here rather than discovered at phase 60.
          # bc23 GETS THE SAME LONGER LEASH, and it is the year that needs
          # it most: it is THE HEAVIEST YEAR MODULE IN THIS REPO. Measured in
          # phase 20, a full 2000-round game on the pool's largest map costs
          # 1.45-2.95 ms/round with 207-451 robots alive at the end, and the
          # measured Java mirror carries 121-157 robots against bc25's 26-29
          # (docs/RULES-BC23.md, "What this year measures"). Decided here
          # rather than discovered at phase 60.
          # bc22 GETS THE SAME LONGER LEASH, and it is decided here rather
          # than discovered at phase 60. The measured Java mirror carries
          # 85-135 robots on the board on average with peaks of 108-204 on
          # the pool's map sizes (349 on 60x60) -- between bc25's 26-29 and
          # bc23's 121-157 -- and the Worker re-simulates from the start of
          # the game on every seek (docs/RULES-BC22.md, "Playback pacing,
          # measured"). The phase-60 check-8 dispatch for bc22 uses
          # `settle=20000 soak=15` for the same reason.
          # bc16 GETS THE SAME LONGER LEASH, and it is the most exposed
          # year this repository has: it is 3000 ROUNDS, 50 % LONGER THAN ANY
          # OTHER YEAR, so a 100 % seek re-simulates the whole of it in the
          # Worker. Measured in phase 20 the sim itself is fast -- 0.45 to
          # 1.6 ms a round, and 2.2 s for a whole 3000-round mirror on
          # `river` -- but the round COUNT is what the fixed-wait scrub probe
          # sees (docs/RULES-BC16.md, "Playback pacing, measured"), and the
          # phase-60 check-8 dispatch for bc16 uses `settle=20000 soak=15`
          # for exactly the same reason. Decided here rather than discovered
          # at phase 60.
          # bc17 GETS THE SAME LONGER LEASH, and for the same measured
          # reason as bc16: it is 3000 ROUNDS, and a 100 % seek re-simulates
          # the whole of it in the Worker. It is also the only
          # CONTINUOUS-SPACE year here -- every body is a circle with a
          # float32 centre and every bullet is a moving point resolved
          # against every disc within reach -- so its per-round cost is the
          # highest in the repository on the tree-heavy boards
          # (docs/RULES-BC17.md, "Playback pacing, measured"). The phase-60
          # check-8 dispatch for bc17 uses `settle=20000 soak=15` for the
          # same reason. Decided here rather than discovered at phase 60.
          if [ "${replay}" = "dist/smoke/replay-bc24.json" ] || \
             [ "${replay}" = "dist/smoke/replay-bc25.json" ] || \
             [ "${replay}" = "dist/smoke/replay-bc22.json" ] || \
             [ "${replay}" = "dist/smoke/replay-bc16.json" ] || \
             [ "${replay}" = "dist/smoke/replay-bc17.json" ] || \
             [ "${replay}" = "dist/smoke/replay-bc23.json" ]; then
            node tools/ci/viewer_smoke.mjs \
              --bundle dist/static-replay-viewer \
              --replay "${replay}" \
              --timeout 120 --soak 15 \
              --killfeed-overlap
          else
            node tools/ci/viewer_smoke.mjs \
              --bundle dist/static-replay-viewer \
              --replay "${replay}" \
              --timeout 90 \
              --soak 10 \
              --killfeed-overlap
          fi
          # The scrub readouts have to come from the SCRUBBER. This page keeps
          # #viewpanel, whose zoom slider is an input[type=range] ABOVE #scrub
          # in the document; a comma-list selector resolves in document order,
          # so the gate used to click the zoom bar and never seek at all while
          # free-running playback supplied three differing clocks.
          selector="$(jq -r '.scrub_selector // "none"' viewer-smoke.json)"
          echo "scrub selector: ${selector}"
          if [ "${selector}" != "#scrub" ]; then
            echo "::error::the scrub gate clicked '${selector}', not #scrub --"
            echo "::error::no seek was exercised. See tools/ci/viewer_smoke.mjs"
            echo "::error::SCRUB_SELECTORS."
            exit 1
          fi
          # THE SCORE SCREEN IS ACTUALLY SHOWN. Seeking to 100 % runs the
          # replay off the end, which is the one state that raises #endcard.
          # The card was being raised with a class the stylesheet does not
          # style, so it was filled in and left at display:none for the whole
          # replay; nothing in CI saw it, because nothing in CI ever reached
          # the end of a replay (r1-B1). This reads the computed display.
          shown="$(jq -r '[.scrub[] | select(.at == "100%")] | last | .endcard.shown' viewer-smoke.json)"
          card="$(jq -r '[.scrub[] | select(.at == "100%")] | last | .endcard.text' viewer-smoke.json)"
          echo "endcard after the 100% seek: shown=${shown} text=${card}"
          if [ "${shown}" != "true" ]; then
            echo "::error::#endcard is not displayed after seeking to the end"
            echo "::error::(computed display: $(jq -r '[.scrub[] | select(.at == "100%")] | last | .endcard.display' viewer-smoke.json))."
            echo "::error::The score screen is drawn into the DOM and never seen."
            exit 1
          fi
          if ! printf '%s' "${card}" | grep -qi 'clan'; then
            echo "::error::#endcard is displayed but carries no clan line: ${card}"
            exit 1
          fi
          # THE BOARD IS THE PICTURE. The featured match on softmax.com showed
          # the doctrine card lying over the rats in two live screenshots a
          # minute apart (r2-D3): a panel that opens over the board and never
          # closes makes a working replay look like a dead one. The harness
          # measures the largest visible absolute/fixed element covering the
          # board canvas; after the soak -- playback advancing, t > 0 -- no
          # panel may hold more than half of it. The endcard is exempt only
          # where it belongs, at the 100 % seek, which is checked above.
          obscured_id="$(jq -r '.soak.obscured.id // .obscured.id // "none"' viewer-smoke.json)"
          obscured_pct="$(jq -r '.soak.obscured.pct // .obscured.pct // 0' viewer-smoke.json)"
          echo "largest overlay over the board after the soak: ${obscured_id} ${obscured_pct}%"
          if [ "${obscured_pct}" -gt 50 ]; then
            echo "::error::'${obscured_id}' covers ${obscured_pct}% of the board"
            echo "::error::while playback is advancing. The rats are the picture;"
            echo "::error::a panel that opens over them must dismiss itself."
            exit 1
          fi
          mv viewer-smoke.json "viewer-smoke-$(basename "${replay}" .json).json"
          mv viewer-smoke.png "viewer-smoke-$(basename "${replay}" .json).png"
          done

      # The wasm module itself, under node: wasm32-only failures (int overflow
      # traps, address-space exhaustion) are invisible to the native tests --
      # and a brand-new year module is exactly where one would live.
      - name: Smoke the emitted wasm module under node (all ten years)
        run: |
          set -euo pipefail
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc20.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc21.json"
          # And against the COMMITTED bc20 fixture (design note §Tests item
          # 17): bytes recorded at a known GameVersion, not bytes this run
          # produced. tests/test_bc20_replay.nim proves the same file
          # re-derives natively, so a divergence here is wasm32's alone.
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc20.json"
          # And the COMMITTED bc21 fixture, for the same reason.
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc21.json"
          # bc24: the smoke episode this run produced, and the COMMITTED bc24
          # fixture. A brand-new year module is exactly where a wasm32-only
          # failure would live.
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc24.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc24.json"
          # bc25: the smoke episode this run produced, and the COMMITTED bc25
          # fixture, for exactly the same reason.
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc25.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc25.json"
          # bc23: the smoke episode this run produced, and the COMMITTED bc23
          # fixture -- which is the one that carries ALL TWELVE beat kinds
          # (tests/test_bc23_beats.nim asserts emission, label and style
          # against exactly these bytes).
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc23.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc23.json"
          # bc22: the smoke episode this run produced, and the COMMITTED bc22
          # fixture -- which is the one that carries ALL FOURTEEN beat kinds
          # (tests/test_bc22_beats.nim asserts emission, label and style
          # against exactly these bytes).
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc22.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc22.json"
          # bc16: the smoke episode this run produced, and the COMMITTED bc16
          # fixture -- which is the one that carries ALL THIRTEEN beat kinds
          # (tests/test_bc16_beats.nim asserts emission, label and style
          # against exactly these bytes). At 2871 rounds over three games it
          # is the longest recording in this repository, so it is also the
          # year most likely to find a wasm32 address-space failure. NOTE that
          # this smoke steps 200 FRAMES, so its `mismatch_round: -1` covers
          # the first 200 rounds only -- the WHOLE-recording re-derivation is
          # asserted by tests/test_bc16_replay.nim (r1-F7).
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc16.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc16.json"
          # bc19: the smoke episode this run produced, and the COMMITTED bc19
          # fixture -- which is the one that carries ELEVEN OF THE TWELVE
          # beat kinds (tests/test_bc19_beats.nim asserts emission, label and
          # style against exactly these bytes, and records why `famine` is
          # the twelfth: the strong chassis never asks for what it cannot
          # pay). bc19 is the FIRST YEAR IN THIS REPOSITORY WHOSE ENGINE IS
          # JAVASCRIPT, so its arithmetic came through a different reader
          # than every other year's -- and its whole state is robot state
          # re-derived from events, including the 624-word MT19937 generator,
          # which is exactly the kind of thing wasm32's 32-bit `int` breaks
          # (the bc22 `mixHashU` lesson). NOTE that this smoke steps 200
          # FRAMES, so its `mismatch_round: -1` covers the first 200 rounds
          # only -- the WHOLE-recording re-derivation is asserted by
          # tests/test_bc19_replay.nim.
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc19.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc19.json"
          # bc17: the smoke episode this run produced, and the COMMITTED
          # bc17 fixture -- which carries TWELVE OF THE THIRTEEN beat kinds
          # (tests/test_bc17_beats.nim asserts emission, label and style
          # against exactly these bytes, and records why `rout` is the
          # thirteenth: four robots of one side never die in one round).
          # bc17 IS THE ONLY CONTINUOUS-SPACE YEAR IN THIS REPOSITORY: every
          # coordinate, radius, health and bullet speed is a FLOAT32, and
          # every transcendental goes through the fdlibm port in
          # src/battlecode/fdlibm.nim rather than the platform libm --
          # precisely because glibc's `sin` and emscripten's are not the
          # same function. A wasm32 divergence in ANY of that shows up here
          # as a hash-chain mismatch and nowhere else. NOTE that this smoke
          # steps 200 FRAMES, so its `mismatch_round: -1` covers the first
          # 200 rounds only -- the WHOLE-recording re-derivation is asserted
          # by tests/test_bc17_replay.nim (r1-F1), which also compares the
          # deriver's per-tick state against the recorder's frame by frame.
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/dist/smoke/replay-bc17.json"
          node tools/wasm_replay_smoke.cjs dist/static-replay-viewer \
            "${{ github.workspace }}/tests/fixtures/replay-bc17.json"

      # The text the CI replay never carries. Every replay CI produces is
      # SCRIPTED, so its notes and motto are the short strings baselines.nim
      # emits; a hosted episode carries whatever an LLM wrote, up to the full
      # rune caps. The fixture lays both seats out at those caps, in THE
      # PAGE'S OWN CSS -- extracted from client/replay_broadcast.html right
      # here, never copied into the fixture, because a fixture with private
      # rules is green about itself and says nothing about the page -- at
      # three widths including the 360 px featured-match frame, and fails if
      # any readout escapes its frame or hides its own text. It is driven by
      # the same harness as the bundle, with --strict-text-bounds, and it is
      # SERVED rather than opened from disk (the fixture reads its own
      # iframes; file:// documents are opaque origins).
      - name: Render the full-cap doctrine-text fixture
        run: |
          set -euo pipefail
          mkdir -p dist/fixture
          cp tools/ci/renderer_fixture.html dist/fixture/
          python3 - <<'PY'
          import pathlib, re
          page = pathlib.Path("client/replay_broadcast.html").read_text()
          styles = re.findall(r"<style>(.*?)</style>", page, re.S)
          if not styles:
              raise SystemExit("::error::no <style> block in client/replay_broadcast.html")
          pathlib.Path("dist/fixture/page_styles.css").write_text("\n".join(styles))
          print(f"page_styles.css: {sum(len(s) for s in styles)} bytes from "
                f"{len(styles)} <style> block(s)")
          PY
          python3 -m http.server 8099 --directory dist/fixture >/dev/null 2>&1 &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:8099/renderer_fixture.html" >/dev/null 2>&1 && break
            sleep 0.2
          done
          node tools/ci/viewer_smoke.mjs \
            --url "http://127.0.0.1:8099/renderer_fixture.html" \
            --timeout 60 \
            --strict-text-bounds \
            --out dist/fixture

      - name: Upload the viewer smoke evidence
        # Always: the screenshot and the JSON are most useful when the job is red.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke
          path: |
            viewer-smoke*.png
            viewer-smoke*.json
            dist/fixture/viewer-smoke.png
            dist/fixture/viewer-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: static-replay-viewer
          path: dist/static-replay-viewer
          if-no-files-found: error
          retention-days: 14
