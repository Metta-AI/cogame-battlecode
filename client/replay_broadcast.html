   smaller scale (glory is the season's secondary score, same relationship
   as the topbar's .glory-line to .lives-line). Both start hidden and only
   appear once JS confirms the frame actually carries the field — an
   endcard from a pre-GLORY-port replay renders byte-for-byte unchanged. */
#endcard .ec-glory { display: none; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); margin-top: calc(2 * var(--u)); }
#endcard .ec-team.has-glory .ec-glory { display: flex; }
#endcard .ec-glory .fl-num { font-size: calc(15 * var(--u)); color: var(--amber); }
#endcard .ec-ach {
  display: none;
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.04em;
  color: var(--paper-dim);
  margin-top: calc(2 * var(--u));
}
#endcard .ec-team.has-ach .ec-ach { display: block; }
#endcard .ec-ach .ec-ach-bonus { color: var(--amber); }
/* mixed-team policy subheader: groups a team panel's rows by policy when a
   team seats more than one (CTF-Doubles: two policies per side) */
#endcard .ec-pol {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  /* CTF: Player K D TK Clstr Cap — six tracks, slimmed so the extra TK
     column still leaves the name a readable share of the fixed panel */
  grid-template-columns: 1fr calc(18 * var(--u)) calc(18 * var(--u)) calc(18 * var(--u)) calc(24 * var(--u)) calc(24 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
/* paintball keeps its four-column layout (Cog Tags Out Paint) */
#endcard.pb .ec-thead,
#endcard.pb .ec-row {
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u));
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(242, 232, 216, 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
/* team kills are a shame stat: the count reads in the killfeed's team-kill

#endcard .ec-row .n.tk { color: var(--red); }

#endcard .ec-row .n.cap {
  color: var(--amber);
  display: flex;
  justify-content: center;
  align-items: center;
}
#endcard .ec-row .n.cap > * + * { margin-left: calc(-7 * var(--u)); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }

#endcard .ec-row .pcell {

  align-items: center;

  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {

/* a team without baked heart art gets a tinted glyph instead (fallback) */
#endcard .ec-heart-glyph {
  color: var(--tc, var(--amber));
  font-size: calc(12 * var(--u));
  line-height: 1;
}
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE BOT LOCKER ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four cogs prepping their paintball markers
   in a lamp-lit locker room. The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num,
  .plate.leader .glory-num,
  .heat-flame.heat-blazing { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }

/* Opt-OUT of the #viewpanel overlay (zoom bar + minimap) by param only:
   ?viewpanel=0 sets body[data-noviewpanel]. Defaults are unchanged everywhere
   — the League Replayer shell loads the board with ?embed=1 and KEEPS zoom +
   minimap (that's why #271 blanket-hiding the panel in all embeds was reverted
   in #272). Only surfaces that explicitly ask — billboards (Lobby hero) and
   thumbnail capture — append &viewpanel=0 to drop the panel. Independent of
   embed: the two params don't touch each other. */
body[data-noviewpanel] #viewpanel { display: none !important; }

/* ========================================================================
   BATTLECODE additions to the inherited coworld-ctf chrome
   ------------------------------------------------------------------------
   Everything above this banner is paintbot's replay_broadcast.html verbatim.
   Only the elements docs/plans/2026-09-03-battlecode-design.md §Viewer lists
   as removed are gone (#fpv*, #lockerroom/#lk-*, the vote/huddle acts,
   #gloryPops, #commsdock/#commsFeed/#commsLive, #lulls and the momentum
   label, and the battle-royale #cell-* plates). #viewpanel is KEPT: a 60x60
   board renders 960 px wide against a 360 px featured-match frame, which is
   exactly the case the zoom bar and minimap exist for.
   #momentum stays in the DOM (hidden): chrome_common.js's renderMomentum
   writes to it unconditionally and would throw on a missing node.
   ======================================================================== */
#momentum { display: none; }

#scorebug .plate { display: flex; align-items: center; gap: 6px; }
#scorebug .plate-name { flex: 1 1 auto; min-width: 3.2em; }
#scorebug .plate-sub { opacity: .72; font-size: 11px; }
#scorebug .plate-pts { font-variant-numeric: tabular-nums; font-weight: 700; }
#scorebug .plate.ash { border-left: 3px solid var(--ash); }
#scorebug .plate.basil { border-right: 3px solid var(--basil); }
:root { --ash: #e8a33d; --basil: #b06fd0; }

#coopchip {
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  padding: 2px 10px; border-radius: 999px; font-size: 11px; letter-spacing: .12em;
  background: rgba(11,7,4,.72); color: #45a85e; border: 1px solid #45a85e;
  z-index: 6; white-space: nowrap;
}
#coopchip.backstab { color: #e0523a; border-color: #e0523a; }

#bars { display: flex; gap: 10px; justify-content: center; margin-top: 2px; }
#bars .barset { display: flex; flex-direction: column; gap: 2px; min-width: 64px; }
#bars .bar { height: 4px; border-radius: 2px; background: rgba(242,232,216,.14); }
#bars .bar > i { display: block; height: 100%; border-radius: 2px; }
#bars .bar.cat > i { background: #e0523a; }
#bars .bar.kings > i { background: #ddc531; }
#bars .bar.cheese > i { background: #e8a33d; }

#econ {
  position: absolute; right: 8px; bottom: calc(var(--band, 0px) + 8px);
  display: grid; grid-template-columns: auto auto auto; gap: 1px 8px;
  font-size: 10px; color: #cbbfae; background: rgba(11,7,4,.6);

/* THE BOARD IS THE PICTURE (r2-D3). Both doctrines are worth reading before
   the war starts, and worth nothing at all if they are still lying over the
   rats a minute later: two live screenshots of the featured match, a minute
   apart, were both of this panel. It opens with the replay, it CLOSES ITSELF
   the moment playback advances, and its own header re-opens it. Its body is
   capped and scrolls, so even opened by hand over a 360 px frame it can never
   take more than a third of the board. */

  position: absolute; left: 8px; bottom: calc(var(--band, 0px) + 8px);

    <div id="scorebug">

    <div id="viewpanel">

<script>
(function () {
  'use strict';

  var api = null;                    // {C, send, seek, dismissEndcard}
  var beatsBuilt = false;
  var beatEls = [];
  var dismissed = false;
  var pinned = false;                // the viewer opened it themselves
  var lastFrame = -1;
  var feedShown = {};

  function $(id) { return document.getElementById(id); }
  function esc(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---- the dismissible doctrine overlay (D3) ---------------------------
  function setDoctrinesOpen(open) {
    dismissed = !open;
    var panel = $('bc20-doctrines');
    var chip = $('bc20-doctrines-toggle');
    if (panel) panel.classList.toggle('dismissed', dismissed);
    if (chip) chip.hidden = !dismissed;
  }

  function wireDoctrines() {
    var close = $('bc20-doctrines-close');
    if (close) {
      close.addEventListener('click', function (event) {
        event.stopPropagation();
        pinned = false;
        setDoctrinesOpen(false);
      });
    }
    var chip = $('bc20-doctrines-toggle');
    if (chip) {
      chip.addEventListener('click', function (event) {
        event.stopPropagation();
        // A panel the viewer opened by hand STAYS open -- that is their
        // choice, not a lid the page left on the board.
        pinned = true;
        setDoctrinesOpen(true);
      });
    }
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape' && event.key !== 'Esc') return;
      if (document.documentElement.getAttribute('data-year') !== 'bc20') return;
      pinned = false;
      setDoctrinesOpen(false);
    });
    // The viewer who never presses play still gets the board back.
    setTimeout(function () {
      if (!pinned) setDoctrinesOpen(false);
    }, 6000);
  }

  // ---- beats ------------------------------------------------------------
  function buildBc20BeatButtons(s) {
    if (beatsBuilt || !s.beats || !s.beats.length) return;
    beatsBuilt = true;
    var scrub = $('scrub');
    var span = Math.max(1, (s.mx || 1) - (s.st || 0));
    s.beats.forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'beat-marker ' + (b.k || 'game');
      el.style.left =
        (Math.min(1, Math.max(0, (b.t - (s.st || 0)) / span)) * 100) + '%';
      el.setAttribute('aria-label', b.label || b.k);
      el.title = b.label || b.k;
      el.__tick = b.t;
      el.addEventListener('click', function (event) {
        event.stopPropagation();
        if (api) api.seek(b.t / span);
      });
      scrub.appendChild(el);
      beatEls.push(el);
    });
  }

  function applyBc20BeatSpoilers(s) {
    if (!api || !beatEls.length) return;
    var spoilers = api.C.getSpoilers();
    beatEls.forEach(function (el) {
      var hide = !spoilers && el.__tick > s.t;
      if (el.__hidden !== hide) {
        el.__hidden = hide;
        el.style.display = hide ? 'none' : '';
      }
    });
  }

  // ---- readouts ---------------------------------------------------------
  function renderFlood(s) {
    var f = s.bc20_flood || {};
    var host = $('bc20-flood');
    if (!host) return;
    var water = Number(f.water || 0);
    var tiles = Math.max(1, Number(f.tiles || 1));
    var pct = Math.round((Number(f.flooded || 0) / tiles) * 100);
    var elev = f.hq_elevation || [-1, -1];
    var danger = false;
    for (var i = 0; i < 2; i++) {
      if (elev[i] >= 0 && water >= elev[i] - 1) danger = true;
    }
    host.classList.toggle('rising', danger);
    host.innerHTML =
      '<span class="lbl">WATER</span> <b>' + water.toFixed(2) + '</b>' +
      '<span class="gauge"><i style="width:' + pct + '%"></i></span>' +
      '<span>' + pct + '% flooded</span>' +
      '<span class="hqelev">' + esc(s.aliases[0]) + ' HQ elev ' + elev[0] +
        '</span>' +
      '<span class="hqelev">' + esc(s.aliases[1]) + ' HQ elev ' + elev[1] +
        '</span>';
  }

  function renderSoup(s) {
    var rows = s.bc20_soup || [{}, {}];
    var host = $('bc20-soup');
    if (!host) return;
    var html = '<span></span><span>' + esc(s.aliases[0]) + '</span><span>' +
      esc(s.aliases[1]) + '</span>';
    [['pool', 'soup'], ['mined', 'mined'], ['refined', 'refined']]
      .forEach(function (row) {
        html += '<span>' + row[1] + '</span><b>' + (rows[0][row[0]] || 0) +
          '</b><b>' + (rows[1][row[0]] || 0) + '</b>';
      });
    host.innerHTML = html;
  }

  var UNIT_ROWS = [
    ['miner', 'Mi'], ['landscaper', 'La'], ['drone', 'Dr'],
    ['vaporator', 'Va'], ['net_gun', 'NG'], ['design_school', 'DS'],
    ['fulfillment_center', 'FC']
  ];

  function renderUnits(s) {
    var rows = s.bc20_units || [{}, {}];
    var host = $('bc20-units');
    if (!host) return;
    var html = '';
    for (var slot = 0; slot < 2; slot++) {
      var u = rows[slot] || {};
      var line = [];
      UNIT_ROWS.forEach(function (r) {
        line.push(r[1] + ' <b>' + (u[r[0]] || 0) + '</b>');
      });
      html += '<div>' + esc(s.aliases[slot]) + ' ' + line.join(' ') +
        ' <span class="hqdirt">dirt ' + (u.hq_dirt || 0) + '/' +
        (u.hq_dirt_limit || 50) + '</span></div>';
    }
    host.innerHTML = html;
  }

  function renderDoctrines(s) {
    var host = $('bc20-doctrines-body');
    if (!host) return;
    var html = '';
    (s.doctrines || []).forEach(function (d, slot) {
      html += '<div class="dline"><span class="dname">' +
        esc(s.aliases[slot]) + '</span> ' + esc(d.name || '') + ' — ' +
        esc((d.words || []).join(', ')) +
        (d.fallback ? ' <span class="dfall">[fallback: ' +
          esc(d.fallback) + ']</span>' : '') +
        (d.notes ? '<br><i>' + esc(d.notes) + '</i>' : '') + '</div>';
    });
    host.innerHTML = html;
  }

  function renderFeed(s) {
    var feed = $('killfeed');
    if (!feed || !s.beats) return;
    s.beats.forEach(function (b) {
      var key = b.t + '|' + b.k + '|' + b.label;
      if (feedShown[key] || b.t > s.t) return;
      feedShown[key] = true;
      var row = document.createElement('div');
      row.className = 'kf-row ' + b.k;
      row.textContent = b.label;
      feed.appendChild(row);
      while (feed.childNodes.length > 8) feed.removeChild(feed.firstChild);
    });
  }

  function renderChain(s) {
    var host = $('bc20-chain');
    var c = s.bc20_chain;
    if (!host || !c) return;
    var html = '<b>blockchain</b> — ' +
      esc(s.aliases[0]) + ' ' + (c.minted || [0, 0])[0] + ' minted, ' +
      (c.soup_spent || [0, 0])[0] + ' soup · ' +
      esc(s.aliases[1]) + ' ' + (c.minted || [0, 0])[1] + ' minted, ' +
      (c.soup_spent || [0, 0])[1] + ' soup';
    var top = c.top_fee || [0, 0];
    var topRound = c.top_fee_round || [-1, -1];
    for (var i = 0; i < 2; i++) {
      if (top[i] > 0) {
        html += '<br>' + esc(s.aliases[i]) + '\u2019s top fee ' + top[i] +
          ' bought round ' + topRound[i];
      }
    }
    (c.recent || []).forEach(function (m) {
      html += '<br><span class="msg">' + esc(m.alias) + ', round ' +
        m.round + ' — ' + esc(m.words) + '</span>';
    });
    host.innerHTML = html;
  }

  function renderEndcardExtras(s) {
    if (s.ph !== 'gameover') return;
    var r = s.result || {};
    var last = (r.games || [])[(r.games || []).length - 1];
    if (!last) return;
    var wincond = $('ec-wincond');
    if (wincond) {
      var who = last.winner >= 0 ? s.aliases[last.winner] : 'nobody';
      var loser = last.winner >= 0 ? s.aliases[1 - last.winner] : 'nobody';
      var text;
      if (last.end_reason === 'hq_destroyed') {
        var cause = (last.hq_lost_cause || [])[1 - last.winner] || 'none';
        text = cause === 'buried'
          ? who + ' buried ' + loser + '\u2019s HQ at round ' +
            ((last.hq_lost_round || [])[1 - last.winner] || last.rounds_played) +
            ' under 50 dirt'
          : loser + '\u2019s HQ drowned at round ' +
            ((last.hq_lost_round || [])[1 - last.winner] || last.rounds_played) +
            ', water ' + Number(last.water_level_end || 0).toFixed(2);
      } else if (last.end_reason === 'quantity') {
        text = 'round limit — ' + who + ' held ' +
          ((last.units_alive || [])[last.winner] || 0) + ' robots to ' +
          ((last.units_alive || [])[1 - last.winner] || 0);
      } else {
        text = 'the ' + String(last.end_reason).replace(/_/g, ' ') +
          ' rung of the ladder decided it';
      }
      wincond.textContent = text;
    }
    var how = $('ec-how');
    if (how) {
      var scores = r.scores || [0, 0];
      how.innerHTML =
        'score ' + scores[0] + ' — ' + scores[1] +
        ' · soup refined ' + ((last.soup_refined || [])[0] || 0) + '/' +
        ((last.soup_refined || [])[1] || 0) +
        ' · landscapers ' + ((last.landscapers_built || [])[0] || 0) + '/' +
        ((last.landscapers_built || [])[1] || 0) +
        ' · dirt moved ' + ((last.dirt_moved || [])[0] || 0) + '/' +
        ((last.dirt_moved || [])[1] || 0) +
        ' · drones downed ' + ((last.net_gun_kills || [])[0] || 0) + '/' +
        ((last.net_gun_kills || [])[1] || 0) +
        ' · dropped in the water ' + ((last.drone_water_drops || [])[0] || 0) +
        '/' + ((last.drone_water_drops || [])[1] || 0);
    }
    renderChain(s);
  }

  window.Bc20Block = {
    attach: function (host) {
      api = host;
      wireDoctrines();
    },
    // True while a bc20 replay is on screen; the inherited block asks before
    // it draws its own year's readouts.
    active: function (s) { return s && s.year === 'bc20'; },
    onFrame: function (s) {
      document.documentElement.setAttribute('data-year', s.year || 'bc26');
      if (s.year !== 'bc20') return;
      buildBc20BeatButtons(s);
      // THE BOARD IS THE PICTURE: the first frame that advances the playhead
      // closes the panel, unless the viewer opened it by hand.
      if (lastFrame >= 0 && s.t > lastFrame && !pinned && !dismissed) {
        setDoctrinesOpen(false);
      }
      lastFrame = s.t;
      renderFlood(s);
      renderSoup(s);
      renderUnits(s);
      renderDoctrines(s);
      renderFeed(s);
      applyBc20BeatSpoilers(s);
      renderEndcardExtras(s);
    }
  };
})();
</script>

     or with the bc20 one -- the beat builder is `buildBc21BeatButtons`, never
     `markBeat` (the tandem 2026-08-23 hoisting collision), never
     `buildBeatButtons` (bc26) and never `buildBc20BeatButtons` (bc20).

    });
  }

  function applyBc21BeatSpoilers(s) {
    if (!api || !beatEls.length) return;

    beatEls.forEach(function (el) {
      var hide = !spoilers && el.__tick > s.t;
      if (el.__hidden !== hide) {
        el.__hidden = hide;
        el.style.display = hide ? 'none' : '';
      }
    });
  }

  // ---- readouts ---------------------------------------------------------
  function renderVotes(s) {
    var v = s.bc21_votes || {};
    var host = $('bc21-votes');
    if (!host) return;
    var votes = v.votes || [0, 0];
    var total = Math.max(1, votes[0] + votes[1]);
    var pctA = Math.round((votes[0] / total) * 100);
    var leader = votes[0] > votes[1] ? 0 : (votes[1] > votes[0] ? 1 : -1);
    if (lastLeader !== -2 && leader !== lastLeader) {
      host.classList.add('flip');
      setTimeout(function () { host.classList.remove('flip'); }, 900);
    }
    lastLeader = leader;
    host.innerHTML =
      '<span class="lbl">' + esc(s.aliases[0]) + '</span> <b>' + votes[0] +
        '</b>' +
      '<span class="gauge"><i class="a" style="width:' + pctA + '%"></i>' +
        '<i class="b" style="width:' + (100 - pctA) + '%"></i></span>' +
      '<b>' + votes[1] + '</b> <span class="lbl">' + esc(s.aliases[1]) +
        '</span>' +
      '<span class="clinch">' + (v.to_clinch || 0) + ' to clinch</span>';
  }

  function renderInfluence(s) {
    var rows = s.bc21_influence || [{}, {}];
    var host = $('bc21-influence');
    if (!host) return;
    var html = '<span></span><span>' + esc(s.aliases[0]) + '</span><span>' +
      esc(s.aliases[1]) + '</span>';
    html += '<span>influence</span><b>' + (rows[0].influence || 0) +
      '</b><b>' + (rows[1].influence || 0) + '</b>';

    host.innerHTML = html;
  }

  var UNIT_ROWS = [
    ['politician', 'Po'], ['slanderer', 'Sl'], ['muckraker', 'Mu']
  ];

  function renderUnits(s) {

      html += '<div class="dline"><span class="dname">' +
        esc(s.aliases[slot]) + '</span> ' + esc(d.name || '') + ' \u2014 ' +

    });

  function renderFeed(s) {

    if (!feed || !s.beats) return;

    });
  }

  function renderBids(s) {
    var host = $('bc21-bids');
    var c = s.bc21_bids;
    if (!host || !c) return;
    var clans = c.clans || [];
    var html = '<b>the auction</b>';
    clans.forEach(function (clan) {
      html += '<br><span class="msg">' + esc(clan.alias) + ' \u2014 ' +
        (clan.votes || 0) + ' votes from ' + (clan.bids || 0) + ' bids, ' +
        (clan.burned || 0) + ' influence burned, biggest bid ' +
        (clan.top_bid || 0) + '</span>';
    });
    html += '<br><span class="msg">' + (c.tied_rounds || 0) +
      ' rounds tied and nobody voted, ' + (c.no_bid_rounds || 0) +
      ' with no bid at all</span>';

  }

      renderInfluence(s);
      renderUnits(s);
      renderDoctrines(s);
      renderFeed(s);
      applyBc21BeatSpoilers(s);
      renderEndcardExtras(s);
    }
  };
})();
</script>

<script>
(function () {
  'use strict';

  // ======================================================================
  // BATTLECODE additions to the inherited coworld-ctf chrome
  // ----------------------------------------------------------------------
  // The page above — head, CSS, markup, ids, transport bar, scrubber,
  // endcard, #viewpanel — is paintbot's replay_broadcast.html. This block
  // is the game view: it wires the same ChromeCommon the starter wires, in
  // the same order, and draws battlecode's own readouts into the elements
  // added beside the starter's.
  // ======================================================================

  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing — this page ' +
      'must be served spliced (dist bundle), not opened raw.');
    return;
  }

  var lastState = null;
  var core = null;

  function send(cmd) { if (core) core.sendCommand(cmd); }

  var C = window.ChromeCommon({
    send: send,
    sendPov: function () {},          // no per-seat POV in this coworld
    getState: function () { return lastState; }
  });
  var $ = C.$;
  var esc = C.esc;

  var canvas = $('board');
  var statusEl = $('status');
  var stage = $('stage');

  // BC20 HOOK (1 of 2): hand the appended bc20 game block the transport it
  // needs. `seek` and `dismissEndcard` are function declarations below and
  // are hoisted, so this runs before either is defined and still binds them.
  if (window.Bc20Block) {
    window.Bc20Block.attach({
      C: C,
      send: send,
      seek: function (frac) { seek(frac); },
      dismissEndcard: function () { dismissEndcard(); }
    });
  }

  // BC21 HOOK (1 of 2): the same two lines for the third year.
  if (window.Bc21Block) {
    window.Bc21Block.attach({
      C: C,
      send: send,
      seek: function (frac) { seek(frac); },
      dismissEndcard: function () { dismissEndcard(); }
    });
  }

  // ---- beats ------------------------------------------------------------
  // Deliberately NOT named markBeat: the starter's chrome_common already
  // exports one, and a same-named function in this block would hoist over
  // it (the tandem 2026-08-23 collision). Each beat is a real, labelled,
  // clickable <button> so a spectator can jump to the betrayal.
  var beatsBuilt = false;
  var beatEls = [];
  function buildBeatButtons(s) {
    if (beatsBuilt || !s.beats || !s.beats.length) return;
    beatsBuilt = true;
    var scrub = $('scrub');
    var span = Math.max(1, (s.mx || 1) - (s.st || 0));
    s.beats.forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'beat-marker ' + (b.k || 'game');
      el.style.left = (Math.min(1, Math.max(0, (b.t - (s.st || 0)) / span)) * 100) + '%';
      el.setAttribute('aria-label', b.label || b.k);
      el.title = b.label || b.k;
      el.__tick = b.t;
      el.addEventListener('click', function (event) {
        event.stopPropagation();
        seek(b.t / span);
      });
      scrub.appendChild(el);
      beatEls.push(el);
    });
    applyBeatSpoilers(s);
  }

  // These buttons are OURS, not chrome_common's: they are appended straight
  // to #scrub instead of going through markBeat/renderBeatMarkers (which
  // build divs, and whose name this block may not reuse -- the tandem
  // collision), so chrome_common's applySpoilers, which walks its own
  // markerEls, never sees them. With spoilers off, the marker for a BACKSTAB
  // 900 rounds away was on the scrubber from frame 0. Same rule as the
  // starter's: hide a marker that sits ahead of the playhead.
  function applyBeatSpoilers(s) {
    if (!s || !beatEls.length) return;
    var spoilers = C.getSpoilers();
    beatEls.forEach(function (el) {
      var hide = !spoilers && el.__tick > s.t;
      if (el.__hidden !== hide) {
        el.__hidden = hide;
        el.style.display = hide ? 'none' : '';
      }
    });
  }

  function seek(frac) {
    dismissEndcard();
    send('s:' + Math.min(1, Math.max(0, frac)).toFixed(5));
  }

  // ---- scorebug ---------------------------------------------------------
  var platesBuilt = false;
  function ensurePlates() {
    if (platesBuilt) return;
    platesBuilt = true;
    [['plates-l', 'ash', 0], ['plates-r', 'basil', 1]].forEach(function (p) {
      var host = $(p[0]);
      host.innerHTML =
        '<div class="plate ' + p[1] + '">' +
        '<span class="plate-name" id="pl-name-' + p[2] + '">—</span>' +
        '<span class="plate-sub" id="pl-sub-' + p[2] + '"></span>' +
        '<span class="plate-pts" id="pl-pts-' + p[2] + '">0</span>' +
        '</div>';
    });
  }

  function renderScorebug(s) {
    ensurePlates();
    for (var slot = 0; slot < 2; slot++) {
      var alias = (s.aliases && s.aliases[slot]) || ('Clan ' + slot);
      var name = (s.names && s.names[slot]) || '';
      var doc = (s.doctrines && s.doctrines[slot]) || {};
      $('pl-name-' + slot).textContent = alias.toUpperCase();
      $('pl-sub-' + slot).textContent =
        name + (doc.motto ? ' · ' + doc.motto : '');
      $('pl-pts-' + slot).textContent = (s.points && s.points[slot]) || 0;
    }
    var bars = $('bars');
    var html = '';
    for (var i = 0; i < 2; i++) {
      var b = (s.bars && s.bars[i]) || { cat: 0, kings: 0, cheese: 0 };
      html += '<div class="barset" title="cat damage / kings / cheese">' +
        '<div class="bar cat"><i style="width:' + b.cat + '%"></i></div>' +
        '<div class="bar kings"><i style="width:' + b.kings + '%"></i></div>' +
        '<div class="bar cheese"><i style="width:' + b.cheese + '%"></i></div>' +
        '</div>';
    }
    if (bars.innerHTML !== html) bars.innerHTML = html;
  }

  function renderCoop(s) {
    var chip = $('coopchip');
    if (s.coop) {
      chip.textContent = 'COOPERATION';
      chip.classList.remove('backstab');
    } else {
      chip.textContent = 'BACKSTAB — ' + (s.backstab_by || 'someone') +
        ', round ' + s.backstab_round;
      chip.classList.add('backstab');
    }
  }

  function renderEcon(s) {
    var e = s.econ || [];
    if (!e.length) return;
    var rows = [
      ['kings built', 'kings_built'], ['cheese delivered', 'cheese'],
      ['cats damaged', 'cat_damage'], ['traps laid', 'traps'],
      ['dirt placed', 'dirt']
    ];
    var html = '<span></span><b>' + esc(s.aliases[0]) + '</b><b>' +
      esc(s.aliases[1]) + '</b>';
    rows.forEach(function (r) {
      html += '<span>' + r[0] + '</span><span>' + (e[0][r[1]] || 0) +
        '</span><span>' + (e[1][r[1]] || 0) + '</span>';
    });
    var el = $('econ');
    if (el.innerHTML !== html) el.innerHTML = html;
  }

  function renderGameChips(s) {
    var html = '';
    for (var g = 1; g <= (s.games || 1); g++) {
      var chip = null;
      (s.gamechips || []).forEach(function (c) { if (c.game === g) chip = c; });
      var cls = chip && chip.winner_slot === 0 ? 'ash'
        : chip && chip.winner_slot === 1 ? 'basil' : '';
      var text = 'G' + g + (chip ? ' ' + (chip.winner || '—') : '');
      html += '<span class="gchip ' + cls + '"' +
        (chip ? ' title="' + esc(chip.reason || '') + '"' : '') + '>' +
        esc(text) + '</span>';
    }
    var el = $('gamechips');
    if (el.innerHTML !== html) el.innerHTML = html;
  }

  // The doctrines open with the replay and get out of the way as soon as the
  // rats start moving (r2-D3). Three things close the panel: the first frame
  // that advances the playhead, a 6 s timer for a viewer that never presses
  // play, and its own header. Nothing but the header opens it, and a panel
  // opened by hand stays open — that is the viewer's choice, not a lid the
  // page left on the board.
  var doctrinesRendered = false;
  var doctrinesPinned = false;      // the viewer opened it themselves
  var doctrinesLastFrame = -1;
  function setDoctrinesOpen(open) {
    var el = $('doctrines');
    if (!el) return;
    el.classList.toggle('closed', !open);
    var toggle = $('doctrines-toggle');
    if (toggle) {
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.textContent = (open ? '▾ ' : '▸ ') + 'Doctrines';
    }
  }
  function renderDoctrines(s) {
    if (!s.doctrines) return;
    if (!doctrinesRendered) {
      doctrinesRendered = true;
      var html = '<button id="doctrines-toggle" type="button" ' +
        'aria-expanded="true" aria-controls="doctrines-body">▾ Doctrines</button>' +
        '<div class="dbody" id="doctrines-body">';
      s.doctrines.forEach(function (d) {
        html += '<div class="dline"><span class="dname">' + esc(d.alias) +
          '</span> — ' + esc((d.words || []).join(', '));
        if (d.fallback) {
          html += ' <span class="dfall">[scripted fallback: ' +
            esc(d.fallback) + ']</span>';
        }
        if (d.notes) html += '<br><i>' + esc(d.notes) + '</i>';
        html += '</div>';
      });
      html += '</div>';
      $('doctrines').innerHTML = html;
      setDoctrinesOpen(true);
      $('doctrines-toggle').addEventListener('click', function () {
        var open = !$('doctrines').classList.contains('closed');
        doctrinesPinned = !open;
        setDoctrinesOpen(!open);
      });
      // The viewer who never presses play still gets the board back.
      setTimeout(function () {
        if (!doctrinesPinned) setDoctrinesOpen(false);
      }, 6000);
    }
    // PLAYBACK IS ADVANCING: the picture is the rats, not the sheet.
    if (s.t !== doctrinesLastFrame) {
      if (doctrinesLastFrame >= 0 && s.t > 0 && !doctrinesPinned) {
        setDoctrinesOpen(false);
      }
      doctrinesLastFrame = s.t;
    }
  }

  // ---- feed -------------------------------------------------------------
  // The beat feed rides the starter's existing #killfeed element rather than
  // inventing a new id.
  var feedShown = {};
  function renderFeed(s) {
    if (!s.beats) return;
    var feed = $('killfeed');
    s.beats.forEach(function (b) {
      var key = b.t + '|' + b.k;
      // Future beats are excluded here, so the feed is spoiler-safe by
      // construction: a line appears when the playhead reaches its beat and
      // never before. (A second `!getSpoilers() && b.t > s.t` guard used to
      // follow this line and could not fire.)
      if (feedShown[key] || b.t > s.t) return;
      feedShown[key] = true;
      var row = document.createElement('div');
      row.className = 'kf-row ' + b.k;
      row.textContent = b.label;
      feed.appendChild(row);
      while (feed.childNodes.length > 8) feed.removeChild(feed.firstChild);
    });
  }

  // ---- endcard ----------------------------------------------------------
  var endcardShown = false;
  function dismissEndcard() {
    if (!endcardShown) return;
    endcardShown = false;
    $('endcard').classList.remove('on');
  }

  function renderEndcard(s) {
    if (s.ph !== 'gameover' || endcardShown) return;
    endcardShown = true;
    var r = s.result || {};
    var scores = r.scores || [0, 0];
    var winner = scores[0] === scores[1] ? -1 : (scores[0] > scores[1] ? 0 : 1);
    $('ec-headline').textContent = winner < 0 ? 'DRAWN'
      : (s.aliases[winner] + ' — ' + s.names[winner]).toUpperCase();
    var last = (r.games || [])[(r.games || []).length - 1];
    $('ec-wincond').textContent = last
      ? (last.end_reason === 'kings_destroyed'
          ? s.aliases[last.winner] + ' destroyed every enemy rat king in game ' +
            (r.games.length) + ', round ' + last.rounds_played
          : last.end_reason === 'cats_cleared'
            ? 'every cat was cleared and the points decided it'
            : 'the round limit ran out and the points decided it')
      : '';
    var betrayal = 'the alliance held';
    (r.games || []).forEach(function (g, i) {
      if (g.backstab_round >= 0) {
        betrayal = s.aliases[g.backstab_by] + ' betrayed in game ' + (i + 1) +
          ', round ' + g.backstab_round;
      }
    });
    var e = s.econ || [{}, {}];
    $('ec-how').innerHTML =
      esc(betrayal) + '<br>' +
      'score ' + scores[0] + ' — ' + scores[1] +
      ' · kings built ' + (e[0].kings_built || 0) + '/' + (e[1].kings_built || 0) +
      ' · cheese delivered ' + (e[0].cheese || 0) + '/' + (e[1].cheese || 0) +
      ' · cats damaged ' + (e[0].cat_damage || 0) + '/' + (e[1].cat_damage || 0);
    var teams = '';
    for (var slot = 0; slot < 2; slot++) {
      var d = (s.doctrines || [])[slot] || {};
      teams += '<div class="ec-team"><b>' + esc(s.aliases[slot]) + '</b> ' +
        esc(s.names[slot]) + '<br>' + esc((d.words || []).join(', ')) + '</div>';
    }
    $('ec-teams').innerHTML = teams;
    // `.on` is the class the INHERITED rule uses (#endcard.on { display: flex }
    // at the top of this page). There is no #endcard.show rule anywhere, so a
    // card added with `.show` stays display:none for the whole replay.
    $('endcard').classList.add('on');
  }

  // ---- layout -----------------------------------------------------------
  // relayout() is the starter's: --hudscale, --topband and --band on :root,
  // iterated to a fixed point so a map-aspect change cannot leave dead
  // strips, and NOTHING is overlaid inside the transport band.
  function relayout() {
    var root = document.documentElement.style;
    var w = window.innerWidth || 1280;
    for (var pass = 0; pass < 3; pass++) {
      var scale = Math.max(0.62, Math.min(1, w / 1100));
      var topband = Math.round(58 * scale);
      var band = Math.round(($('transport').offsetHeight || 76));
      root.setProperty('--hudscale', String(scale));
      root.setProperty('--topband', topband + 'px');
      root.setProperty('--band', band + 'px');
      // The FOURTH :root variable: the height of the union of the VISIBLE
      // year stat boxes, measured inside the same fixed-point loop. #killfeed
      // is lifted above it (see the #killfeed rule). 0px when the stack is
      // empty, which is the bc26 case.
      var railTop = Infinity;
      var railBottom = -Infinity;
      ['econ', 'bc20-soup', 'bc20-units', 'bc21-influence', 'bc21-units']
        .forEach(function (id) {
          var el = document.getElementById(id);
          if (!el || !el.offsetParent) return;
          var box = el.getBoundingClientRect();
          if (box.width <= 0 || box.height <= 0) return;
          if (box.top < railTop) railTop = box.top;
          if (box.bottom > railBottom) railBottom = box.bottom;
        });
      var rail = (railBottom > railTop) ? Math.round(railBottom - railTop) : 0;
      root.setProperty('--statrail', rail + 'px');
    }
  }
  window.addEventListener('resize', function () {
    relayout();
    if (core) core.setViewportFit();
  });

  // ---- transport buttons -------------------------------------------------
  var BUTTONS = {
    'btn-restart': ',', 'btn-back': 'b', 'btn-play': ' ',
    'btn-fwd': '.', 'btn-end': 'e', 'btn-loop': 'r', 'btn-skip': 'f'
  };
  Object.keys(BUTTONS).forEach(function (id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener('click', function () {
      if (id !== 'btn-loop' && id !== 'btn-skip') dismissEndcard();
      send(BUTTONS[id]);
    });
  });
  // "+5s" means nothing on a round clock, so the forward button is relabelled
  // "+25" — the design note's §Transport rules asks for a "+25 rounds" button
  // and names #btn-skip for it, but in THIS lineage (paintbot) #btn-skip is
  // the auto-skip-quiet-stretches TOGGLE ('f' -> skipLulls,
  // src/battlecode/broadcast.nim:54) and #btn-fwd is the forward step
  // ('.' -> +25 rounds, broadcast.nim:51 + replay-viewer/bc_replay.nim:113).
  // The label goes on the button that does the thing; putting "+25 rounds" on
  // the toggle would name it after a behaviour it does not have.
  $('btn-fwd').textContent = '+25';
  $('btn-fwd').title = 'Forward 25 rounds (.)';
  $('btn-skip').title = 'Auto-skip quiet stretches (f)';
  $('btn-spoilers').addEventListener('click', function () {
    C.setSpoilers(!C.getSpoilers());
    $('btn-spoilers').classList.toggle('on', C.getSpoilers());
    applyBeatSpoilers(lastState);
  });
  $('scrub').addEventListener('click', function (event) {
    var rect = this.getBoundingClientRect();
    seek((event.clientX - rect.left) / Math.max(1, rect.width));
  });
  document.addEventListener('keydown', function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    var key = event.key === ' ' ? ' ' : event.key.toLowerCase();
    if (' ,.ber f'.indexOf(key) >= 0 && key !== '') {
      if (key !== 'r' && key !== 'f') dismissEndcard();
      send(key);
      event.preventDefault();
    } else if ('12348'.indexOf(key) >= 0) {
      send(key);
    } else if (key === 'o') {
      C.setSpoilers(!C.getSpoilers());
      applyBeatSpoilers(lastState);
    }
  });

  // ---- #viewpanel (KEPT: a 60x60 board is wider than the frame) -----------
  function wireViewPanel() {
    var slider = $('zoom-slider');
    var read = $('zoom-read');
    $('zoom-in').addEventListener('click', function () {
      if (core) core.zoomAt(1.25, 0.5, 0.5);
    });
    $('zoom-out').addEventListener('click', function () {
      if (core) core.zoomAt(0.8, 0.5, 0.5);
    });
    slider.addEventListener('input', function () {
      if (!core) return;
      var level = 1 + (Number(slider.value) / 1000) * 11;
      core.setZoom(level, 0.5, 0.5);
    });
    var dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', function (event) {
      dragging = true; lastX = event.clientX; lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', function (event) {
      if (!dragging || !core) return;
      core.panBy(event.clientX - lastX, event.clientY - lastY);
      lastX = event.clientX; lastY = event.clientY;
    });
    canvas.addEventListener('pointerup', function () { dragging = false; });
    var mm = $('minimap-canvas');
    if (core && mm && core.attachMinimap) core.attachMinimap(mm);
    return function (transform) {
      if (!transform) return;
      var zoom = transform.zoom || 1;
      read.textContent = zoom <= 1.01 ? 'FIT' : (zoom.toFixed(1) + '×');
      var v = Math.round(((zoom - 1) / 11) * 1000);
      if (String(v) !== slider.value) slider.value = String(v);
    };
  }

  // ?viewpanel=0 still drops the panel for thumbnail capture.
  if (new URLSearchParams(location.search).get('viewpanel') === '0') {
    document.body.setAttribute('data-noviewpanel', '');
  }

  // ---- the frame --------------------------------------------------------
  function onText(text) {
    var s;
    try { s = JSON.parse(text); } catch (error) { return; }
    lastState = s;
    // BC20 HOOK (2 of 2): the replay header's `year` picks which game block
    // draws. The scorebug, the clock, the transport, the scrubber and the
    // endcard shell are SHARED and stay here; only the year's own readouts
    // are switched, by `html[data-year]` in CSS and by this branch.
    // The replay header's `year` drives the CSS switch. It is set HERE, in
    // the shared block, so it does not depend on which year block happens to
    // run; and a year CHANGE re-runs relayout(), because --statrail is a
    // measurement of the stat boxes that year makes visible.
    var year = s.year || 'bc26';
    if (document.documentElement.getAttribute('data-year') !== year) {
      document.documentElement.setAttribute('data-year', year);
      relayout();
    }
    var isBc20 = !!(window.Bc20Block && window.Bc20Block.active(s));
    var isBc21 = !!(window.Bc21Block && window.Bc21Block.active(s));
    if (window.Bc20Block) window.Bc20Block.onFrame(s);
    // BC21 HOOK (2 of 2).
    if (window.Bc21Block) window.Bc21Block.onFrame(s);
    if (!isBc20 && !isBc21) {
      buildBeatButtons(s);
      renderCoop(s);
      renderEcon(s);
      renderDoctrines(s);
      renderFeed(s);
    }
    renderScorebug(s);
    renderGameChips(s);
    C.renderClock(s);
    C.renderTransport(s);
    if (!isBc20 && !isBc21) applyBeatSpoilers(s);
    $('clock-caption').textContent = s.ph === 'gameover'
      ? 'Match over'
      : 'game ' + s.game + ' of ' + s.games + ' — ' + s.map;
    $('tick-clock').textContent = 'round ' + s.round + ' / ' + s.rounds;
    renderEndcard(s);
    var mm = $('mmwarn');
    var mismatch = document.documentElement
      .getAttribute('data-replay-mismatch-round');
    // `.on` is the class the inherited rule uses (#mmwarn.on { display: block })
    // -- there is no #mmwarn.show rule, so `.show` left the banner hidden and
    // the fidelity flag was raised only on <html> as data-replay-mismatch-round.
    if (mm && mismatch && Number(mismatch) >= 0) mm.classList.add('on');
    if (statusEl.classList.contains('show') && !s.error) {
      statusEl.classList.remove('show');
    }
  }

  var onTransform = null;
  core = window.BcStaticReplay.createCore({
    canvas: canvas,
    onText: onText,
    onStatus: function (status) {
      statusEl.textContent = status;
      statusEl.classList.toggle('show', status !== 'live');
    },
    onFirstFrame: function () {
      statusEl.classList.remove('show');
      if (stage) stage.classList.add('ready');
    },
    onTransform: function (t) { if (onTransform) onTransform(t); }
  });
  onTransform = wireViewPanel();
  relayout();
  core.start();

  // The coworld-replay bridge posts `ready` from a callback fired AFTER
  // static_replay.js has set data-replay-loaded on the first drawn frame.
  var readySent = false;
  var readyPoll = setInterval(function () {
    if (readySent) { clearInterval(readyPoll); return; }
    if (document.documentElement.getAttribute('data-replay-loaded') !== 'true') {
      return;
    }
    readySent = true;
    clearInterval(readyPoll);
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ src: 'coworld-replay', type: 'ready' }, '*');
      }
    } catch (ignored) {}
  }, 120);
})();
</script>
</body>
</html>
