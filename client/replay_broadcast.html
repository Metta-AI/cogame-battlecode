@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --green: #45a85e;
  --yellow: #ddc531;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* A flex item now (the side lanes flank it): never let the px size
     relayout() computes be squeezed by the lane columns. */
  flex: none;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
  /* One-finger drags belong to the PAGE while the board is fitted; syncTouchAction
     takes them back (touch-action: none) once there is somewhere to pan. Neither
     value permits pinch-zoom, so the second finger always reaches our handler
     instead of zooming the document. */
  touch-action: pan-x pan-y;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* Team color utility: any chrome element carrying a team-name class exposes
   that team's tint as --tc, and every team-colored rule below reads
   var(--tc, <neutral fallback>). Supporting a new team = one line here plus
   its art — no per-team selector pairs anywhere else. */
.red { --tc: var(--red); }
.blue { --tc: var(--blue); }
.green { --tc: var(--green); }
.yellow { --tc: var(--yellow); }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

/* One side of the scorebug: one plate per side for classic red/blue (exactly
   the old layout); a 3-4 team game puts BOTH of a side's plates on the same
   row (outer team at the screen edge, inner team beside the clock), so all
   four teams read on one line across the band. */
.plates {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(5 * var(--u));
  min-width: 0;
}
.plates.row { flex-direction: row; align-items: center; gap: calc(18 * var(--u)); }
.plates.row .plate { flex: 1 1 0; }
.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
/* BR colour swatch: the flag glyph's replacement on a flagless board. Same
   box as .flagicon so the plate's layout is identical either way — only the
   iconography changes, not the geometry. */
.swatchicon {
  width: calc(26 * var(--u));
  height: calc(30 * var(--u));
  flex: none;
}
.swatchicon svg { width: 100%; height: 100%; display: block; }

/* MANY teams (BR seats 16). Minimal compaction only — smaller chips, tighter
   gaps, no name wrapping — deliberately NOT a redesign: the plate keeps its
   swatch + name + numeral structure and its DOM, so everything that reads or
   updates a plate keeps working. Without this the 16 chips overflow the bar
   and the outermost ones clip. */
/* THREE/FOUR TEAMS: two plates per side track. Everything below is the
   classic plate at the size two-to-a-side actually affords — the name and
   numeral stay (they are the score), the second-order detail goes. Without
   this the plates overprinted each other on any board narrower than the
   design width. `many` (>4 teams) keeps its own, harder compaction below. */
.plates.row.tight { gap: calc(10 * var(--u)); }
.plates.row.tight .plate { gap: calc(5 * var(--u)); }
.plates.row.tight .team-name { font-size: calc(11 * var(--u)); }
.plates.row.tight .lives-num { font-size: calc(10 * var(--u)); }
.plates.row.tight .plate:not(.has-glory) .lives-num { font-size: calc(13 * var(--u)); }
.plates.row.tight .glory-num { font-size: calc(16 * var(--u)); }
/* The labels are the first thing to go: "Hill"/"Lives" repeated four times is
   four words saying what the numeral's position already says. */
.plates.row.tight .lives-label { display: none; }
/* Tag counts and squad pips are per-team detail that needs room this tier
   does not have; they are what was colliding with the neighbouring plate. */
.plates.row.tight .pb-tags,
.plates.row.tight .squad { display: none; }
.plates.row.tight .pb-sub { margin-top: 0; }
.plates.row.tight .hillchip {
  font-size: calc(10 * var(--u));
  min-width: calc(22 * var(--u));
  padding: calc(2 * var(--u)) calc(3 * var(--u));
}
.plates.row.many { gap: calc(7 * var(--u)); }
.plates.row.many .plate { gap: calc(3 * var(--u)); }
.plates.row.many .swatchicon,
.plates.row.many .flagicon {
  width: calc(13 * var(--u));
  height: calc(15 * var(--u));
}
.plates.row.many .team-name {
  font-size: calc(7 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(46 * var(--u));
}
.plates.row.many .lives-label { display: none; }   /* the numeral carries it */
.plates.row.many .lives-num { font-size: calc(11 * var(--u)); }
.plates.row.many .squad { display: none; }  /* per-seat pips are unreadable
                                               at 16 chips; the numeral is
                                               the honest summary. */
/* BR top bar (>4 teams / 16 seats): GLORY SCOREBUG v2 (2026-09-01, Maxwell's
   ruling — supersedes the single-leader .br-glory block from the prior
   PR). His words: "it should show the 16 teams, their glory, and they get
   grayed out when knocked out." Every team gets a compact cell — a
   palette swatch (BR identity IS the palette, per Maxwell), a short name,
   and that team's own GLORY numeral, the prominent figure in the cell.
   Cells split 8-per-side flanking the clock (position/size unchanged —
   "keep the clock centered and legible") in .br-cellband, a flex-wrap row
   that wraps itself to a 2-row band once a side can't fit ~4 cells at
   common widths — no JS breakpoint needed. Eliminated teams (lives<=0,
   the same signal the old "Teams alive" counter read) get .out: dimmed +
   desaturated, but they STAY in their slot, so the band reads as a ledger
   of the whole field, not a shrinking list. Leader emphasis rides the
   heat flame on ONE cell (the current glory leader) rather than a
   bar-wide takeover — see renderScorebug's many-branch in JS. Per-team
   kill/rank detail still lives on the end-card, which can afford the
   room. */
.br-cellband {
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  gap: calc(3 * var(--u)) calc(9 * var(--u));
  height: 100%;
  /* .plates.row (the parent, shared with the classic 3-4 team layout) is
     flex-direction:row with no wrap of its own -- this is what actually
     shrinks to the grid track's real width and wraps its OWN children
     (the cells) instead of the band overrunning the centered clock. */
  flex: 1 1 0;
  min-width: 0;
}
.br-cell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  flex: 0 0 auto;
  min-width: 0;
  transition: opacity 300ms ease, filter 300ms ease;
}
.br-cell-swatch {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  border-radius: calc(2 * var(--u));
  flex: none;
  box-shadow: inset 0 0 0 calc(1 * var(--u)) rgba(0, 0, 0, 0.45);
}
/* PLAYER IDENTITY SCOREBUG (2026-09-02, owner's direction: "the life
   squares can stack vertically and have the name to the right or
   something" — supersedes v3's single team-name text). Each cell is now
   swatch + a vertical member stack + glory: one row per seated MEMBER,
   that cog's own life square with its seat/policy name to the right —
   both duo members named (seats k and k+16, the engine's teamForSlot
   mirror), a solo seat one row, a filler seat named as the wire seats it.
   The palette stays the primary key (swatch + --cellcol on every square);
   names ride small/secondary and truncate by brShortIdent (leading
   namespace segments cut, the distinctive tail kept) + CSS ellipsis, one
   rule for all 16 chips. A member's row dims (.dead) while that cog is
   down; the whole cell still only grays (.out, below) when ALL members
   are out, the same lives<=0 ledger signal as before. */
.br-cell-members {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(1.5 * var(--u));
  min-width: 0;
  flex: none;
}
.br-cell-member {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
}
.br-cell-life {
  width: calc(5 * var(--u));
  height: calc(5 * var(--u));
  border-radius: calc(1 * var(--u));
  background: var(--cellcol, var(--paper-dim));
  box-shadow: inset 0 0 0 calc(0.75 * var(--u)) rgba(0, 0, 0, 0.45);
  transition: opacity 300ms ease;
  flex: none;
}
.br-cell-mname {
  font-family: var(--pixfont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.2px;
  color: var(--paper-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(58 * var(--u));
}
.br-cell-member.dead .br-cell-life { opacity: 0.22; }
.br-cell-member.dead .br-cell-mname { opacity: 0.45; }
/* The prominent figure in the cell — glory is still the score, just one
   per team now instead of one for the whole bar (Maxwell: show all 16). */
.br-cell-glory {
  font-family: var(--pixfont);
  font-size: calc(15 * var(--u));
  line-height: 1;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
  flex: none;
}
/* Eliminated: STAYS in its slot (never removed/collapsed — the band is a
   ledger of the whole field, not a shrinking list), just visually dead. */
.br-cell.out {
  filter: grayscale(1);
  opacity: 0.35;
}
.br-cell.out .br-cell-glory { color: var(--paper-dim); }
/* Leader emphasis: the flame (shared tiers/markup with the classic
   plates — see .heat-flame below) rides only the current glory leader's
   cell; every other cell's flame element stays at its cold default (JS
   passes it a null team, see renderScorebug). A little extra glow on the
   leader's own numeral, reusing the leaderpulse language's color rather
   than its animation (16 cells pulsing at once would be noise). */
.br-cell .heat-flame {
  width: calc(8 * var(--u));
  height: calc(11 * var(--u));
}
.br-cell.leader .br-cell-glory { text-shadow: 0 0 calc(6 * var(--u)) var(--amber); }
/* HEAT FLAME: how fast the glory readout beside it is currently climbing —
   see noteGloryForHeat/heatTierFor in JS, which bucket a short trailing window of
   glory gain into 4 tiers. Cold (no recent gain) is near-invisible so an
   idle scorebug doesn't wear a dead icon; each tier up adds opacity, a
   warmer color and (top tier) the same leaderpulse glow the leader plate
   already uses, so "on fire" reads as literally that. */
.heat-flame {
  width: calc(11 * var(--u));
  height: calc(15 * var(--u));
  flex: none;
  opacity: 0.18;
  color: var(--paper-dim);
  transition: opacity 220ms ease, color 220ms ease;
}
.heat-flame svg { width: 100%; height: 100%; display: block; }
.heat-flame.heat-warm { opacity: 0.55; color: var(--amber); }
.heat-flame.heat-hot { opacity: 0.85; color: var(--amber); filter: drop-shadow(0 0 calc(3 * var(--u)) rgba(232, 163, 61, 0.65)); }
.heat-flame.heat-blazing {
  opacity: 1;
  color: var(--red);
  filter: drop-shadow(0 0 calc(4 * var(--u)) rgba(224, 82, 58, 0.8));
  animation: heatflicker 0.9s ease-in-out infinite;
}
@keyframes heatflicker {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12) translateY(calc(-1 * var(--u))); }
}
#stage.beat-active .heat-flame { animation-play-state: paused; }
/* Orientation is a SIDE property, not a color property: right-side plates
   mirror so both team names stay innermost, flanking the clock. */
.plate.side-r { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate .team-name { color: var(--tc, var(--paper)); }

/* One baseline row with the TEAM NAME innermost (toward the center clock):
   a left plate reads "32 LIVES RED", a right plate reads "BLUE LIVES 32", so
   names flank the clock. Left reverses; right keeps DOM order (name → label → num). */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
  margin-top: calc(1 * var(--u));
}
.plate.side-l .lives-line { flex-direction: row-reverse; }
/* GLORY SCOREBUG REDESIGN (2026-09-01): lives used to be the dominant
   numeral (20u) with glory riding beneath it at ~60% size (13u) as a
   secondary line. Maxwell's ruling flips that relationship outright: glory
   is THE score, so .glory-num now leads at 24u (bigger than the old 20u
   lives numeral it demotes) and .lives-num shrinks to 13u — the exact swap,
   so a viewer's eye lands on the number that matters. The glory row also
   moves ABOVE the lives row in DOM order (see the plate builders in JS) so
   it reads first top-to-bottom as well as biggest. */
.lives-num {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  line-height: 1;
  color: var(--paper-dim);
  flex: none;
}
.lives-label {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
/* SEASON 2 GLORY: now the DOMINANT baseline row (sits above .lives-line —
   see the plate builders), name-innermost/label/numeral rhythm carried over
   unchanged. Absent entirely (no row at all) until the first frame carries a
   `glory` field, via JS toggling `.has-glory` on the plate — a pre-GLORY-port
   replay's topbar is therefore byte-for-byte the old one (lives-only, at its
   original weight — see .plate:not(.has-glory) .lives-num below). */
.plate .glory-line {
  display: none;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.has-glory .glory-line { display: flex; }
.plate.side-l .glory-line { flex-direction: row-reverse; }
/* Pre-glory replays never gain .has-glory, so the lives numeral stays at
   its historic dominant size — the demotion above only fires once glory is
   actually on screen to take its place. */
.plate:not(.has-glory) .lives-num { font-size: calc(20 * var(--u)); color: var(--paper); }
.glory-num {
  font-family: var(--pixfont);
  font-size: calc(24 * var(--u));
  line-height: 1;
  color: var(--amber);
  flex: none;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.glory-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
/* Team-perk badges, riding the squad-pip strip (the pip strip IS the life
   meter — see renderSquad). Each policy's pips form one .squad-pol block
   with that policy's badges beside them; the center-adjacent pips with
   badges flanking OUTSIDE come from renderSquad's fixed DOM order
   (group 0: icons,pips; group 1: pips,icons), never from side-reversal CSS
   — see the .squad-pol comment below for why mirroring was removed. Badges
   keep each perk's own fixed color (never team-tinted). */
.plate .perk-icos {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.plate .perk-ico { display: inline-flex; }
.plate .perk-ico svg {
  width: calc(10 * var(--u));
  height: calc(10 * var(--u));
  display: block;
}
/* Handicap chip: an amber pill next to the team name when that team is
   weakened. The full delta breakdown rides in the native `title` on hover
   (cursor:help hints it). Hidden entirely for an unhandicapped team. */
.plate .hcap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  line-height: 1;
  color: var(--ink);
  background: var(--amber);
  border-radius: calc(3 * var(--u));
  padding: calc(2 * var(--u)) calc(4 * var(--u));
  flex: none;
  cursor: help;
  white-space: nowrap;
}
/* Squad strip: ONE pip per player (8). Each pip is a tiny pie: the filled
   wedge is that seat's remaining lives (full square = all lives, a sliver =
   last life), dim = down-but-respawning, hollow = eliminated. The strip is
   the "who's left" read; the big numeral is the exact lives count. Each pip
   is clickable → POV lens (fog-honesty). */
.squad {
  display: flex;
  gap: calc(6 * var(--u));
  margin-top: calc(3 * var(--u));
}
.plate.side-r .squad { justify-content: flex-end; }
/* Policy groups keep the HEADLINE's left-to-right order on BOTH plates — the
   first-named policy's pips are always the left group, so a badge reads as
   belonging to the name it sits under. (No side mirroring: an early version
   reversed the strip on side-l for clock-symmetry, which visually attached
   the left badges to the wrong policy name.) */
.squad-pol {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.squad-pip {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  /* --fill (0..1) = lives left / max lives; wedge sweeps clockwise from 12 */
  background: conic-gradient(currentColor calc(var(--fill, 1) * 1turn), transparent 0);
  opacity: 0.92;
  cursor: pointer;
  position: relative;
  transition: opacity 140ms, transform 140ms;
}
/* faint frame so a part-filled pie still reads as one square slot */
.squad-pip::after {
  content: '';
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 calc(1 * var(--u)) currentColor;
  opacity: 0.35;
}
.squad-pip:hover { transform: translateY(calc(-1 * var(--u))); }
.squad-pip.down { opacity: 0.3; }                              /* dead, lives left */
.squad-pip.out {                                              /* eliminated */
  background: transparent;
  box-shadow: inset 0 0 0 calc(1.5 * var(--u)) currentColor;
  opacity: 0.28;
}
.squad-pip.out::after { display: none; }       /* .out draws its own outline */
.squad-pip.carry {                                            /* has the flag */
  background: conic-gradient(var(--amber) calc(var(--fill, 1) * 1turn), transparent 0);
  box-shadow: 0 0 calc(7 * var(--u)) var(--amber);
}
.squad-pip.pov {                                             /* POV lens active */
  box-shadow: 0 0 0 calc(1.5 * var(--u)) var(--paper);
}
.plate .squad { color: var(--tc, var(--paper)); }

/* flag-state icon — HOME (on pedestal) / TAKEN (riding a carrier) /
   CAPTURED (GV32: retired, team eliminated — drawn like TAKEN). F2. */
.flagicon {
  position: relative;
  width: calc(26 * var(--u));
  height: calc(30 * var(--u));
  flex: none;
}
.flagicon svg { width: 100%; height: 100%; display: block; }
/* transform-box:fill-box so SVG transforms pivot about the cloth's own box,
   not the viewBox edge (else the flip mirrors off-screen — invisible-at-vote). */
.flagicon .cloth { transition: transform 90ms steps(3); transform-box: fill-box; transform-origin: left center; }
.flagicon.taken .cloth { transform: scaleX(0.62) skewX(-8deg); }
.flagicon.flip { animation: flagflip 260ms steps(3); transform-box: fill-box; transform-origin: center; }
@keyframes flagflip { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
.flagicon .carrier-tag {
  position: absolute;
  bottom: calc(-11 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  white-space: nowrap;
  color: var(--amber);
  text-transform: uppercase;
  /* An outermost flag icon sits at the screen edge; an unclamped centered
     tag would poke past it (seen as stray clipped names at the band edges
     in 4-team games). */
  max-width: calc(58 * var(--u));
  overflow: hidden;
  text-overflow: ellipsis;
}

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

/* leader pulse when a team's lives lead is >=3. GLORY REDESIGN: also pulses
   .glory-num now — it's the dominant numeral the leader cue needs to land
   on; .lives-num keeps the pulse too (harmless at its demoted size, and
   free for pre-glory replays where .glory-num never renders at all). */
.plate.leader .lives-num,
.plate.leader .glory-num { animation: leaderpulse 1.9s ease-in-out infinite; }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* Beat-pause (§11): idle systems freeze the instant a beat lands, so ambient
   never competes with a kill/steal/capture for the eye. Applied on #stage; the
   engine-driven board (24Hz) is untouched — only chrome ambient pauses. */
#stage.beat-active .amb,
#stage.beat-active .plate.leader .lives-num,
#stage.beat-active .plate.leader .glory-num { animation-play-state: paused; }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--tc, var(--red)); font-size: calc(15 * var(--u)); }
/* the acting team's tint rides as a left accent bar (any team color) */
.banner-chip.accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--tc, var(--amber)); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }

/* ---------- 1b. GLORY POPS ---------- */
/* SEASON 2: world-anchored floating "+Ng"/named-claim pops, one per entry in
   the frame's s.pops (sim.gloryPops, see broadcast.nim gloryPopsJson). #gloryPops
   itself is a full-#chrome-sized positioning root (children placed with JS-
   computed left/top from core.getTransform(), see renderGloryPops); it never
   captures pointer events so it can't shadow board clicks. Rise/fade is driven
   PER FRAME from the pop's own tick age (not a wall-clock CSS animation) so it
   never desyncs from replay speed, pause, or a seek. */
#gloryPops { position: absolute; inset: 0; pointer-events: none; z-index: 11; }
.glory-pop {
  position: absolute;
  transform: translate(-50%, -100%);
  font-family: var(--pixfont);
  font-weight: 600;
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(1.5 * var(--u)) 0 var(--ink), 0 0 calc(6 * var(--u)) rgba(0,0,0,.65);
  white-space: nowrap;
  will-change: transform, opacity;
}
.glory-pop.claim {
  /* a named achievement claim outranks a bare deed pop (L: `label.len > 0`
     picks the longer AchievementFxTicks life engine-side too) — paper, not
     amber, so it doesn't read as "just a bigger number". */
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  letter-spacing: 0.02em;
}
.glory-pop.neg { color: var(--red); }

/* ---------- 1c. SEASON 2 phase presentation: vote -> huddle -> arena ------
   The episode opens as a broadcast SEGMENT SEQUENCE (owner spec): the MAP
   VOTE takes the board region first (4 options in 4 quadrants, a name-chip
   sliding under a quadrant as each recorded cast's moment passes), then the
   HUDDLE plays as a full-focus chat room, and only then does the arena take
   the stage. Once play begins the huddle collapses to a small chip with an
   unread badge (narrow layouts) or lives in the persistent left COMMS
   sidebar (wide layouts, where the letterbox column is reclaimed and the
   board docks right). Everything is driven off the CURRENT frame (s.ph +
   s.t against the records' own ms stamps), so scrubbing back into the
   lobby replays the same sequence; a replay whose .shell carries none of
   these records shows none of it -- the degrade-to-nothing path
   docs/designs/prematch-vote-wire-2026-08-31.md paragraph 4 and the huddle
   lane call for. */

/* The two full-focus acts cover the BOARD region only (same geometry as
   #endcard): scorebug and transport stay live so the field roster reads
   and the scrubber can skip an act. z below #endcard (30) -- a gameover
   reached by seeking always outranks a lobby act. */
.phase-stage {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(10 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(22, 15, 9, 0.90), rgba(9, 6, 3, 0.97));
  z-index: 28;
  padding: calc(16 * var(--u));
}
.phase-stage.show { display: flex; animation: cardfade 220ms ease-out; }
.stage-kicker {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
}
.stage-note {
  font-family: var(--finefont);
  font-size: calc(9.5 * var(--u));
  color: var(--paper-dim);
}

/* MAP VOTE: 4 quadrants. Cards, not thumbnails -- the ballot record carries
   option indices only (no map spec rides the wire), so each option is a
   labeled card; D is the design's "random" delegate. */
#voteGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: calc(10 * var(--u));
  width: min(calc(560 * var(--u)), 92%);
  flex: 0 1 auto;
  min-height: calc(220 * var(--u));
}
.vq {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: calc(4 * var(--u));
  padding: calc(10 * var(--u)) calc(12 * var(--u));
  border-radius: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.055);
}
.vq.winner {
  background: rgba(232, 163, 61, 0.12);
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.55);
}
.vq-letter {
  font-family: var(--pixfont);
  font-size: calc(20 * var(--u));
  color: var(--paper-dim);
  line-height: 1;
}
.vq.winner .vq-letter { color: var(--amber); }
.vq-name {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper);
}
.vq-flag {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  color: var(--amber);
}
.vq-chips {
  display: flex;
  flex-wrap: wrap;
  gap: calc(3 * var(--u));
  margin-top: auto;
  min-height: calc(14 * var(--u));
}
.vq-chip {
  display: inline-flex;
  align-items: center;
  gap: calc(4 * var(--u));
  padding: calc(2 * var(--u)) calc(6 * var(--u));
  border-radius: calc(8 * var(--u));
  background: rgba(20, 14, 9, 0.7);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  color: var(--paper);
  animation: chip-in 240ms ease-out;
}
.vq-chip .swatch { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }
@keyframes chip-in {
  from { opacity: 0; transform: translateY(calc(5 * var(--u))); }
  to { opacity: 1; transform: none; }
}
.swatch {
  flex: none;
  width: calc(7 * var(--u));
  height: calc(7 * var(--u));
  border-radius: calc(1.5 * var(--u));
  background: var(--tc, var(--ghost));
}

/* HUDDLE act (narrow layouts): the pre-match chat ROOM, full focus. */
#huddleStage .hs-card {
  display: flex;
  flex-direction: column;
  width: min(calc(520 * var(--u)), 88%);
  max-height: 100%;
  min-height: 0;
}
.hs-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: calc(6 * var(--u));
}
.lobby-panel-title {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
.hud-x {
  border: 0;
  background: none;
  color: var(--paper-dim);
  font-family: var(--finefont);
  font-size: calc(13 * var(--u));
  line-height: 1;
  padding: 0 calc(2 * var(--u));
  cursor: pointer;
}
.hud-x:hover { color: var(--paper); }
#huddleFeed {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: calc(6 * var(--u));
  min-height: 0;
}
.hs-foot {
  margin-top: calc(8 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  font-style: italic;
  color: var(--paper-dim);
}
/* Chat bubbles: warm paper-on-ink, no hard borders; the speaker line wears
   the seat team's palette color. Shared by the room, the corner panel and
   the comms sidebar (one renderer -- commsEntryHtml). */
.hd-msg { display: flex; flex-direction: column; gap: calc(1.5 * var(--u)); }
.hd-who {
  display: flex;
  align-items: center;
  gap: calc(4 * var(--u));
  font-family: var(--finefont);
  font-weight: 600;
  font-size: calc(8 * var(--u));
  letter-spacing: 0.06em;
  color: var(--tc, var(--paper-dim));
  text-transform: uppercase;
}
.hd-text {
  align-self: flex-start;
  padding: calc(4 * var(--u)) calc(8 * var(--u));
  border-radius: calc(2 * var(--u)) calc(8 * var(--u)) calc(8 * var(--u)) calc(8 * var(--u));
  background: rgba(242, 232, 216, 0.08);
  font-size: calc(9.5 * var(--u));
  color: var(--paper);
  line-height: 1.45;
}
.hd-msg { animation: chip-in 240ms ease-out; }
/* A FLASH row: the caller retuning a seat (play-call record 0x10). Amber
   bolt + play names -- visually apart from chat on purpose: this is
   observability, not conversation. */
.hd-flash {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  color: var(--amber);
  animation: chip-in 240ms ease-out;
}
.hd-flash .swatch { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }
.hd-flash .fl-who { font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.hd-flash .fl-plays { color: var(--paper-dim); }
.huddle-empty {
  color: var(--paper-dim);
  font-style: italic;
  font-size: calc(9 * var(--u));
}

/* Collapsed huddle chip (narrow layouts, arena acts): bottom-left, above
   the transport, one pill + unread badge. */
#huddleChip {
  position: absolute;
  left: calc(12 * var(--u));
  bottom: calc(76 * var(--u));
  display: none;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(4 * var(--u)) calc(9 * var(--u));
  border: 0;
  border-radius: calc(10 * var(--u));
  background: rgba(20, 14, 9, 0.84);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.14);
  color: var(--paper-dim);
  font-family: var(--pixfont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  z-index: 20;
}
#huddleChip.show { display: inline-flex; }
#huddleChip:hover { color: var(--paper); }
#huddleUnread {
  display: none;
  min-width: calc(11 * var(--u));
  padding: calc(1 * var(--u)) calc(3 * var(--u));
  border-radius: calc(7 * var(--u));
  background: var(--amber);
  color: var(--ink);
  font-family: var(--finefont);
  font-weight: 700;
  font-size: calc(8 * var(--u));
  text-align: center;
}
#huddleUnread.on { display: inline-block; }
#huddleChip.pulse { animation: chip-pulse 600ms ease-out; }
@keyframes chip-pulse {
  0% { transform: scale(1); }
  35% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

/* Expanded corner panel (narrow layouts, during the arena): same footprint
   as before, now with a real header -- click the header (or its X) to
   collapse back to the chip. */
#huddlePanel {
  position: absolute;
  left: calc(12 * var(--u));
  bottom: calc(76 * var(--u));
  width: calc(248 * var(--u));
  max-height: 46%;
  display: none;
  flex-direction: column;
  background: rgba(20, 14, 9, 0.84);
  border: 1px solid rgba(242, 232, 216, 0.14);
  border-radius: calc(3 * var(--u));
  padding: calc(8 * var(--u)) calc(10 * var(--u));
  font-family: var(--finefont);
  z-index: 20;
  animation: cardfade 220ms ease-out;
}
#huddlePanel.show { display: flex; }
#huddlePanel .hud-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  margin-bottom: calc(5 * var(--u));
}
#huddleLines {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  min-height: 0;
}

/* ---------- 1d. COMMS SIDEBAR (wide layouts) --------------------------
   When the fitted board leaves >= 280 free px in the viewport, relayout()
   docks the stage RIGHT and this column reclaims the letterbox: the
   persistent observability feed (huddle + flashes now; ballots/play votes
   when the votearm lane's records land -- see commsEntryHtml). Nothing
   floats over the arena in this mode. */
#commsdock {
  display: none;
  flex-direction: column;
  min-width: 0;
  flex: 1 1 auto;
  align-self: stretch;
  padding: calc(14 * var(--u)) calc(14 * var(--u)) calc(10 * var(--u));
  background: linear-gradient(180deg, rgba(36, 26, 18, 0.55), rgba(22, 15, 9, 0.35));
  position: relative;
}
body.commswide #commsdock { display: flex; }
body.commswide #viewport { justify-content: flex-end; }
.cd-head {
  font-family: var(--pixfont);
  font-size: calc(9.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-bottom: calc(8 * var(--u));
  flex: none;
}
#commsFeed {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: calc(7 * var(--u));
  flex: 1 1 auto;
  min-height: 0;
  scrollbar-width: thin;
}
#commsLive {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(14 * var(--u));
  display: none;
  border: 0;
  border-radius: calc(10 * var(--u));
  padding: calc(4 * var(--u)) calc(10 * var(--u));
  background: var(--amber);
  color: var(--ink);
  font-family: var(--pixfont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}
#commsLive.show { display: block; }
/* The huddle ACT at wide widths is the sidebar itself in focus: the board
   dims behind it instead of a separate chat-room overlay. */
body.commswide.act-huddle #board,
body.commswide.act-huddle #lightpool { filter: brightness(0.45) saturate(0.7); }
body.commswide.act-huddle #commsdock {
  background: linear-gradient(180deg, rgba(36, 26, 18, 0.9), rgba(22, 15, 9, 0.8));
}

/* ---------- 1d. SIDE-LANE HUD (owner spec 2026-09-02) ----------
   "use the full left lane letterbox space to put the names and scorebug and
   chat and everything." When the fitted board leaves a REAL pillarbox column
   on BOTH flanks (>= 300 free px a side, measured the way the docked layout
   will actually sit — scorebug out of the top band), relayout() sets
   body.sidelanes and dockLanes() MOVES the overlay chrome into the dead
   bands: LEFT rail = identity (clock, the scorebug roster, the comms/huddle
   feed), RIGHT rail (tier 2, .sidelanes-both, when both flanks are wide) =
   live surfaces (view instrument, kill feed). The board gets the whole
   frame height back (--topband collapses to 0) and nothing floats over
   play that has a rail to live in. Narrow boxes keep today's centered
   stage + overlay chrome unchanged — dockLanes restores every element to
   its exact home slot. The rails are designed columns: type + whitespace
   on the warm letterbox tone, never a stack of boxed widgets. See
   relayout() for the two-tier geometry decision. */
#lane-l, #lane-r {
  display: none;
  flex-direction: column;
  min-width: 0;
  align-self: stretch;
}
/* Plain comms-wide (no side lanes): the left lane is a transparent shell
   around #commsdock, so the pre-lane presentation is intact. */
body.commswide #lane-l { display: flex; flex: 1 1 auto; }
#lane-l #commsdock { min-height: 0; }
/* Tier 1: the left rail alone takes ALL the letterbox (stage docks right,
   "use the full left lane letterbox space"). Tier 2 adds the right rail;
   the two 1-1-0 columns then split the leftover evenly, which is exactly
   what re-centers the stage. */
body.sidelanes #lane-l {
  display: flex;
  flex: 1 1 0;
  padding: calc(14 * var(--u)) calc(16 * var(--u));
  gap: calc(12 * var(--u));
  overflow: hidden;
}
body.sidelanes-both #lane-r {
  display: flex;
  flex: 1 1 0;
  padding: calc(14 * var(--u)) calc(16 * var(--u));
  gap: calc(12 * var(--u));
  overflow: hidden;
}
body.sidelanes #viewport { justify-content: center; }

/* LEFT RAIL — identity. The scorebug keeps its DOM (plates, cells and
   everything inside them stay the scorebug component's own business — the
   endcard-player-names lane owns those internals); the rail only re-flows
   the component: clock on top, every team below it in ONE readable column
   at the full local unit (the top band's 0.8 shrink bought room the rail
   already has). */
body.sidelanes #scorebug {
  position: static;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: calc(12 * var(--u));
  --u: calc(1px * var(--hudscale));
  padding: 0;
  background: none;
  box-shadow: none;
  flex: none;
  min-height: 0;
}
body.sidelanes #scorebug .clock-col { order: -1; }
body.sidelanes #scorebug .plates,
body.sidelanes #scorebug .plates.row {
  flex-direction: column;
  align-items: stretch;
  gap: calc(7 * var(--u));
}
/* BR (16 teams): the two 8-cell bands become one continuous roster column. */
body.sidelanes #scorebug .br-cellband {
  flex-direction: column;
  flex-wrap: nowrap;
  align-items: stretch;
  justify-content: flex-start;
  height: auto;
  gap: calc(4 * var(--u));
}
body.sidelanes #scorebug .br-cell { width: 100%; }
body.sidelanes #scorebug .br-cell-name { max-width: none; }
/* owner: "life squares stack vertically, name to the right" — pure re-flow
   (order/direction only); what the cells render is untouched. The glory
   numeral rides the rail's right edge so the column reads as a ledger. */
body.sidelanes #scorebug .br-cell-swatch { order: -2; }
body.sidelanes #scorebug .br-cell-lives { order: -1; flex-direction: column; }
body.sidelanes #scorebug .br-cell-glory { margin-left: auto; }
/* In the top band the two plate tracks flank a center clock, so the right
   track mirrors (.side-r row-reverse). Stacked in one rail there is no
   center to flank: every plate reads in the LEFT track's direction. */
body.sidelanes #scorebug .plate.side-r { flex-direction: row; text-align: left; }
body.sidelanes #scorebug .plate.side-r .lives-line { flex-direction: row-reverse; }
body.sidelanes #scorebug .plate.side-r .glory-line { flex-direction: row-reverse; }
/* The comms/huddle surface fills the rest of the rail. The chat column
   belongs here even when nobody spoke (owner spec) — relayout() opens the
   dock in sidelanes regardless of comms, and the :empty state names the
   silence instead of showing a bare hole. */
body.sidelanes #commsdock {
  display: flex;
  background: none;
  padding: 0;
  flex: 1 1 auto;
  min-height: 0;
}
.cd-empty {
  display: none;
  color: var(--ghost);
  font-family: var(--pixfont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.08em;
  line-height: 1.7;
}
#commsFeed:empty + .cd-empty { display: block; }
/* An empty feed must not flex-grow, or the quiet-lobby line lands at the
   rail's far bottom instead of under its own COMMS head. */
#commsFeed:empty { flex: 0 0 auto; }

/* RIGHT RAIL (tier 2 only — .sidelanes-both): live surfaces. The view
   instrument (zoom + minimap) docks on top at the rail's width; the kill
   feed takes the remaining height, newest row lowest (its own
   column-reverse), rows anchored toward the board they narrate. In the
   single-rail tier these keep their classic overlay positions. */
body.sidelanes-both #viewpanel {
  position: static;
  flex: none;
  align-items: stretch;
  --viewpanel-w: 100%;
}
body.sidelanes-both #killfeed {
  position: static;
  width: auto;
  min-height: 0;
  flex: 1 1 auto;
  align-items: flex-start;
  overflow: hidden;
}

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom). column-reverse so the newest row sits lowest, nearest the
     transport, and older kills stack upward — a broadcast lower-third feed. */
  /* THE KILLFEED / STAT-BOX OVERLAP FIX (bc20 judge, advisory).
     `76 * --u` scales with the BOARD, and the year stat boxes are anchored in
     PIXELS off the transport band, so at FIT zoom on a small board the feed's
     offset falls below the boxes and — being eight z-levels higher — overdraws
     them. `--statrail` is the measured height of the visible stat-box stack
     for the CURRENT data-year (relayout() sets it in the same fixed-point
     loop as --band), so the feed is lifted clear of whatever is actually
     there rather than of a number somebody typed. Nothing else changes: same
     right anchor, same width, same column-reverse, same pointer-events. */
  bottom: max(calc(76 * var(--u)),
              calc(var(--band, 0px) + var(--statrail, 0px) + 8px));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who { color: var(--tc, var(--paper)); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }
.feed-row.flagkill { box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }

/* Roster rails removed: per-player state now rides the scorebug squad strip
   (the roster IS the counter, genre convention) and the board's own name tags.
   No floating bordered rails over the arena flanks (in-world, no HUD chrome). */

/* POV eye badge shown when a slot is inspected (fog-honesty lens) */
#povBadge {
  position: absolute;
  top: calc(64 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--ink-soft);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  z-index: 12;
  cursor: pointer;
}
#povBadge.on { display: flex; }

/* First-person PiP inset: pinned bottom-LEFT (the killfeed owns bottom-right, so
   they never overlap), responsive width (§2 — sized off the stage so it scales
   with the composition). Hidden until a seat is in POV. One quiet hairline
   frames it as a genuine window, not a decorative card. */
#fpv {
  position: absolute;
  left: calc(12 * var(--u));
  bottom: calc(64 * var(--u));
  /* Sized/positioned in px once dragged or resized; these are the defaults. */
  width: 30%;
  min-width: calc(150 * var(--u));
  max-width: calc(460 * var(--u));
  aspect-ratio: 3 / 2;
  display: none;
  z-index: 11;
  background: rgba(12, 9, 6, 0.42);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.34),
    0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(8, 5, 3, 0.45);
  overflow: hidden;
  /* See-through so it never fully hides the arena beneath; grab anywhere to
     move, drag the corner grip to resize. */
  opacity: 0.82;
  cursor: grab;
  transition: opacity 0.12s ease;
}
#fpv.on { display: block; }
#fpv:hover { opacity: 0.97; }
#fpv.dragging, #fpv.resizing { cursor: grabbing; opacity: 0.99; }
#fpv.resizing { cursor: nwse-resize; }
/* Once dragged/resized we pin via left/top + explicit width and drop the
   left/bottom + aspect-ratio anchors so nothing fights. */
#fpv.moved { left: auto; bottom: auto; }
#fpv.sized { aspect-ratio: auto; max-width: none; min-width: 0; }
#fpv-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  pointer-events: none;   /* clicks fall through to the frame for dragging */
}
/* Resize grip: bottom-right corner (bottom-left is the screen edge when pinned
   bottom-left). The ONLY child that takes pointer events, so drag-to-move works
   everywhere else. */
.fpv-grip {
  position: absolute;
  right: 0; bottom: 0;
  width: calc(16 * var(--u));
  height: calc(16 * var(--u));
  cursor: nwse-resize;
  z-index: 5;
  background:
    linear-gradient(-45deg, transparent 40%, rgba(232, 163, 61, 0.55) 42%,
      rgba(232, 163, 61, 0.55) 46%, transparent 48%,
      transparent 58%, rgba(232, 163, 61, 0.55) 60%,
      rgba(232, 163, 61, 0.55) 64%, transparent 66%);
  opacity: 0.6;
}
.fpv-grip:hover { opacity: 1; }
.fpv-cap {
  position: absolute;
  left: calc(6 * var(--u));
  top: calc(4 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--amber);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  pointer-events: none;
  opacity: 0.85;
  z-index: 3;
}

/* Self-status HUD: a thin bottom bar reading like a soldier's own readout —
   name at the left, hp as pips, carried gear at the right. Sits over the floor
   half of the raycast so it never masks the horizon action. */
.fpv-hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  line-height: 1;
  color: var(--paper);
  background: linear-gradient(0deg, rgba(8, 5, 3, 0.82), rgba(8, 5, 3, 0));
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  z-index: 3;
}
.fpv-name {
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}
.fpv-name { color: var(--tc, var(--paper)); }
.fpv-hp {
  display: inline-flex;
  gap: calc(2 * var(--u));
  align-items: center;
}
.fpv-hp i {
  width: calc(6 * var(--u));
  height: calc(6 * var(--u));
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 0 1px rgba(8, 5, 3, 0.7);
  display: inline-block;
}
.fpv-hp i.spent { background: rgba(242, 232, 216, 0.16); box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.28); }
.fpv-gear {
  margin-left: auto;
  display: inline-flex;
  gap: calc(4 * var(--u));
  color: var(--paper-dim);
  letter-spacing: 0.02em;
}
.fpv-gear .carry { color: var(--amber); font-weight: 600; }
.fpv-dead .fpv-hp, .fpv-dead .fpv-gear { opacity: 0.4; }

/* Un-fogged tactical minimap inset: top-right corner, BOARD aspect. Compact and
   see-through so it reads as an overlay on the raycast, not a lid over it. A
   quiet hairline frames it as a genuine window. pointer-events:none so grabbing
   it still drags the whole PiP.
   The width/aspect-ratio here are PRE-STREAM DEFAULTS (the classic arena) —
   syncFpvMapShape() overwrites both from the streamed map's real w/h, because a
   four-team board is square and a fixed 1.874:1 inset squashes it. */
.fpv-map {
  position: absolute;
  top: calc(4 * var(--u));
  right: calc(4 * var(--u));
  width: 38%;
  aspect-ratio: 1235 / 659;
  background: rgba(8, 5, 3, 0.42);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.28);
  overflow: hidden;
  z-index: 2;
  opacity: 0.9;
  pointer-events: none;
}
.fpv-map canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

/* ---------- 4b. VIEW CONTROLS (zoom + minimap) ----------
   One group, top-right, under the reserved scorebug band: the minimap sits
   directly over the control that summoned it, so "where am I" and "how far in
   am I" read as a single instrument instead of two scattered widgets.
   The board is NOT scroll-zoomed — a trackpad two-finger scroll belongs to the
   page — so these controls are the primary way in, not a fallback, and they are
   always present. The minimap only appears once there is something off-screen
   to locate (zoom > 1); at fit it would just be the board again, smaller. */
/* Hidden while the end-card is up — see the .ended toggle in the render
   loop's gameover branch, right above ingestCapHearts's caller. */
#viewpanel.ended { display: none; }
#viewpanel {
  position: absolute;
  top: calc(var(--topband, 0px) + 10 * var(--u));
  right: calc(12 * var(--u));
  z-index: 11;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: calc(5 * var(--u));
  font-family: var(--pixfont);
  /* Minimap and zoom bar share ONE width so the pair reads as a single stacked
     instrument rather than two overlays that happen to be near each other.
     The px floor is a TOUCH floor: chrome otherwise scales with the embed, and
     a 300px-wide Observatory card would shrink the buttons below a fingertip. */
  --viewpanel-w: max(calc(178 * var(--u)), 132px);
}

/* Board minimap. Aspect + display come from the STREAMED board's real w/h
   (syncMinimapShape), because a four-team board is square and a fixed 1.874:1
   inset would squash it. See-through so it reads as an overlay on play. */
#minimap {
  position: relative;
  width: var(--viewpanel-w);
  aspect-ratio: 1235 / 659;
  background: rgba(8, 5, 3, 0.5);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.3);
  overflow: hidden;
  cursor: crosshair;
  display: none;
}
#minimap.on { display: block; }
#minimap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
/* The label rides INSIDE the frame rather than adding a header row above it —
   one element, not two stacked boxes. */
#minimap .mm-cap {
  position: absolute;
  left: calc(4 * var(--u));
  bottom: calc(2 * var(--u));
  font-size: calc(7 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper-dim);
  text-shadow: 0 1px 2px rgba(8, 5, 3, 0.9);
  pointer-events: none;
}

#zoombar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  width: var(--viewpanel-w);
  padding: calc(3 * var(--u)) calc(5 * var(--u));
  /* Opaque enough that the buttons keep their contrast over pale concrete —
     a control you have to hunt for on a bright floor is not a control. */
  background: rgba(12, 9, 6, 0.82);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.22);
}
.zbtn {
  font-family: var(--pixfont);
  font-size: calc(14 * var(--u));
  line-height: 1;
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  flex: none;
  width: max(calc(20 * var(--u)), 22px);
  height: max(calc(18 * var(--u)), 20px);
  cursor: pointer;
  padding: 0;
}
.zbtn:hover { background: rgba(242, 232, 216, 0.22); }
.zbtn:disabled { opacity: 0.3; cursor: default; background: rgba(242, 232, 216, 0.05); }
/* Zoom is geometric (1x..12x); the slider's travel is the LOG of it, so equal
   thumb movement is equal perceived zoom rather than a dead left half. */
#zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  flex: 1 1 auto;
  width: auto;
  min-width: 0;
  margin: 0;
  height: calc(2 * var(--u));
  background: rgba(242, 232, 216, 0.22);
  cursor: pointer;
}
#zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: calc(9 * var(--u));
  height: calc(13 * var(--u));
  background: var(--amber);
  cursor: grab;
}
#zoom-slider::-moz-range-thumb {
  width: calc(9 * var(--u));
  height: calc(13 * var(--u));
  border: none;
  border-radius: 0;
  background: var(--amber);
  cursor: grab;
}
#zoom-slider:focus-visible { outline: 1px solid var(--amber); outline-offset: calc(3 * var(--u)); }
/* Never a bare number: the readout carries its unit, and "FIT" names the state
   the board opens in instead of showing a meaningless 1.0x. */
#zoom-read {
  font-size: max(calc(9 * var(--u)), 9px);
  letter-spacing: 0.06em;
  color: var(--paper-dim);
  flex: none;
  width: max(calc(26 * var(--u)), 26px);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
#zoom-read.zoomed { color: var(--amber); }

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* kill ticks are short and colored by the KILLER's team (a red tick = red
   scored a kill); team-kills and unattributable pileups stay neutral. */
.beat-marker.kill { background: var(--tc, var(--paper-dim)); height: calc(6 * var(--u)); }
/* flag beats are colored by the FLAG's team, matching the banners ("RED
   HEART TAKEN"): steal = full tick with a flag head, return = same tick
   dimmed (the heart snapped home), capture = the chunky match point in the
   CAPTURING team's color. */
.beat-marker.steal { background: var(--tc, var(--amber)); }
.beat-marker.steal::after {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: calc(5 * var(--u));
  height: calc(3 * var(--u));
  background: inherit;
}
.beat-marker.return { background: var(--tc, var(--paper-dim)); opacity: 0.45; }
.beat-marker.capture { background: var(--tc, var(--amber)); width: calc(3 * var(--u)); height: calc(12 * var(--u)); }
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.show { display: block; background: var(--tc, var(--paper-dim)); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.show { color: var(--tc, var(--paper-dim)); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* hash-mismatch warning (top center) — honest fidelity flag */
#mmwarn {
  position: absolute;
  top: calc(40 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--red);
  color: var(--paper);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
}
#mmwarn.on { display: block; }
/* DRIFT tier: the mismatch is the EXPECTED kind — the recording and this
   viewer were built from different engine sources (or neither side can
   prove otherwise), so playback falls back to the recorded inputs by
   design. Reads as a quiet chip in the #povBadge idiom rather than an
   alarm. The red default above is reserved for a SAME-build mismatch: the
   engine failing to reproduce its own recording, a true determinism
   break. */
#mmwarn.drift {
  background: var(--ink-soft);
  color: var(--paper-dim);
  letter-spacing: 0.12em;
  font-size: calc(7 * var(--u));
}

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  /* Cover the BOARD region only — never the scorebug or transport bands. The
     transport must stay clickable under the end card so the scrubber can jump
     back into the match from the score screen (the card cancels server-side
     end-hold on seek). --topband/--band are the measured band heights that
     relayout() maintains on :root; in embed mode both are 0 and the card
     spans the whole iframe as before. */
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: ec-shake 160ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ec-shake {
  0% { transform: translate(0, 0); }
  25% { transform: translate(calc(-2 * var(--u)), calc(1 * var(--u))); }
  50% { transform: translate(calc(2 * var(--u)), calc(-1 * var(--u))); }
  75% { transform: translate(calc(-1 * var(--u)), calc(0.5 * var(--u))); }
  100% { transform: translate(0, 0); }
}
/* Impact flash: a brief full-bleed wash in the winner's own color (JS sets
   --tc on #endcard itself at reveal — teamCol() covers all 16 BR colors,
   not just the four CSS utility classes), so the reveal reads as a beat
   instead of a plain fade. Negative z-index, local to #endcard's own
   stacking context, so it never leaks under the board. Gone by 220ms —
   well before anything needs reading. */
#endcard::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: var(--tc, var(--amber));
  opacity: 0;
}
#endcard.on::before { animation: ec-flash-fade 220ms ease-out; }
@keyframes ec-flash-fade { 0% { opacity: 0.5; } 100% { opacity: 0; } }
#endcard .headline { color: var(--tc, var(--ghost)); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard.on .headline {
  animation: ec-headline-pop 220ms cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes ec-headline-pop {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber.
   Wraps + centers so a 3rd/4th team panel folds to a second row.
   max-height + overflow-y is the fix for the "duo cards clip the top bar /
   transport bleeds through" defect: #endcard's own box is already bounded
   between --topband and --band (see #endcard above), but it has no overflow
   rule of its own, and a 16-team BR field, wrapped, is routinely taller than
   that box. The overflow used to escape #endcard's box (and its background)
   entirely — the escaping rows painted directly over the scorebug/transport
   bands with nothing behind them, reading as clipping/bleed-through. Capping
   THIS element and letting it scroll internally keeps the headline/hero
   pinned on-screen and contains any overflow inside the card's own bounds. */
#endcard .ec-teams {
  display: flex;
  gap: calc(22 * var(--u));
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
  max-height: 52%;
  overflow-y: auto;
  overscroll-behavior: contain;
}
/* ---- BR (elim) variant: a winner-dominant hero card + a ranked, compressed
   field list — replaces the per-team KDA panel grid above, which is still
   used as-is for classic 2-4 team CTF (#endcard .ec-teams:not(.br)).
   GLORY-FIRST since 2026-09-01: the wire's per-team round glory
   (over.teams[team].glory) is the hero's dominant numeral and each field
   row's leading stat — see .ec-glory-hero / .ec-fglory above and
   renderEndcardBR in JS; everything glory stays gated on the field
   actually being present, so a pre-glory replay renders glory-free. */
#endcard .ec-teams.br {
  flex-direction: column;
  align-items: center;
  /* flex-start, NOT the base class's justify-content:center: in a column
     flex box that is also the scroll container, centered overflow clips
     the TOP of the content beyond scroll reach — with the glory hero
     grown to card scale that was the winner's own name. flex-start pins
     the hero at the scrollport top and lets only the tail scroll. */
  justify-content: flex-start;
  flex-wrap: nowrap;
  gap: calc(10 * var(--u));
  width: 100%;
  /* 360u predates the player-identity rows (2026-09-02): with both duo
     members named beside the palette label, the name track needs the
     extra ~70u or the second member vanishes into the ellipsis on real
     ladder name lengths. Still comfortably inside a 16:9 board. */
  max-width: calc(430 * var(--u));
  /* The glory-first hero is taller than the old two-line hero; 52% forced
     an internal scroll on a plain 16:9 board. */
  max-height: 62%;
}
#endcard .ec-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(3 * var(--u));
}
#endcard .ec-hero-name {
  font-family: var(--pixfont);
  font-size: calc(20 * var(--u));
  letter-spacing: 0.04em;
  color: var(--tc, var(--paper));
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
#endcard .ec-hero-line {
  font-family: var(--finefont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper-dim);
}
/* PLAYER IDENTITY (2026-09-02, owner's ruling: "naming the color that won
   alone is pointless! you have to name the players too"): the winning
   team's seat/policy names, one secondary line directly under the color
   headline. Palette stays the primary key (the map-reading key); the
   names ride the mvp-line's type scale in paper so they read as identity,
   not as another glory callout. Empty (hidden) whenever the headline
   already IS the identity (a single shared policy resolved by
   brTeamLabel) or the roster carries none. */
#endcard .ec-hero-duo {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.03em;
  color: var(--paper);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#endcard .ec-hero-duo:empty { display: none; }
/* GLORY-FIRST ENDCARD (2026-09-01, owner's ruling: "the win slide at the
   end doesn't even highlight how much glory the win was worth, the most
   important thing!"). The winner's round glory total is THE number on the
   slide — the same dominant-numeral treatment the scorebug redesign gave
   .glory-num (glory leads, lives/kills demote), scaled up for the card.
   Gated on .has-glory exactly like the scorebug plates: a pre-glory-port
   replay never gains the class, so its endcard renders as before. */
#endcard .ec-glory-hero {
  display: none;
  align-items: baseline;
  gap: calc(8 * var(--u));
  font-family: var(--pixfont);
  line-height: 1;
}
#endcard .ec-hero.has-glory .ec-glory-hero { display: flex; }
#endcard .ec-glory-hero-num {
  font-size: calc(40 * var(--u));
  color: var(--amber);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 calc(10 * var(--u)) rgba(232, 163, 61, 0.45), 0 calc(2 * var(--u)) 0 var(--ink);
}
#endcard .ec-glory-hero-label {
  font-size: calc(12 * var(--u));
  letter-spacing: 0.14em;
  color: var(--amber);
  opacity: 0.85;
}
/* GLORY LEADER callout: the episode's highest-glory team, surfaced even
   (especially) when it is NOT the survivor — a 4th-place team that
   out-earned the winner IS the season's result, not a footnote. Empty
   (and therefore hidden) when the wire carries no glory. */
#endcard .ec-mvp-line {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--amber);
  letter-spacing: 0.03em;
}
#endcard .ec-mvp-line:empty { display: none; }
#endcard .ec-mvp-line .ec-mvp-team { color: var(--tc, var(--amber)); }
#endcard .ec-mvp-line .ec-mvp-dim { color: var(--paper-dim); }
#endcard .ec-field {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: calc(1 * var(--u));
}
#endcard .ec-frow {
  display: grid;
  grid-template-columns: calc(28 * var(--u)) 1fr calc(34 * var(--u)) calc(44 * var(--u));
  gap: calc(8 * var(--u));
  align-items: center;
  padding: calc(3 * var(--u)) calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  background: rgba(20, 14, 9, 0.4);
}
/* GLORY-FIRST field rows: once the wire actually ships glory (.has-glory
   on #ec-field), every real row gains a dedicated GLORY column right
   after the name — amber and a step larger than the demoted kills/lives
   figures, so it reads first. The compressed "+N more" row keeps its own
   2-track template either way, and a pre-glory replay (no .has-glory)
   keeps the original 4-track rows byte-for-byte. */
#endcard .ec-field.has-glory .ec-frow:not(.ec-fcompressed) {
  grid-template-columns: calc(28 * var(--u)) 1fr calc(44 * var(--u)) calc(30 * var(--u)) calc(44 * var(--u));
}
#endcard .ec-fglory {
  color: var(--amber);
  font-size: calc(12.5 * var(--u));
  text-align: right;
  font-variant-numeric: tabular-nums;
}
#endcard .ec-frank {
  color: var(--paper-dim);
  font-size: calc(9 * var(--u));
  text-align: right;
}
#endcard .ec-fname {
  color: var(--tc, var(--paper));
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  min-width: 0;
  text-align: left;
  white-space: nowrap;
}
#endcard .ec-fname .ec-fname-text {
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
/* BR identity IS the palette: every row wears its team swatch, and two
   different duos running the SAME starter policy additionally carry
   their seat range — never two bare identical labels. */
#endcard .ec-fswatch {
  width: calc(8 * var(--u));
  height: calc(8 * var(--u));
  border-radius: calc(2 * var(--u));
  background: var(--tc, var(--paper-dim));
  box-shadow: inset 0 0 0 calc(1 * var(--u)) rgba(0, 0, 0, 0.45);
  flex: none;
}
#endcard .ec-fseats {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.06em;
  color: var(--paper-dim);
  flex: none;
}
/* PLAYER IDENTITY (2026-09-02): the duo's seat/policy names beside the
   color chip on every standings row — secondary weight (the .ec-fseats
   fine-type voice, a step up for legibility), truncating before it can
   push the stat columns. Only rendered when the row's label doesn't
   already carry the identity (palette-label fallback rows). */
#endcard .ec-fduo {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.04em;
  color: var(--paper-dim);
  /* Leftover-space column (grow from a 0 basis): the palette label keeps
     its NATURAL width — colors stay the primary key, so "YELLOW" must
     never squeeze to "YE…" to make room for the names — and it is the
     names that ellipsis when the row runs out of track. */
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-fstat {
  color: var(--paper-dim);
  font-size: calc(9.5 * var(--u));
  text-align: right;
  font-variant-numeric: tabular-nums;
}
#endcard .ec-frow.ec-fcompressed {
  grid-template-columns: calc(28 * var(--u)) 1fr;
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.04em;
  color: var(--paper-dim);
  background: none;
  font-style: italic;
}
#endcard .ec-frow.ec-fcompressed .ec-fname { color: var(--paper-dim); }
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname { color: var(--tc, var(--paper)); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
#endcard .fl-num { font-size: calc(22 * var(--u)); color: var(--tc, var(--paper)); }
/* SEASON 2: per-team GLORY total + the achievements ledger line, riding
   directly under .ec-lives with the same numeral/caption rhythm at a
