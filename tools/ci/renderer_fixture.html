<!doctype html>
<meta charset="utf-8">
<title>battlecode renderer fixture — full-cap doctrine text</title>
<!--
  The text a CI replay never carries.

  Every replay CI produces is scripted, so its `notes` and `motto` are the
  short strings baselines.nim emits. A hosted episode carries whatever an LLM
  wrote, up to the full rune caps — and a caption with nowhere to go is
  invisible to the load signal and to the screenshot (the cogchemists
  2026-08-24 scar: four speech bubbles drawn at a negative y and clipped to
  slivers).

  `--strict-text-bounds` is the flag that would catch that on a FIXED arena.
  This coworld's board is pannable and zoomable (#viewpanel is kept, because a
  60x60 board renders wider than a 360 px featured-match frame), which is the
  exact case that flag's own documentation excludes. So this fixture stands in
  its place: it lays out BOTH seats' readouts at their full caps and reports
  whether anything overflowed its box.

  IT DOES NOT COPY THE PAGE'S CSS. `page_styles.css` is the <style> block of
  client/replay_broadcast.html, extracted verbatim by the wasm-viewer job, and
  the markup below is the page's own DOM (#viewport > #stage > #chrome >
  #scorebug > .plates > .plate, plus #coopchip/#econ/#doctrines) with the band
  variables relayout() computes at runtime. A fixture with its own private
  rules — an `overflow: hidden` the page does not ship, say — is green about
  itself and says nothing about the page (r1-N8).

  Three widths in one page load: the top-level document opens itself in three
  iframes sized 360 / 720 / 1280, so each one's media queries see its own
  width, and the parent reads each child's verdict directly.
  `data-replay-loaded="true"` on <html> is the ready signal and
  `data-replay-error` carries the first failure, so
  `tools/ci/viewer_smoke.mjs --url … --strict-text-bounds` drives this page
  unchanged.

  SERVE IT, do not open it from disk: the children are read through
  `contentWindow`, which a file:// document cannot do (every file:// page is
  its own opaque origin), and the page says so rather than passing silently.
-->
<link rel="stylesheet" href="page_styles.css">
<style>
  /* The only rules that are NOT the page's: the harness chrome. */
  html, body { background: #16100b; }
  #widths { position: absolute; inset: 0; display: flex; flex-direction: column;
            overflow: auto; }
  #widths iframe { border: 0; display: block; background: #16100b; flex: none; }
  #verdict { position: absolute; right: 0; bottom: 0; z-index: 99;
             color: #cbbfae; font: 11px/1.3 system-ui, sans-serif;
             background: rgba(0,0,0,.6); padding: 4px 6px; white-space: pre; }
</style>
<body>
<script>
(function () {
  'use strict';

  // The caps from src/battlecode/sim_types.nim, in RUNES. Astral-plane
  // characters are used on purpose: they are the ones a byte-slice would cut
  // in half, and a broken codepoint is exactly what makes a replay unreadable
  // to everything except one lenient viewer.
  var MAX_NOTE_RUNES = 280;
  var MAX_MOTTO_RUNES = 48;
  // The featured-match frame, a tablet width and desktop -- ONE ROW PER
  // YEAR, because each year's readouts are different elements under
  // different CSS and a fixture that only lays out bc26 says nothing about
  // bc20's flood, soup, unit and doctrine panels, bc21's vote, influence,
  // unit and doctrine panels, or bc24's flag, crumb, level and doctrine
  // panels.
  var SIZES = [[360, 640], [720, 900], [1280, 720]];
  var YEARS = ['bc26', 'bc20', 'bc21', 'bc24'];

  function runes(text) { return Array.from(text); }
  function repeatRunes(text, count) {
    var out = '';
    for (var i = 0; i < count; i++) out += text;
    return out;
  }

  function fail(message) {
    document.documentElement.setAttribute('data-replay-error', message);
    console.error('renderer fixture: ' + message);
  }

  var params = new URLSearchParams(location.search);
  var inner = params.get('w');
  var yearParam = params.get('year');
  var year = (yearParam === 'bc20' || yearParam === 'bc21' ||
              yearParam === 'bc24') ? yearParam : 'bc26';

  // ------------------------------------------------------------------
  // Parent: one iframe per width, each posting its own verdict back.
  // ------------------------------------------------------------------
  if (!inner) {
    var box = document.createElement('div');
    box.id = 'widths';
    document.body.appendChild(box);
    var readout = document.createElement('div');
    readout.id = 'verdict';
    document.body.appendChild(readout);
    var frames = [];
    var labels = [];
    YEARS.forEach(function (year) {
      SIZES.forEach(function (size) {
        var frame = document.createElement('iframe');
        frame.width = String(size[0]);
        frame.height = String(size[1]);
        frame.src = location.pathname + '?w=' + size[0] + '&year=' + year;
        box.appendChild(frame);
        frames.push(frame);
        labels.push(year + ' @ ' + size[0] + 'px');
      });
    });
    var deadline = Date.now() + 30000;
    (function collect() {
      var lines = [];
      var problem = null;
      var pending = false;
      for (var i = 0; i < frames.length; i++) {
        var child;
        try {
          child = frames[i].contentWindow;
        } catch (blocked) {
          fail('the fixture must be SERVED (http://), not opened from disk: ' +
            'a file:// parent cannot read its own iframes');
          return;
        }
        if (!child || child.__fixtureVerdict === undefined) { pending = true; continue; }
        lines.push(labels[i] + ': ' + (child.__fixtureVerdict || 'ok'));
        if (child.__fixtureVerdict && !problem) {
          problem = labels[i] + ': ' + child.__fixtureVerdict;
        }
      }
      readout.textContent = lines.join('\n');
      if (pending && !problem) {
        if (Date.now() > deadline) {
          fail('a width never reported: ' + lines.join(' | '));
          return;
        }
        setTimeout(collect, 100);
        return;
      }
      window.__fixtureOverflow = problem;
      document.documentElement.setAttribute('data-fixture-drawn', 'true');
      if (problem) fail(problem);
      else document.documentElement.setAttribute('data-replay-loaded', 'true');
    })();
    return;
  }

  // ------------------------------------------------------------------
  // Child: the page's own chrome, at this width, with both seats' readouts
  // at their full rune caps.
  // ------------------------------------------------------------------
  var notes = repeatRunes('\u{1F400} betray at 700 then take the crowns ', 20);
  notes = runes(notes).slice(0, MAX_NOTE_RUNES).join('');
  var motto = runes(repeatRunes('\u{1F9C0} Trust, briefly. ', 10))
    .slice(0, MAX_MOTTO_RUNES).join('');
  if (runes(notes).length !== MAX_NOTE_RUNES ||
      runes(motto).length !== MAX_MOTTO_RUNES) {
    fail('the fixture did not build full-cap strings');
    return;
  }

  var ALIASES = ['CLAN ASH', 'CLAN BASIL'];
  var NAMES = ['daveey', 'daveey-1'];
  var WORDS = [
    'retaliates only, hunts cats, steady spawning, keeps 3 kings, ' +
      '60 rat traps, 40 cat traps, 50% ferrying, walls its kings in',
    'betrays at round 700, feeds rats to cats, swarm spawning, keeps 5 kings, ' +
      '120 rat traps, 0 cat traps, 90% ferrying, walls the chokepoints, ' +
      'throws rats to cats'
  ];

  // relayout()'s own arithmetic (client/replay_broadcast.html): --hudscale
  // from the width, --topband from the scale, --band from the measured
  // transport height (76 px is what the inherited bar measures).
  // ONE ATTRIBUTE picks the year, exactly as the page does from the replay
  // header; the stylesheet extracted from client/replay_broadcast.html then
  // shows one block and hides the other.
  document.documentElement.setAttribute('data-year', year);

  var scale = Math.max(0.62, Math.min(1, window.innerWidth / 1100));
  var root = document.documentElement.style;
  root.setProperty('--hudscale', String(scale));
  root.setProperty('--topband', Math.round(58 * scale) + 'px');
  root.setProperty('--band', '76px');

  function plate(slot, team) {
    return '<div class="plate ' + team + '">' +
      '<span class="plate-name">' + ALIASES[slot] + '</span>' +
      '<span class="plate-sub">' + NAMES[slot] + ' \u00b7 ' + motto + '</span>' +
      '<span class="plate-pts">' + (slot === 0 ? 73 : 26) + '</span>' +
      '</div>';
  }
  var econ = '<span></span><b>Clan Ash</b><b>Clan Basil</b>';
  [['kings built', 4, 2], ['cheese delivered', 12480, 9310],
   ['cats damaged', 8000, 6120], ['traps laid', 106, 34],
   ['dirt placed', 218, 96]].forEach(function (r) {
    econ += '<span>' + r[0] + '</span><span>' + r[1] + '</span><span>' +
      r[2] + '</span>';
  });
  // The panel EXACTLY as the page builds it (r2-D3): a header button that
  // re-opens it and a capped, scrollable body. Full-cap notes on both seats
  // is the case that put the doctrine card over the board in the live
  // featured match, and the case a scripted CI replay can never produce.
  var doctrines = '<button id="doctrines-toggle" type="button" ' +
    'aria-expanded="true" aria-controls="doctrines-body">▾ Doctrines</button>' +
    '<div class="dbody" id="doctrines-body">';
  for (var i = 0; i < 2; i++) {
    doctrines += '<div class="dline"><span class="dname">' + ALIASES[i] +
      '</span> — ' + WORDS[i] + '<br><i>' + notes + '</i></div>';
  }
  doctrines += '</div>';

  // --- the bc20 row: the same full-cap strings through bc20's own words ---
  var BC20_WORDS = [
    'lattices inward first, never commits a rush, walls at 250, terraforms ' +
      'from 300, lattice radius 6, steady landscapers, steady miners, ' +
      '2 vaporators, drones harass, 2 net guns',
    'rushes the enemy HQ, commits at round 240, walls at 300, terraforms ' +
      'from 500, lattice radius 3, swarm landscapers, lean miners, ' +
      'no vaporators, drones bust walls, no net guns'
  ];
  var bc20Soup = '<span></span><span>Clan Ash</span><span>Clan Basil</span>';
  [['soup', 1482, 903], ['mined', 24800, 19310], ['refined', 18240, 15102]]
    .forEach(function (r) {
      bc20Soup += '<span>' + r[0] + '</span><b>' + r[1] + '</b><b>' +
        r[2] + '</b>';
    });
  var bc20Units = '';
  for (var u = 0; u < 2; u++) {
    bc20Units += '<div>' + ALIASES[u] +
      ' Mi <b>12</b> La <b>18</b> Dr <b>9</b> Va <b>4</b> NG <b>3</b> ' +
      'DS <b>2</b> FC <b>1</b> <span class="hqdirt">dirt 34/50</span></div>';
  }
  var bc20Doctrines = '';
  for (var v = 0; v < 2; v++) {
    bc20Doctrines += '<div class="dline"><span class="dname">' + ALIASES[v] +
      '</span> ' + NAMES[v] + ' — ' + BC20_WORDS[v] +
      '<br><i>' + notes + '</i></div>';
  }

  // --- the bc21 row: the same full-cap strings through bc21's own words ---
  var BC21_WORDS = [
    'turtles and prints money, 70 % of spend on slanderers, 15 % of spend ' +
      'on muckrakers, politicians ramp with the round, escalates the bid ' +
      'when ahead, takes the neutral centres first, screens home, empowers ' +
      'at 140 %, converts rather than kills, stops compounding at round 1100',
    'spams muckrakers, 10 % of spend on slanderers, 70 % of spend on ' +
      'muckrakers, cheap politicians, bids a flat 2, takes the neutral ' +
      'centres first, flanks wide, empowers on contact, kills rather than ' +
      'converts, stops compounding at round 250'
  ];
  var bc21Influence = '<span></span><span>Clan Ash</span><span>Clan Basil</span>';
  [['influence', 18422, 9103], ['income', 24, 16], ['centres', '5 / 8', '3 / 8']]
    .forEach(function (r) {
      bc21Influence += '<span>' + r[0] + '</span><b>' + r[1] + '</b><b>' +
        r[2] + '</b>';
    });
  var bc21Units = '';
  for (var q = 0; q < 2; q++) {
    bc21Units += '<div>' + ALIASES[q] +
      ' Po <b>142</b> Sl <b>38</b> Mu <b>217</b> ' +
      '<span class="buff">&times;1.043</span></div>';
  }
  var bc21Doctrines = '';
  for (var z = 0; z < 2; z++) {
    bc21Doctrines += '<div class="dline"><span class="dname">' + ALIASES[z] +
      '</span> ' + NAMES[z] + ' — ' + BC21_WORDS[z] +
      '<br><i>' + notes + '</i></div>';
  }

  // --- the bc24 row: the same full-cap strings through bc24's own words ---
  var BC24_WORDS = [
    'a balanced flock, rushes the flags at round 450, spends 30 % of its ' +
      'crumbs on traps, traps ringing its own flags, stun and explosive ' +
      'traps in turn, heals the most wounded, digs water across the ' +
      'approaches, takes attack, then heal, then capture upgrades, trades ' +
      'down to 400 HP, sends 2 escorts with a carrier',
    'all-in on attack, rushes the flags at round 260, spends 10 % of its ' +
      'crumbs on traps, traps at the chokes, stun traps only, heals the flag ' +
      'carrier first, fills a path through the water, takes capture, then ' +
      'attack, then heal upgrades, trades down to 250 HP, sends 5 escorts ' +
      'with a carrier'
  ];
  var bc24Crumbs = '<span></span><span>Clan Ash</span><span>Clan Basil</span>';
  [['crumbs', 18422, 9103], ['income', 10, 10], ['traps', 31, 24],
   ['water', 412, 412]].forEach(function (r) {
    bc24Crumbs += '<span>' + r[0] + '</span><b>' + r[1] + '</b><b>' +
      r[2] + '</b>';
  });
  var bc24Levels = '';
  for (var k24 = 0; k24 < 2; k24++) {
    bc24Levels += '<div>' + ALIASES[k24] +
      ' \u2694 <b>118</b> \u271a <b>64</b> \u26cf <b>22</b> ' +
      '<b>47</b>/50 <span class="jail">jail 3</span>' +
      '<span class="up lit">\u2694</span><span class="up lit">\u2691</span>' +
      '<span class="up">\u271a</span></div>';
  }
  bc24Levels += '<div class="jail">jail rail A25 A18 A7 B22 B11 B4</div>';
  var bc24Doctrines = '';
  for (var m24 = 0; m24 < 2; m24++) {
    bc24Doctrines += '<div class="dline"><span class="dname">' +
      ALIASES[m24] + '</span> ' + NAMES[m24] + ' — ' + BC24_WORDS[m24] +
      '<br><i>' + notes + '</i></div>';
  }

  document.body.innerHTML =
    '<div id="viewport"><div id="stage"><div id="chrome">' +
      '<div id="scorebug">' +
        '<div class="plates" id="plates-l">' + plate(0, 'ash') + '</div>' +
        '<div class="clock-col"><div class="clock amb" id="clock">' +
          '<div class="time" id="clock-time">0:00</div>' +
          '<div class="caption" id="clock-caption">game 3 of 3 — DefaultMedium</div>' +
          '<button type="button" id="bc20-doctrines-toggle" hidden>doctrines</button>' +
          '<button type="button" id="bc21-doctrines-toggle" hidden>doctrines</button>' +
          '<button type="button" id="bc24-doctrines-toggle" hidden>doctrines</button>' +
        '</div></div>' +
        '<div class="plates" id="plates-r">' + plate(1, 'basil') + '</div>' +
      '</div>' +
      '<div id="coopchip" class="backstab">BACKSTAB — Clan Basil, round 1612</div>' +
      '<div id="econ">' + econ + '</div>' +
      '<div id="doctrines">' + doctrines + '</div>' +
      '<div id="bc20-flood"><span class="lbl">WATER</span> <b>4.71</b>' +
        '<span class="gauge"><i style="width:62%"></i></span>' +
        '<span>62% flooded</span>' +
        '<span class="hqelev">CLAN ASH HQ elev 8</span>' +
        '<span class="hqelev">CLAN BASIL HQ elev 3</span></div>' +
      '<div id="bc20-units">' + bc20Units + '</div>' +
      '<div id="bc20-soup">' + bc20Soup + '</div>' +
      '<div id="bc20-doctrines">' +
        '<button type="button" id="bc20-doctrines-close" ' +
        'aria-label="Dismiss doctrines">&times;</button>' +
        '<div id="bc20-doctrines-body">' + bc20Doctrines + '</div></div>' +
      '<div id="bc21-votes"><span class="lbl">CLAN ASH</span> <b>812</b>' +
        '<span class="gauge"><i class="a" style="width:57%"></i>' +
        '<i class="b" style="width:43%"></i></span>' +
        '<b>604</b> <span class="lbl">CLAN BASIL</span>' +
        '<span class="clinch">751 to clinch</span></div>' +
      '<div id="bc21-units">' + bc21Units + '</div>' +
      '<div id="bc21-influence">' + bc21Influence + '</div>' +
      '<div id="bc21-doctrines">' +
        '<button type="button" id="bc21-doctrines-close" ' +
        'aria-label="Dismiss doctrines">&times;</button>' +
        '<div id="bc21-doctrines-body">' + bc21Doctrines + '</div></div>' +
      '<div id="bc24-flags"><span class="lbl">CLAN ASH</span>' +
        '<span class="pips">\u25cf<i class="carried">\u25cf</i>\u25cb</span>' +
        '<span>\u2014</span>' +
        '<span class="pips">\u25cf\u25cb\u25cb</span>' +
        '<span class="lbl">CLAN BASIL</span>' +
        '<span class="towin">2 to win</span></div>' +
      '<div id="bc24-levels">' + bc24Levels + '</div>' +
      '<div id="bc24-crumbs">' + bc24Crumbs + '</div>' +
      '<div id="bc24-doctrines">' +
        '<button type="button" id="bc24-doctrines-close" ' +
        'aria-label="Dismiss doctrines">&times;</button>' +
        '<div id="bc24-doctrines-body">' + bc24Doctrines + '</div></div>' +
    '</div></div></div>';

  // The verdict: nothing may leave the frame, and nothing may hide text
  // inside itself. Every element under #chrome is measured, not just the four
  // containers — a container fixed to the frame's width cannot report that
  // the caption inside it ran off the end.
  function problem() {
    var probe = year === 'bc26' ? 'doctrines' : year + '-doctrines';
    if (getComputedStyle(document.getElementById(probe)).position !==
        'absolute') {
      return 'page_styles.css did not load — the fixture would be testing ' +
        'nothing (extracted from client/replay_broadcast.html by ci.yml)';
    }
    var frame = document.documentElement.getBoundingClientRect();
    // Content inside a SCROLLING box is laid out at its full height and
    // clipped by the box, so its rect legitimately runs past the frame. The
    // box itself is still measured; its children are its business.
    function insideScroller(el) {
      for (var p = el.parentElement; p && p.id !== 'chrome'; p = p.parentElement) {
        var oy = getComputedStyle(p).overflowY;
        if (oy === 'auto' || oy === 'scroll') return true;
      }
      return false;
    }
    var nodes = document.querySelectorAll('#chrome, #chrome *');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (getComputedStyle(el).display === 'none') continue;
      if (insideScroller(el)) continue;
      var b = el.getBoundingClientRect();
      var id = el.id || el.className || el.tagName;
      if (b.width === 0 && b.height === 0) continue;
      if (b.left < frame.left - 1 || b.right > frame.right + 1 ||
          b.top < frame.top - 1 || b.bottom > frame.bottom + 1) {
        return id + ' escapes the frame [' + Math.round(b.left) + ',' +
          Math.round(b.top) + ',' + Math.round(b.right) + ',' +
          Math.round(b.bottom) + '] of [0,0,' + Math.round(frame.right) +
          ',' + Math.round(frame.bottom) + ']';
      }
    }
    // Hidden content, over the readouts this fixture FILLS: a box that
    // clips its own text reads short and reports nothing. (The inherited
    // clock column is measured for containment above, but its text is the
    // starter's, not a doctrine's.)
    var FILLED = {
      bc26: '#scorebug .plate, #scorebug .plate *, #coopchip, #econ, #econ *, ' +
        '#doctrines, #doctrines *',
      bc20: '#scorebug .plate, #scorebug .plate *, #bc20-flood, #bc20-flood *, ' +
        '#bc20-soup, #bc20-soup *, #bc20-units, #bc20-units *, ' +
        '#bc20-doctrines, #bc20-doctrines *',
      bc21: '#scorebug .plate, #scorebug .plate *, #bc21-votes, #bc21-votes *, ' +
        '#bc21-influence, #bc21-influence *, #bc21-units, #bc21-units *, ' +
        '#bc21-doctrines, #bc21-doctrines *',
      bc24: '#scorebug .plate, #scorebug .plate *, #bc24-flags, #bc24-flags *, ' +
        '#bc24-crumbs, #bc24-crumbs *, #bc24-levels, #bc24-levels *, ' +
        '#bc24-doctrines, #bc24-doctrines *'
    };
    var filled = document.querySelectorAll(FILLED[year]);
    for (var j = 0; j < filled.length; j++) {
      var node = filled[j];
      var nodeStyle = getComputedStyle(node);
      if (nodeStyle.display === 'none') continue;
      // A box that SCROLLS is not a box that hides: the doctrine body is
      // capped and scrollable on purpose so the panel can never own the
      // board, and its own bound is measured below.
      if (nodeStyle.overflowY === 'auto' || nodeStyle.overflowY === 'scroll') {
        continue;
      }
      if (node.scrollWidth > node.clientWidth + 1 ||
          node.scrollHeight > node.clientHeight + 1) {
        return (node.id || node.className || node.tagName) +
          ' hides its own content (' + node.scrollWidth + 'x' +
          node.scrollHeight + ' inside ' + node.clientWidth + 'x' +
          node.clientHeight + ')';
      }
    }
    // THE BOARD IS THE PICTURE (r2-D3). Even opened, at full-cap notes on
    // both seats, at 360 px, the doctrine panel may not take half the frame:
    // that is how a working replay came to look like a still image in two
    // live screenshots a minute apart.
    // `probe` is the year's own doctrine panel: under data-year="bc20" or
    // "bc21" the inherited #doctrines is `display: none !important`, so
    // measuring it there would report a 0x0 rect and pass this rule vacuously
    // (r1-F1).
    var panel = document.getElementById(probe).getBoundingClientRect();
    if (panel.height > frame.height * 0.5) {
      return 'the doctrine panel takes ' +
        Math.round((panel.height / frame.height) * 100) + '% of the frame ' +
        'height with full-cap notes — the board is the picture';
    }

    // The strings must still be at their caps: one quietly shortened remark
    // leaves this fixture passing while testing nothing.
    var sub = document.querySelector('.plate-sub');
    if (runes(sub.textContent).length !==
        runes(NAMES[0]).length + 3 + MAX_MOTTO_RUNES) {
      return 'the motto was shortened before it was measured';
    }
    var shown = document.querySelectorAll('#' + probe + ' .dline i');
    if (!shown.length || shown[0].textContent !== notes) {
      return 'the notes were shortened before they were measured';
    }
    return null;
  }

  // NOT requestAnimationFrame: an iframe scrolled out of the parent's view is
  // rAF-throttled and would never report, which reads as "the fixture hung"
  // rather than "one width was never measured". Fonts first — a metric read
  // before the font settles is a different measurement.
  function measure() {
    var found = problem();
    window.__fixtureOverflow = found;
    document.documentElement.setAttribute('data-fixture-drawn', 'true');
    if (found) {
      fail(found);
    } else {
      document.documentElement.setAttribute('data-replay-loaded', 'true');
    }
    // The parent reads this directly (same origin, hence "serve it"): the
    // harness replaces `window.parent` with a bridge stub in every frame, so
    // a postMessage from here would never reach the real parent.
    window.__fixtureVerdict = found;
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { setTimeout(measure, 50); });
  } else {
    setTimeout(measure, 50);
  }
})();
</script>
</body>
