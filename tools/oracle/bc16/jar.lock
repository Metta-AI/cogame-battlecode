  "note": "THERE IS NO `SPEC_VERSION` IN 2016's GameConstants -- the field does not exist -- so the sha256 and the size are the only pins, plus the `battlecode-version` entry (2016.0.2.2), which in this jar is a FILE AT THE JAR ROOT and not a manifest attribute -- META-INF/MANIFEST.MF carries only Manifest-Version, Ant-Version and Created-By -- so build_oracle.sh reads it with `unzip -p`. Tier B cross-checks every constant against the jar's own classes anyway. The jar is SELF-CONTAINED: 2484 entries, 449 battlecode classes, org/objectweb/asm (58 -- the instrumenter), com/thoughtworks/xstream (463 -- the map XML deserialiser), com/fasterxml (765), org/apache/commons/lang3 (236), battlecode/instrumenter/bytecode/resources/MethodCosts.txt, and 54 .xml map resources -- so this job needs NO Ant, NO Ivy resolution, NO Gradle, NO shim, NO Maven download list and NO deps.lock. THERE IS NO gnu/trove AND NO net/sf/jsi IN IT AND NEITHER IS NEEDED: 2016's engine uses LinkedHashMap and HashMap from the JDK, so the trove-iteration-order problem that forced bc22's trove.nim does not arise here. Every map in every bc16 pool is one of those 54, so no --map-dir is needed either. IT MUST RUN ON TEMURIN 8: the jar bundles a 2016-era ASM and a 2016-era XStream and the whole instrumenter is built for Java 8 class files; under a modern JDK the instrumenter throws IllegalArgumentException inside ClassReader.<init> on every player class load, nothing is ever built, the game ends in one round and the job would exit 0 while proving nothing. Bc16Trace.java exits 3 on that condition and ci.yml additionally asserts, per pair, that the game reached at least round 250 (measured 298-1424: neither oracle bot survives the 3000-round cap, because the horde eats an idle archon line), that at least 10 robots were alive at once (measured 36-162), that a zombie really took a turn and that infection really fired -- plus, summed over the eighteen pairs, at least 150 peak zombies (measured 735)."
