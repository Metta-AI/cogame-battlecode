  "note": "MEASURED IN PHASE 20, NOT COPIED: the artefact was downloaded and its sha256 and byte size recomputed (sha256sum + stat) before this file was written, and both match the design note. The published .pom carries NO <dependencies> element and the jar is a FAT jar -- 10210 entries, 116 battlecode classes, and it bundles gnu/trove (1618), net/sf/jsi (11), kotlin (~380), com/github/davidmoten flatbuffers, org/objectweb/asm (59 -- the instrumenter), org/apache/commons/{lang3,cli,io} (381), org/slf4j (45), org/java_websocket (68), com/thoughtworks/xstream (12) and the shaded junit/mockito/hamcrest test tree -- SO THIS JOB NEEDS NO GRADLE, NO MAVEN RESOLUTION, NO deps.lock AND NO SHIM. It also carries all 70 battlecode/world/resources/*.map17 resources, so no --map-dir is needed either and tools/convert_maps_bc17.py reads the maps straight out of the jar with no JVM -- VERIFIED in phase 20: the converter's pure-Python flatbuffer walk and the JVM's own GameMapIO.loadMapAsResource agree BYTE FOR BYTE on all 22 committed boards (5204 canonical raw-bits lines). Unlike 2016 there IS a GameConstants.SPEC_VERSION (\"1.0\"), so the pins are sha256 + byte size + SPEC_VERSION read by reflection. IT MUST RUN ON TEMURIN 8: the jar bundles a 2017-era ASM 5.0.4 and the whole instrumenter is built for Java 8 class files; under a modern JDK the instrumenter throws IllegalArgumentException inside ClassReader.<init> on every player class load, nothing is ever built, the game ends in one round and the job would exit 0 while proving nothing (the bc22/bc23 measurement, and 2017's ASM is the same vintage). NOTE that gnu/trove AND net/sf/jsi ARE both present and both ARE load-bearing here, unlike 2016: trove's TIntObjectHashMap iteration order is observable through GameWorld.updateTrees's float32 sum and through senseBroadcastingRobotLocations, and jsi's RTree candidate order is observable through senseNearbyRobots -- see docs/PARITY.md section bc17, D1 and D2."
